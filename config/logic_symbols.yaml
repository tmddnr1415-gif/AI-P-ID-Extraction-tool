# LOGIC 검토 — 논리 블록 어휘 (업계 표준 ISA-S5.2 · 범례 G003 "SYMBOL & LEGEND (1)" 에 인쇄된 이름)
#
# 프로젝트 값이 아니다.  범례가 인쇄한 블록 글자와 그 동작 정의를 옮긴 것이다 (plant_standard_abbr.yaml 과
# 같은 층).  도면의 블록 글자는 선으로 그려져 있어 글자 사전(glyphs.py)으로 읽고, 읽은 글자들을 아래 낱말
# 중 **글자 수가 같은 것**에 맞대 가장 잘 맞는 하나를 고른다.  맞는 낱말이 없거나 1·2위가 붙으면
# UNKNOWN 으로 두고 사람이 정한다 (지어내지 않는다).
#
# words 의 '*' 는 아무 글자 (타이머의 소문자 t 처럼 사전에 없는 글자 자리).
# 동작(logic):
#   and / or / not / nand / nor           — 범례 G003 정의 그대로
#   memory (set|reset dominant)          — S 칸에 들어온 1 이면 출력 1, R 칸에 들어온 1 이면 0, 둘 다면 우선 칸이 이긴다.
#                                          우선 칸은 글자에 'O' 가 붙은 칸이다 (So = SET DOMINANT · Ro = RESET DOMINANT)
#   delay_on (GT)                        — 입력이 1 로 바뀌고 t 동안 유지되면 1
#   delay_off (DT)                       — 입력이 1 이면 바로 1, 0 으로 바뀌고 t 뒤에 0
#   pulse (PD)                           — 입력이 0→1 로 바뀌면 t 동안 1
#   source                               — 사람이 누르는 입력 (PB 누름단추 · HMI)
#   sink                                 — 받기만 한다 (ANN 경보 · SOE 기록 · 램프)
functions:
  AND:  {words: [AND], logic: and}
  NAND: {words: [NAND], logic: nand}
  OR:   {words: [OR], logic: or}
  NOR:  {words: [NOR], logic: nor}
  NOT:  {words: [NOT], logic: not}
  GT:   {words: ["*GT", GT], logic: delay_on}
  DT:   {words: ["*DT", DT], logic: delay_off}
  PD:   {words: ["*PD", PD], logic: pulse}
  ANN:  {words: [ANN], logic: sink}
  SOE:  {words: [SOE], logic: sink}
  PB:   {words: [PB], logic: source}
# 메모리 칸 글자 (두 칸으로 나뉜 상자의 각 칸)
memory_cells:
  set:   [S, SO]
  reset: [R, RO]
  dominant_mark: O
# 연결 기호 — 원 안 글자 한 자 (같은 장에서 같은 글자끼리 이어진다)
connector_chars: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
# 표 머리글 낱말 → 칸 역할 (L21 · 19VA 처럼 머리글을 진짜 글자로 인쇄한 양식).  칸 순서가 양식마다 달라도
# (FROM|NO.|TAG NO.|SERVICE · NO.|SERVICE|TAG NO.) 머리글이 칸을 정한다.  머리글을 못 읽으면 예전처럼 NO. 열 기준.
table_headers:
  abv:  [ABV, ABBREVIATION]
  kks:  [TAG, KKS]
  desc: [SERVICE, DESCRIPTION]
  fm:   [FROM, FM]
  to:   [TO]
  "no": ["NO.", "NO"]
# 범례 표(FUNCTION | SYMBOL | DEFINITION)의 기능 이름 → 동작 (L21 · 19VA "SIGNAL PROCESSING SYMBOLS").
# 어느 **모양**이 어느 기능인지는 그 묶음의 범례가 말하고(legend.py), 여기는 기능 이름(ISA-S5.2 어휘)의 동작만 적는다.
# 이름은 괄호 안을 뺀 FUNCTION 칸 글자와 정확히 같아야 한다 (QUALIFIED OR 를 OR 로 읽지 않게).
#   source  — 사람이 주는 입력 (누름단추 · 아날로그 감시의 상태 — 값은 도면이 정하지 않는다)
#   const   — 언제나 그 글자 값 (FORCED INPUT 의 1 · 0 · ACTIVATION 의 ON = 1)
legend_functions:
  AND: and
  OR: or
  NOT: not
  NAND: nand
  NOR: nor
  ON DELAY: delay_on
  OFF DELAY: delay_off
  MEMORY: memory
  ALM: sink
  SER: sink
  DISPLAY: sink
  INDICATION: sink
  ACTIVATION: const
  FORCED INPUT: const
  PUSH BUTTON: source
  SIGNAL MONITOR: source
  # ISA-S5.2 의 시간 기능 약어 (L23 · 1A1Y 처럼 상자 안에 약어만 인쇄한 양식) — DI = delay of initiation (켜짐 지연) ·
  # DT = delay of termination (꺼짐 지연) · PO = pulse output.  범례 표에 이 이름 행이 있으면 범례가 이긴다.
  DI: delay_on
  PO: pulse
# 기능 칸이 여러 행을 묶은 경우(SPECIAL) — 정의 문장에 이 구절이 있으면 그 동작
legend_definitions:
  pulse: ["FOR TIME T WHEN INPUT TRANSIT"]
