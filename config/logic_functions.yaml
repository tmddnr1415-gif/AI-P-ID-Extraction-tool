# LOGIC 기능 책 (function book) — 시뮬레이터가 아는 기능마다 "범례가 정한 동작" 한 줄.
#
# 열쇠는 시뮬레이터의 logic 이름(`sim.py` · `blocks.py`)이고, 아날로그 연산은 `logic_analog.yaml` 의 `ko`·`eq` 를 그대로 쓴다
# (`app/logic/functions.py` 가 합친다).  화면 근거 패널의 '동작 (범례)' 줄 · `/logic/api/functions` · `docs/logic_functions.md` 가 이 한 벌을 읽는다.
#   ko      기능 이름
#   does    동작 한 줄 (사용자 말)
#   legend  범례 원문 요지 (HRSG G003 · 19VA SIGNAL PROCESSING SYMBOLS)
#   sim     시뮬레이터가 실제로 하는 것 (범례와 다르면 여기 적는다)
#   in/out  단자
functions:
  and:      {ko: AND,  does: "모든 입력이 1 일 때만 출력 1",                        legend: "OUTPUT TRUE ONLY IF ALL INPUTS ARE TRUE",
             sim: "입력을 다 읽지 못하면 출력 없음(0) · 연결 안 된 입력은 0", in: "2개 이상", out: "1"}
  or:       {ko: OR,   does: "입력 중 하나라도 1 이면 출력 1",                     legend: "OUTPUT TRUE IF ANY INPUT IS TRUE",
             sim: "읽힌 입력 하나가 1 이면 나머지를 몰라도 1", in: "2개 이상", out: "1"}
  nand:     {ko: NAND, does: "입력 중 하나라도 0 이면 출력 1 (AND 의 반대)",        legend: "OUTPUT TRUE IF ANY INPUT IS FALSE",
             sim: "", in: "2개 이상", out: "1"}
  nor:      {ko: NOR,  does: "모든 입력이 0 일 때만 출력 1 (OR 의 반대)",           legend: "OUTPUT TRUE ONLY IF ALL INPUTS ARE FALSE",
             sim: "", in: "2개 이상", out: "1"}
  not:      {ko: NOT,  does: "입력이 0 이면 1 · 1 이면 0",                          legend: "OUTPUT IS THE INVERSE OF THE INPUT",
             sim: "입력이 연결 안 됐으면 0 으로 보아 출력 1 (L46)", in: "1", out: "1"}
  vote:     {ko: "투표 (자격 OR · A/B)", does: "B 개 입력 중 1 인 것이 A 개 이상(부호가 있으면 그 부호대로)일 때 출력 1",
             legend: "A/B: OUTPUT TRUE ONLY IF AT LEAST A OF B INPUTS ARE TRUE · QUALIFIED OR: In > N / ≥ / < / ≤ / =",
             sim: "부호 ≥ > ≤ < = ≠ (param.op) · 선 글자의 밑줄(_2>3 · 2=3)은 ≥ 로", in: "B 개", out: "1"}
  memory:   {ko: "메모리 (S-R 래치)", does: "S 가 1 이면 Q=1 로 걸리고 R 이 1 이면 Q=0 · 둘 다 1 이면 우선 칸(SET/RESET 우선)대로, 기본 메모리는 상태가 한 번 바뀜 · Q 와 /Q 는 언제나 반대",
             legend: "SET: C=1 · RESET: C=0 · BOTH TRUE: SET DOMINANT C=1 / RESET DOMINANT C=0 / BASIC: OUTPUTS CHANGE STATE · D IS ALWAYS OPPOSITE OF C",
             sim: "입력이 아직 안 정해진 첫 바퀴는 상태를 두고 본다 · S·R 함께 1 은 함께 1 이 되는 순간 한 번만", in: "S · R", out: "Q · /Q"}
  delay_on: {ko: "켜짐 지연 (GT · ON DELAY)", does: "입력이 1 로 바뀌고 t 초 동안 유지되면 출력 1 · 입력 0 또는 R 이면 바로 0",
             legend: "GT: OUTPUT TRUE AFTER INPUT HAS BEEN TRUE FOR t · RESET BY R", sim: "t = 사람 값 → 도면 글자(t= 3sec) → 기본 5초 · 위쪽 단자는 시간값 · 아래쪽은 리셋 (논리 입력 아님)",
             in: "1 (+ t · R)", out: "1"}
  delay_off: {ko: "꺼짐 지연 (DT · OFF DELAY)", does: "입력이 1 이면 바로 1 · 입력이 0 으로 떨어진 뒤 t 초 동안 1 을 붙들다 0",
             legend: "DT: OUTPUT STAYS TRUE FOR t AFTER INPUT GOES FALSE", sim: "t 는 GT 와 같은 순서", in: "1 (+ t · R)", out: "1"}
  pulse:    {ko: "펄스 (PD)", does: "입력이 0→1 로 바뀌는 순간부터 t 초 동안만 출력 1",
             legend: "PD: OUTPUT TRUE FOR t ON RISING EDGE OF INPUT", sim: "t 는 GT 와 같은 순서 · 가만히 있으면 0", in: "1 (+ t · R)", out: "1"}
  toggle:   {ko: "토글 (SRST)", does: "입력이 1 로 바뀔 때마다 출력이 뒤집힌다",
             legend: "NOTE: OUTPUT STATE IS INVERTED BY EACH MOMENTARY TRUE SIGNAL (그 장 NOTE 가 정의)", sim: "오르는 변마다 · 거꾸로 맞추기는 입력 한 번", in: "1", out: "1"}
  step:     {ko: "STEP (시퀀스 단계)", does: "STEP_IN 이 1 이면 C_STEP 1 · CRIT 까지 1 이면 STEP_OUT 1",
             legend: "STEP 상자 (시퀀스)", sim: "근사 모델 — C_STEP = STEP_IN · STEP_OUT = STEP_IN AND CRIT", in: "STEP_IN · CRIT", out: "C_STEP · STEP_OUT"}
  source:   {ko: "신호원 · 누름단추 · 상수", does: "사람이 준 값 · FORCED INPUT 1/0 · ACTIVATION 은 언제나 1",
             legend: "ACTIVATION: ALWAYS TRUE · FORCED INPUT 1/0", sim: "들어오는 선 없음 — 사람이 1/0 을 준다", in: "없음", out: "1"}
  connector: {ko: "연결 기호", does: "같은 글자의 짝 기호와 한 선 — 어느 하나가 1 이면 전부 1",
             legend: "SIGNAL CONNECTOR (같은 글자끼리)", sim: "짝 입력이 연결 안 됐으면 0", in: "짝", out: "짝"}
  pass:     {ko: "이음점 · 그대로 넘김", does: "입력 값을 그대로 출력",
             legend: "(그림 없음 — 선 위 이음점 · IEC '1')", sim: "", in: "1", out: "1"}
  sink:     {ko: "경보 · 기록 · 표시 (받기만)", does: "신호를 받아 표시·기록한다 — 출력 없음",
             legend: "ALM · SER · DISPLAY · INDICATION", sim: "출력을 내지 않는다", in: "1 이상", out: "없음"}
  macro:    {ko: "매크로 블록", does: "Typical 시트의 내부 로직을 상자 단자로 — 입력 단자 값으로 그 시트를 돌려 출력 단자로 낸다",
             legend: "MACRO (TYPICAL SHEET 참조)", sim: "같은 시간에 펼쳐 돌린다 (L15) · 여러 장 Typical 은 한 장으로 합침 (L38)", in: "단자", out: "단자"}
  unknown:  {ko: "판정 못 한 블록", does: "출력을 내지 않는다 — 사람이 종류를 정하면 그 기능으로",
             legend: "", sim: "그 선을 직접 1 로 줄 수 있다", in: "?", out: "?"}
