# Project-dependent values for AL NOUF1 (D00P).
#
# Every entry here was classified PROJECT in out/project_deps.md, meaning it was
# derived from this project's NOTES / KKS scheme / title block form / Excel
# template rather than from the Symbol & Legend sheets.  Values classified
# LEGEND stay in the code, with the legend page cited at the point of use.
#
# There are no defaults.  A lookup that misses in this file does not fall back
# to a guess — the caller records NEEDS_REVIEW with a reason and leaves the
# value empty.  See spike/projectconfig.py.
#
# Item numbers (P1..P18) refer to out/project_deps.md.

project:
  code: D00P
  name: AL NOUF1 PROJECT

# P7 — the whole coordinate system assumes this sheet size.
sheet:
  width_pt: 2384.0
  height_pt: 1684.0

# P6 — split between the drawing body and the title block / notes column.
# Derived from the title block frame line at x=1969.6.
regions:
  drawing_area: [38.0, 35.0, 1960.0, 1650.0]
  notes_area: [1960.0, 35.0, 2384.0, 1250.0]
  notes_text_x_max: 2330.0

# P4, P5 — title block cell coordinates, measured from this company's A1 form.
title_block:
  dwg_no_region: [1950.0, 1560.0, 2384.0, 1600.0]
  title_region: [1960.0, 1500.0, 2384.0, 1574.0]
  title_min_height: 15.0
  title_line_tol: 6.0
  project_name_region: [1960.0, 1480.0, 2384.0, 1520.0]
  project_name_min_height: 15.0
  rev_box: [2296.0, 1583.0, 2326.0, 1597.0]
  sheet_box: [2248.0, 1583.0, 2286.0, 1597.0]
  hist_rule_x0_max: 1975.0
  hist_rule_x1_min: 2320.0
  hist_rule_y: [1200.0, 1390.0]
  hist_rev_col: [1971.0, 1988.0]
  hist_date_col: [1992.0, 2070.0]
  hist_row_inset: 1.2

# P8, P9, P10 — string formats used in the title block.
formats:
  drawing_no: '^[A-Z0-9]{4}-[A-Z0-9]{7}-[A-Z0-9]{3}-\d{4}$'
  date: '^\d{1,2}\.\s?[A-Z]{3}\.\d{4}$'
  revision: '^[A-Z][0-9]?$'
  # Which characters of the drawing number carry the KKS unit code.
  # 'D00P-10LBA10-M05-0001' -> segment 1, characters 0..2 -> '10'.
  unit_code_segment: 1
  unit_code_chars: [0, 2]
  system_code_chars: [2, 5]

# P3 — the client's Excel template.  The valve deliverables use a different
# sheet name ('3.0_Valve List'), so this must move with the deliverable.
excel:
  sheet: '2.0_Instrument List'
  first_data_row: 8
  columns:
    # Quoted: YAML 1.1 reads a bare `no` as boolean false.
    'no': 1
    system: 6
    pid_no: 7
    type: 8
    qty: 9
    description: 10
    # Columns the app also fills, located by the header text the client prints
    # in row 6: 'TAG' at E and 'Scope of Supply' at AK.  There is no separate
    # column for the SCT supplier-interface flag, so that one stays in the app
    # (grid and evidence panel) rather than being written somewhere it does not
    # belong.
    tag_no: 5
    vendor_supply: 37

# P1, P2 — drawing tag -> Excel TYPE.
#
# The tag vocabulary itself is LEGEND (page 3's FIRST LETTER x SUCCEEDING
# LETTERS matrix defines TT, FE, LG and the rest).  What is project-specific is
# the *correspondence* to the Excel TYPE column: the legend has no TIT, FIT or
# LI at all — those are the Excel's own spelling, so every row below is a
# convention of this deliverable.
anchors:
  type_map:
    TT: TIT
    PT: PIT
    LT: LIT
    PDT: PDIT
    DPIT: PDIT
    FT: FIT
    LG: LI
    TI: TI
    PI: PI
    LI: LI
    FI: FI
    TIT: TIT
    PIT: PIT
    LIT: LIT
    PDIT: PDIT
    FIT: FIT
    LS: LS
    LSH: LS
    LSHH: LS
    LSL: LS
    FS: FS
    RO: RO
    FE: FE
  # Recognised on the drawing but never a row in this deliverable.
  not_field: [TW]

# P11..P15 — vendor marks.
#
# Meanings are never configured: the legend sheets define no marks at all, so
# the dictionary is read from each page's own NOTES at run time
# (docs/design.md §10.1).  Only the geometry of finding them lives here.
vendor_marks:
  # P12 — sizes at which this project draws an asterisk.  Used to recognise a
  # mark on a page whose own legend is missing; a size not listed here is not
  # silently accepted.
  glyph_sizes: [[4.0, 4.0], [5.2, 5.2]]
  blob_span: [1.5, 8.0]
  glyph_span: [3.0, 8.0]
  cluster_gap: 2.0
  # P13 — where a mark sits relative to the bubble it applies to.
  above: 25.0
  x_slack: 6.0
  note_row_tol: 6.0
  note_line_gap: 20.0
  # P15 — package boundary box carrying a mark for everything inside it.
  package_box:
    edge_cover: 0.35
    mark_margin: 20.0

# P16 — SCT supplier scope.  The symbol is LEGEND (defined on page 2 as
# 'SCT / SUPPLIER INTERFACE'); these tolerances are measured from page 6.
sct_scope:
  text_tol: 30.0
  drop_x_tol: 2.0
  drop_end_tol: 1.5

# P17 — words with no discriminating power when matching an Excel SYSTEM value
# against a drawing title.
matching:
  stopwords: [PID, 'P&ID', FOR, SYSTEM, THE, OF, AND, TO, A, B, C, '1', '2', '3', OR]

# P18 — the language this project's reviewers annotate in.
review_markup:
  script_ranges: ['가-힣']

# Q'ty multipliers.
#
# NOT the source of truth.  The multiplier is derived at run time from the
# legend's UNIT IDENTIFICATION NUMBERS table (page 5), which states the group
# and unit breakdown explicitly; deriving it means a plant with a different
# configuration works without editing this file.  The block below is used only
# if that table cannot be parsed, and its use is logged.
unit_multiplier_fallback:
  '00': 1
  '10': 2
  '11': 4

# Scope keywords that override the unit multiplier for an individual item.
# Verified on D00P-10PGB10-M05-0004, where 'AUXILIARY BOILER COOLER' carries
# '(PLANT COMMON)' directly beneath it and its 3 Excel rows are Q'ty 1 on a
# drawing whose other 21 rows are Q'ty 2.
qty_scope_overrides:
  - keyword: 'PLANT COMMON'
    multiplier: 1

# ---------------------------------------------------------------------------
# Valve rules (spike 4).  Item numbers V1..V8 refer to out/valve_project_deps.md.
#
# Only the values judged PROJECT are here.  The body and actuator *shapes* are
# LEGEND and stay in spike/detect_valves.py with the legend page cited at the
# point of use: the bowtie, the globe's waist disc, the butterfly's vane ticks,
# the open/closed fill convention and the actuator enclosure vocabulary are all
# drawn on legend pages 2 and 3, so they do not move with the project.
valves:
  # V1, V2 — how far an actuator may stand from the body it drives, and how far
  # off the stem axis.  Measured on drawing pages, not on the legend: p6 and p30
  # put the motor circle 26.9 pt along the stem, p33 up to 80.  The legend draws
  # the actuator at a fixed distance and never states a range.
  actuator_reach: 90.0
  actuator_offaxis: 12.0

  # V3 — how far a tag bubble may sit from the valve it labels.  Measured from
  # p6's MOV bubbles; a leader line can be drawn any length, so this is drafting
  # practice, not a rule.
  tag_reach: 190.0

  # V4 — the valve deliverables' Excel template.  A different sheet and a
  # different column order from the instrument list under `excel:` above; the
  # two are separate client templates, not one.
  excel:
    sheet: '3.0_Valve List'
    first_data_row: 8
    columns:
      'no': 1
      pid_no: 2
      valve_type: 3
      qty: 4
      system: 5
      description: 12
      # Row 6 prints 'TAG NUMBER' at K; row 7 sub-heads 'ACTUATOR' at Y and
      # 'BODY' at AA under the merged TYPE group.  The app writes the body it
      # read (GATE / GLOBE / BUTTERFLY) and the actuator it read (MOTOR /
      # HYDRAULIC) into those two, and leaves column C's own MOV / MOV_I / HOV
      # vocabulary alone: mapping an actuator back onto it is ambiguous
      # (MOTOR is both MOV and MOV_I) and the app has no basis to choose.
      tag_no: 11
      actuator: 25
      body: 27

  # V5 — which body types each deliverable covers.  Taken from each file's own
  # DESCRIPTION line, plus the observation that the master files ball-bodied
  # MOVs under the gate/globe heading.
  deliverables:
    - tag: CZI
      path: data/CZI_Butterfly_Valve.xlsx
      bodies: [BUTTERFLY]
    - tag: CZH
      path: data/CZH_MOV_Gate_Globe.xlsx
      bodies: [GATE, GLOBE, BALL]

  # V6 — the deliverables' own VALVE TYPE vocabulary.  This is an operation
  # mode, not a body: MOV and MOV_I are motor-operated, HOV hydraulic, CV a
  # pneumatic control valve.  Nothing in the legend names these strings.
  valve_type_actuator:
    MOV: MOTOR
    MOV_I: MOTOR
    HOV: HYDRAULIC
    CV: PNEUMATIC

  # V7 — which tags make a pneumatic valve a modulating CV rather than an
  # on-off XV.  The tag vocabulary is LEGEND (p3's CONTROL DEVICE column, p4's
  # shutoff tags); the split between the two deliverables is this client's.
  cv_tags: [FCV, LCV, PCV, TCV, CV]
  xv_tags: [XV, HV]

  # V8 (removed) — stroke signatures for drawn actuator letters used to live
  # here.  They are now derived from each document at run time: stroked
  # glyphs are clustered against each other and each cluster is labelled by a
  # valve in it that carries a text tag bubble (legend p4 pairs MOV with the M
  # circle and HV with the hydraulic box).  A cluster with no such member is
  # reported as UNLABELED_GLYPH_CLUSTER instead of being guessed.  See
  # out/stroke_bootstrap.md and spike/detect_valves.derive_glyph_library.

  # Fallback for the two rules now measured off the legend at run time
  # (spike/legend_rules.py).  These are NOT the source of truth: VANE_TICK is
  # measured from the BUTTERFLY row of legend p2 and ACT_STEM from the VALVES
  # ACTUATORS column of legend p3.  This block is used only when a legend sheet
  # cannot be read, and its use is logged with the reason.  The values are the
  # ones this project's legend yields, so a fallback run reproduces it.
  # Valve rules to switch off for this project, from detect_valves.ALL_RULES:
  # WAIST_DISC / VANE_TICK / END_BARS / STROKE_LETTER / ACT_CLEARANCE /
  # ACT_STEM / PNEUMATIC_SHELL.  Empty means every measured rule applies, which
  # is the delivered state; a name here withdraws that rule from the analysis
  # and the result records it under applied_rules.valve_rules_disabled.
  disabled_rules: []

  legend_fallback:
    butterfly:
      tick_length: 3.0
      tick_reach_radii: 1.498
      bar_reach_radii: 2.822
      bar_min_radii: 2.378
      circle_diameter: 6.06
    actuator_stem:
      stem_gap: 0.0
      stem_offaxis: 0.03
      stem_length: 19.86
      centre_to_body: 26.97
    # Legend p3 VALVES ACTUATORS, the rows it labels PNEUMATIC: the DIAPHRAGM
    # dome measures 14.22 x 7.11 (a half circle, hence aspect 0.5) and the
    # CYLINDER box 14.16 square with its piston line across the middle.  Used
    # only when that sheet cannot be measured; `derive_pneumatic` normally
    # supplies these, and the report says which of the two happened.
    pneumatic:
      dome_flat: 14.22
      dome_depth: 7.11
      dome_aspect: 0.5
      cylinder_side: 14.16
      cylinder_aspect: 1.003
      cylinder_divider: 0.5
