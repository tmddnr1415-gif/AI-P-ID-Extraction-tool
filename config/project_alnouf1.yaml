# Project-dependent values for AL NOUF1 (D00P).
#
# Every entry here was classified PROJECT in out/project_deps.md, meaning it was
# derived from this project's NOTES / KKS scheme / title block form / Excel
# template rather than from the Symbol & Legend sheets.  Values classified
# LEGEND stay in the code, with the legend page cited at the point of use.
#
# There are no defaults.  A lookup that misses in this file does not fall back
# to a guess — the caller records NEEDS_REVIEW with a reason and leaves the
# value empty.  See spike/projectconfig.py.
#
# Item numbers (P1..P18) refer to out/project_deps.md.

project:
  code: D00P
  name: AL NOUF1 PROJECT

# P7 — the whole coordinate system assumes this sheet size.
sheet:
  width_pt: 2384.0
  height_pt: 1684.0

# P6 — split between the drawing body and the title block / notes column.
# Derived from the title block frame line at x=1969.6.
regions:
  drawing_area: [38.0, 35.0, 1960.0, 1650.0]
  notes_area: [1960.0, 35.0, 2384.0, 1250.0]
  notes_text_x_max: 2330.0

# P4, P5 — title block cell coordinates, measured from this company's A1 form.
title_block:
  dwg_no_region: [1950.0, 1560.0, 2384.0, 1600.0]
  title_region: [1960.0, 1500.0, 2384.0, 1574.0]
  title_min_height: 15.0
  title_line_tol: 6.0
  project_name_region: [1960.0, 1480.0, 2384.0, 1520.0]
  project_name_min_height: 15.0
  rev_box: [2296.0, 1583.0, 2326.0, 1597.0]
  sheet_box: [2248.0, 1583.0, 2286.0, 1597.0]
  hist_rule_x0_max: 1975.0
  hist_rule_x1_min: 2320.0
  hist_rule_y: [1200.0, 1390.0]
  hist_rev_col: [1971.0, 1988.0]
  hist_date_col: [1992.0, 2070.0]
  hist_row_inset: 1.2

# P8, P9, P10 — string formats used in the title block.
formats:
  drawing_no: '^[A-Z0-9]{4}-[A-Z0-9]{7}-[A-Z0-9]{3}-\d{4}$'
  date: '^\d{1,2}\.\s?[A-Z]{3}\.\d{4}$'
  revision: '^[A-Z][0-9]?$'
  # Which characters of the drawing number carry the KKS unit code.
  # 'D00P-10LBA10-M05-0001' -> segment 1, characters 0..2 -> '10'.
  unit_code_segment: 1
  unit_code_chars: [0, 2]
  system_code_chars: [2, 5]

# P3 — the client's Excel template.  The valve deliverables use a different
# sheet name ('3.0_Valve List'), so this must move with the deliverable.
excel:
  sheet: '2.0_Instrument List'
  first_data_row: 8
  columns:
    # Quoted: YAML 1.1 reads a bare `no` as boolean false.
    'no': 1
    system: 6
    pid_no: 7
    type: 8
    qty: 9
    description: 10
    # Columns the app also fills, located by the header text the client prints
    # in row 6: 'TAG' at E and 'Scope of Supply' at AK.  There is no separate
    # column for the SCT supplier-interface flag, so that one stays in the app
    # (grid and evidence panel) rather than being written somewhere it does not
    # belong.
    tag_no: 5
    vendor_supply: 37
    # The client's own REMARK column (row 6 prints it at AO).  The app writes the
    # review axis, the reason code and what the reviewer decided, so a flagged row
    # arrives with its question and its answer rather than a blank cell.
    remark: 41

# P1, P2 — drawing tag -> Excel TYPE.
#
# The tag vocabulary itself is LEGEND (page 3's FIRST LETTER x SUCCEEDING
# LETTERS matrix defines TT, FE, LG and the rest).  What is project-specific is
# the *correspondence* to the Excel TYPE column: the legend has no TIT, FIT or
# LI at all — those are the Excel's own spelling, so every row below is a
# convention of this deliverable.
anchors:
  type_map:
    TT: TIT
    PT: PIT
    LT: LIT
    PDT: PDIT
    DPIT: PDIT
    FT: FIT
    LG: LI
    TI: TI
    PI: PI
    LI: LI
    FI: FI
    TIT: TIT
    PIT: PIT
    LIT: LIT
    PDIT: PDIT
    FIT: FIT
    LS: LS
    LSH: LS
    LSHH: LS
    LSL: LS
    FS: FS
    RO: RO
    FE: FE
  # Recognised on the drawing but never a row in this deliverable.
  not_field: [TW]

# P11..P15 — vendor marks.
#
# Meanings are never configured: the legend sheets define no marks at all, so
# the dictionary is read from each page's own NOTES at run time
# (docs/design.md §10.1).  Only the geometry of finding them lives here.
vendor_marks:
  # P12 — sizes at which this project draws an asterisk.  Used to recognise a
  # mark on a page whose own legend is missing; a size not listed here is not
  # silently accepted.
  glyph_sizes: [[4.0, 4.0], [5.2, 5.2]]
  blob_span: [1.5, 8.0]
  glyph_span: [3.0, 8.0]
  cluster_gap: 2.0
  # P13 — where a mark sits relative to the bubble it applies to.
  above: 25.0
  x_slack: 6.0
  note_row_tol: 6.0
  note_line_gap: 20.0
  # P15 — package boundary box carrying a mark for everything inside it.
  package_box:
    edge_cover: 0.35
    mark_margin: 20.0

# P16 — SCT supplier scope.  The symbol is LEGEND (defined on page 2 as
# 'SCT / SUPPLIER INTERFACE'); these tolerances are measured from page 6.
sct_scope:
  text_tol: 30.0
  drop_x_tol: 2.0
  drop_end_tol: 1.5

# What the span between two line breakers is called, and who supplies it.
#
# The drawing marks the span with a broken line and the letters `SCT`, and the
# detection rule is named after those letters (`SCT_SUPPLIER_SCOPE`).  The legend
# does not define the span - measured over legend pages 2-5, no row prints it - so
# nothing is derived from it and no rule reads this block.  It only names the
# span in the report: a reviewer confirmed that on p20's D00P-11LAB00-M05-0001 the
# pipe and the equipment inside the span are the *supplier's* scope, so the old
# wording ("SCT 배관 제외") named the wrong party.
#
# `supplied_by` is the project's own fact and is deliberately left blank: this
# tool has no way to measure who supplies a span, so it says nothing until a
# project fills it in.  `description` records that a confirmed other-party span
# gets no Description sentence, which is the axis `pipeline.DESCRIPTION_SKIP_RULES`
# implements - the row stays in the list either way.
supplier_interface_span:
  label: "공급자 인터페이스 구간 — 배관 및 기기 공급자 범위"
  supplied_by: ""
  description: skip

# Multi-signal bubble groups: several signals drawn as touching bubbles off one
# physical instrument (measured on this document: 34 groups of LSHH+LSH+LSL, gap
# 0.0-0.06pt, one lead line per group).
#
# `merge_quantity` is **on**: the user confirmed against plant practice that one
# switch reporting LSHH, LSH and LSL is one device.  The stack folds to its first
# bubble's row and the rest are dropped, so 102 bubbles become 34 rows; the folded
# signals stay in that row's evidence and in the workbook's REMARK, so a reader
# can count the bubbles on the sheet against the row.  The client's own list could
# not settle this - the 22 level-switch rows it does carry are on sheets where the
# bubbles do not touch - and none of them is affected, measured before and after.
multi_signal_bundle:
  # Confirmed by the user against plant practice: one physical level switch that
  # reports LSHH, LSH and LSL is one device, not three, so a touching stack folds
  # to a single row.  The test for "touching" is the drawing's own - a vertical
  # gap no larger than the stroke index's slack, which selects exactly the 34
  # stacks at 0.0 pt and nothing else (the next-closest overlapping pair anywhere
  # in the document is 3 pt apart).  The client's own 22 level-switch rows are on
  # sheets where the bubbles do *not* touch, so none of them is affected -
  # measured before this was turned on, and again after.
  merge_quantity: true
  # What the surviving row is called.  All 22 of the client's level-switch rows
  # put `LS` in the TYPE column and none says `LSHH` or `LSH`; the high/low
  # distinction is written into the Description instead (`LEVEL HIGH HIGH` 11,
  # `LEVEL HIGH` 11).
  merged_type: LS
  # Which signal the folded row's Description speaks for.
  #
  # The client's own list has no multi-signal form to copy.  Its 22 level-switch
  # rows are 11 pairs - the same subject written twice, once `... LEVEL HIGH HIGH`
  # and once `... LEVEL HIGH`, each with Q'ty 2 - so where the client wrote a
  # stack it wrote one row per signal and never listed two signals in one line.
  # That is a wording convention, not a quantity: those 22 rows are on sheets
  # where the bubbles do not touch, and the user's ruling is that a touching stack
  # is one physical switch.  So the row count comes from the drawing and the
  # wording comes from the client, and the client's wording for one row is one
  # signal.  `representative` writes the first signal of the stack, which is the
  # form the client uses; the alternatives are here because this is the one part
  # of the fold their list cannot settle:
  #   representative - `... LEVEL HIGH HIGH` (the stack's first signal)  [in use]
  #   all            - every signal in one line, a form the client writes 0 times
  #   none           - no alarm suffix at all, likewise 0 times
  # Whichever is chosen, the Remark and the evidence panel name every folded
  # signal, so the reader can count the bubbles on the sheet against the row.
  description_signal: representative

# The client's Description wording, measured off its own finished list (557
# Description lines) rather than assumed.  This is config and not a runtime
# derivation for a plain reason: in real use there is no finished list to derive it
# from - the user has a PDF and an empty form - so the client's wording convention
# is a project fact like its vendor-mark dictionary.
#
# What was counted, on those 557 lines:
#   * 81.3% begin with the word `UNIT`, and 444 of 557 with `UNIT #<n>`; the word
#     `UNIT` is printed on no drawing, so it belongs to the template, not the sheet
#   * the ISA variable word (legend p3's matrix, `isa_table`) appears in 538 of
#     them; 357 lines end with it, 170 carry one token after it (A 58, B 51,
#     ELEMENT 18, HIGH 11, C 8, digits 24) and 11 carry two (`HIGH HIGH`)
#   * the middle segment runs 1-12 tokens, mode 5-6, and names equipment
#   * all 52 drawing titles read `P&ID FOR <system> SYSTEM <qualifier>`, which is
#     what `title_open` / `title_close` bracket
#
# The suffix and the middle are deliberately absent from the template: measured
# against the drawings, A/B/C (129 instances) and HIGH/HIGH HIGH (22) appear
# nowhere on the page their row belongs to, and 49.7% of middles share no word with
# the drawing title.  `describe.py` reports those rows rather than filling them.
description:
  prefix: UNIT
  unit_mark: "#"
  title_open: [FOR]
  title_close: [SYSTEM]
  template: "UNIT #{unit} {system} {variable}"
  measured_on: "발주처 계기 리스트 557행 (data/CZE_Field_Instrument.xlsx)"
  note: "접미(A/B/C, HIGH HIGH)와 중간 서술은 도면에 없어 템플릿에 넣지 않았습니다"

  # The middle-segment selector.  It is a *chooser*: it is given the phrases the
  # rules collected off the pipe the instrument is attached to and picks among
  # them, and its answer is re-checked word by word against those same phrases
  # before it reaches the column (app/engine/describe_llm.py).
  #
  # Off by default.  Turning it on needs ANTHROPIC_API_KEY in the environment; with
  # the key absent the run reports it and every row is graded exactly as the rules
  # alone grade it - the column never depends on a call having happened.
  #
  # Determinism: every call is keyed by a hash of its exact inputs and cached under
  # cache_dir, so re-analysing the same PDF makes no calls and produces the same
  # bytes.  (`temperature` is not sent: the current models reject it outright, and
  # the cache is the stronger guarantee anyway.)
  llm:
    enabled: false
    model: claude-opus-5
    max_tokens: 512
    cache_dir: app/_data/description_cache

  # Equipment nouns the client's own list puts an ordinal after, with the counts
  # that put them here: PUMP 76, COOLER 48, TANK 26, HEATER 9, HEX 9, EXCHANGER 9,
  # SKID 8, CEP 3.  They are config rather than a runtime derivation because a real
  # run has no finished list - and the legend's equipment table does not name a
  # COOLER at all, while the drawings print one 50 times.
  equipment_words: [PUMP, COOLER, TANK, HEATER, HEX, EXCHANGER, SKID, CEP,
                    CONDENSER, STRAINER, FILTER, WATERBOX, DRUM, COMPRESSOR,
                    VESSEL, SEPARATOR, SCRUBBER, ABSORBER,
                    # Added on two conditions together: the client names the thing
                    # with this word, and the drawings print the word.  The legend's
                    # EQUIPMENT table has none of them - a valve has its own legend
                    # table and a header is piping - but the client's list treats
                    # them as the thing an instrument is on.
                    VALVE,      # 38 client subjects end in it, 27 more contain it;
                                # printed 87 times across 21 sheets
                    HEADER,     # 22 client subjects end in it, 10 more contain it;
                                # printed 38 times across 18 sheets
                    BOX]        # 4 client subjects end in it (`FLASH BOX`), 7 more
                                # contain it; printed 23 times across 10 sheets
                    # Left out on purpose: HOTWELL ends 6 client subjects but the
                    # drawings print the word once in the whole document, and LINE
                    # ends 4 but is printed 35 times as part of line numbers, where
                    # it would name pipe runs rather than equipment.

  # Which word each side of a piece of equipment takes.  Counted in the client's
  # 557 lines, with no counter-example either way:
  #   pump-like nouns  SUCTION 45 / DISCHARGE 70   (115 of 115)
  #   everything else  INLET   27 / OUTLET    30   (57 of 57 - WATERBOX, EXCHANGER,
  #                                                 SKID, HEATER, HEX, COOLER,
  #                                                 CONDENSER)
  position_words:
    pump: {left: SUCTION, right: DISCHARGE}
    other: {left: INLET, right: OUTLET}
    pump_nouns: [PUMP, CEP, BFP]

  # Drawings whose unit code the client does not print.  Counted: unit 00 lines
  # omit the `UNIT #nn` prefix 98 times and carry it 14; unit 10 carries it 383 of
  # 388 and unit 11 56 of 57.  So the plant-common sheets are written without it.
  unit_prefix_skip_codes: ["00"]

  # How the client words a variable the ISA table spells differently.  `PD` reads
  # `PRESSURE DIFFERENTIAL` in legend p3's matrix and the client writes
  # `DIFFERENTIAL PRESSURE` - 52 lines to 0.  `RO` is not in the matrix at all;
  # the client writes `RESTRICTION ORIFICE` (19 lines).  PROJECT-dependent: these
  # are the client's spelling, not a legend derivation.
  variable_words:
    PD: [DIFFERENTIAL, PRESSURE]
    RO: [RESTRICTION, ORIFICE]
    FE: [FLOW, ELEMENT]

  # Which instrument types take a position word at all.  The client attaches one to
  # 158 of 557 lines, and the split is by type, not by geometry:
  #   PIT 70.8% (75/106)   PDIT 67.3% (35/52)   FS 100% (3/3)
  #   FIT 41.9%  FE 38.9%  TIT 32.0%  TI 11.9%  PI 6.3%  RO 5.3%
  #   LIT 0% (0/29)  LS 0% (0/22)  LI 0% (0/10)
  # Listed are the types that carry one on more than a third of their own lines.
  # TIT sits just under the line at 32.0% and was measured both ways: attaching one
  # to TIT gave 8 exact sentences, leaving it off gave 20, because the client's TIT
  # lines are mostly a plain tank or cooler temperature.  Level and plain-indicator
  # types are left out for the same reason - they never write one.
  position_word_types: [PIT, PDIT, FS, FIT, FE]

  # Which instrument types end their line in a letter.  Counted over the same 557:
  #   PIT 44/106   TIT 36/97   FIT 26/31   PDIT 6/52   LIT 5/29
  #   PI 0/111  TI 0/59  LS 0/22  RO 0/19  FE 0/18  LI 0/10  FS 0/3
  # A type gets one only when it letters the end more often than it repeats itself.
  # Exact repeats of another line on the same sheet, against end-letters:
  #   PIT 19 repeats / 44 letters   TIT 20 / 36   FIT 0 / 26   PDIT 0 / 6  -> letter
  #   LIT 20 / 5   PI 24 / 0   TI 12 / 0   RO 11 / 0   LS 4 / 0   FE 0 / 0  -> none
  # 110 of the 557 lines (19.7%) are exact repeats, so on those types the client
  # deliberately writes the same sentence twice rather than disambiguate, and a
  # trailing letter is a word it never wrote.  Leaving LIT off moved exact
  # sentences from 8 to 20.  PROJECT: the client's habit, not a legend derivation.
  end_ordinal_types: [PIT, TIT, FIT, PDIT]

  # The client's own short form for a drawing title's system phrase.  Found by
  # taking each title phrase's initials and counting both forms in that sheet's
  # client lines: `CLOSED COOLING WATER` appears as `CCW` on 127 lines and is never
  # written out, `AUX. COOLING WATER` as `ACW` on 4.  Every other title phrase the
  # client writes in full - HP STEAM 12/12, LP STEAM 12/12, CRH STEAM 11/11,
  # CLEAN DRAIN 9/9, POTABLE WATER SUPPLY 4/4 - so this is the whole dictionary the
  # counting found, not a rule that initials replace phrases.  There is no reverse
  # direction: no client line writes out a phrase the title abbreviates.  PROJECT.
  system_abbreviations:
    CLOSED COOLING WATER: CCW     # 127 rows
    AUX. COOLING WATER: ACW       # 4 rows

  # A word a whole system uses, whatever side the instrument is drawn on.  On the
  # closed cooling water sheets the client writes RETURN on 51 of its 54 TI lines
  # and on no TI line writes SUPPLY.  Its PI is an even split - 49 SUPPLY against
  # 51 RETURN, and split evenly again inside every direction cell (BELOW 31/30,
  # ABOVE 15/13) - so geometry cannot tell supply from return for a PI and nothing
  # is attached there.  PROJECT.
  position_by_system:
    CCW TI: RETURN                # 51 of 54 rows

  # On a sheet that names at most this many pieces of equipment, the instrument's
  # distance to it is not used to rule it out - there is nothing to choose between.
  # 0 turns it off.  Measured on the two sheets that qualify in this document:
  # p20 names two and all 33 client lines use one of them; p31 names one (the bare
  # word `PUMP`) and 0 of its 15 lines use it.  See the `--without` number in the
  # round report before raising this.  PROJECT.
  sole_equipment_sheet_max: 2

  # Which member of a confirmed standard set this client writes.  The set itself
  # lives in `config/plant_standard_abbr.yaml` and fixes no direction; this is the
  # direction, and it is a project fact measured on the client's own list:
  #   BOILER FEED WATER PUMP  33 rows (p20, every line on that sheet)
  #   BFP                     29 rows - but always as a modifier (`BFP A/B COOLER`),
  #                           never as the name of the pump itself
  # The drawings print `FEEDWATER PUMP` 6 times and never the long form, so without
  # this the two corpora have no word in common for the same pump.  PROJECT.
  equipment_alias_choice:
    # Only a set the client actually uses as the *name* of something gets a
    # choice; a set it only ever uses as a modifier (`HP STEAM`, `GT FUEL OIL`)
    # is left out, because the head-position rule would never fire on it anyway.
    # Counted over the client's own subjects, head position / modifier position:
    boiler_feedwater_pump: BOILER FEED WATER PUMP   # 11 head vs BFP 5 head; --without: F1 73.1 -> 73.9
    condensate_extraction_pump: CEP                 # CEP 3 head, long form 0; fired 0 times here
    # `heat_exchanger` is left without a choice on purpose.  The set itself is
    # confirmed standard and stays in the standard file, but choosing HEX for this
    # client costs F1 74.3 -> 73.9: the client's 11 HEX heads are all on p31, whose
    # drawing prints neither word, while the labels that do end in HEAT EXCHANGER
    # are on sheets where the client writes it out (6 heads).  So the pair holds -
    # this client just does not want it rewritten.
    # Left without a choice - never a name in this client's list:
    #   HRSG 0/29  GT 0/57  ST 0/34  HRH 0/32  CRH 0/11  TCA 0/12  LP 0/34
    #   FGH 0/9  BD 0/13  ACW 0/4  BOP 0/0  MOV 0/0  PSV 0/0  EDG 0/0
    #   HP 11 head and IP 11, but both are `... DISCHARGE HEADER HP`, a pressure
    #   class rather than a piece of equipment, so no drawing label should be
    #   rewritten to them either.

  # This project's own abbreviations, kept out of the standard file: `CD` is this
  # plant's system name for the clean drain system and not trade vocabulary, and
  # `RO` doubles as an instrument tag, where rewriting it would be wrong.
  # Counted on the client's list: CD 5 / CLEAN DRAIN 17, RO 4 / RESTRICTION
  # ORIFICE 19 - both modifiers, never a name, so neither takes a choice either.
  project_abbreviations:
    clean_drain: [CD, CLEAN DRAIN]
    restriction_orifice: [RO, RESTRICTION ORIFICE]

  # A noun that only names equipment in company.  The word in front decides, and
  # the list is the client's own: it writes `BYPASS VALVE` 54 times, `LETDOWN` 3,
  # `CONTROL` 3, `MODULATING` 2, `SHOTDOWN` 2, `BREAKER` 1 - and never the
  # `BRETHER` (42 labels), `OFF` (59), `VENT` (29) or `SHUTOFF` (34) the drawings
  # put in front of the same word.  For HEADER it writes DISCHARGE 16, STEAM 6,
  # SEAL 4, RING 3, OUTLET 2, SUCTION 1, and never the drawings' `DRAIN HEADER`
  # (39 labels), which is piping.  Without this the new words pull in annotations
  # that outrank the real equipment by distance - measured: `WASTE OIL TANK LEVEL`
  # came out as `FUEL OIL SUPPLY DRAIN HEADER LEVEL`.  PROJECT.
  equipment_modifiers:
    VALVE:  [BYPASS, LETDOWN, CONTROL, MODULATING, SHOTDOWN, SHUTDOWN, BREAKER]
    HEADER: [DISCHARGE, STEAM, SEAL, RING, OUTLET, SUCTION]
    BOX:    [WATER, FLASH]

  # Rows the drawing is *measured* not to answer, so the reviewer is told why
  # rather than being left to wonder.  Each was counted before it was written here.
  user_input_reasons:
    - types: [PDIT]
      noun: PUMP
      needs_subject: true
      code: DESC_BETWEEN_SYMBOL
      tag: 중간 심볼
      reason: >-
        중간 심볼(SUCTION STRAINER)은 도면이 낱말로 인쇄하지 않습니다 — 발주처 13행이
        모두 PDIT 이고, 그 13행이 있는 도면 4장 중 낱말이 인쇄된 것은 1장뿐이며 그
        낱말도 계기·기기 사이가 아닌 시트 반대편 드레인 주석입니다 (회수 0/13).
        직접 입력이 필요합니다
    - types: [PI]
      system: CCW
      code: DESC_CCW_DIRECTION
      tag: CCW 방향
      reason: >-
        CCW 의 SUPPLY / RETURN 은 도면 기하로 구분되지 않습니다 — 발주처 PI 100행이
        SUPPLY 49 / RETURN 51 이고 방향 칸 안에서도 반반입니다 (BELOW 31/30,
        ABOVE 15/13). 직접 입력이 필요합니다

  # What the client writes against a kind of equipment, counted on its 557 lines.
  # An empty value means it writes none at all - and that has to be said, because
  # the left/right rule above would otherwise give a tank an INLET it never has:
  #   TANK    none 59/59 (100%)
  #   VALVE   DOWNSTREAM 30/65, none 24, BODY 8, SUPPLY 2, OUTLET 1
  #   HEADER  DISCHARGE  16/32, none 13, OUTLET 2, SUCTION 1
  # PUMP and COOLER are left to the left/right rule, which already gets them right:
  # PUMP DISCHARGE 70 / SUCTION 45 and COOLER RETURN 86 / SUPPLY 41 are two-sided,
  # and which side an instrument is on is exactly what geometry can see.  PROJECT.
  position_by_noun:
    TANK: ""
    VALVE: DOWNSTREAM
    HEADER: DISCHARGE

  # Which types write the line's `TO ...` / `FROM ...` phrase.  Counted on the
  # client's 557 lines: LS writes one on 22 of 22 (100%), and every other type on
  # 14 of 535 (2.6%) - PIT 4, TIT 4, FIT 3, PI 1, RO 1, FE 1, spread over five
  # sheets with no condition in common, against PDIT 0/52, TI 0/59, LIT 0/29,
  # LI 0/10, FS 0/3.  So the phrase is not a general fallback for "no equipment
  # named": it is how a level switch says which tank it protects.  32 of the 36
  # also carry an equipment noun, which is why it is a phrase inside the subject
  # rather than a substitute for one.  PROJECT.
  line_phrase_types: [LS]

  # Where geometry has nothing to say - an instrument above or below its subject -
  # and the client's own lines still have a majority word.  Counted on the 518
  # matched lines after the subject was corrected this round; only cells with at
  # least 10 lines and one word over half are listed, which is why the table is
  # three entries and not twelve:
  #   PIT ABOVE  -> DISCHARGE  21/35 (60%)      PDIT ABOVE -> SUCTION  6/10 (60%)
  #   PDIT LEFT  -> SUCTION    18/26 (69%)
  # Every other cell's majority is "no word at all" - PI ABOVE 29/29, PI BELOW
  # 61/64, TI BELOW 44/47 - so nothing is attached there.  PROJECT.
  position_by_side:
    PIT ABOVE: DISCHARGE
    PDIT ABOVE: SUCTION
    PDIT LEFT: SUCTION

  # Which types name what sits between the instrument and the equipment.  The
  # client does this on 13 of its 557 lines, and all 13 are PDIT reading
  # `SUCTION STRAINER` - no other type names an intermediate symbol at all.  The
  # detector reads the word off the drawing, so on a sheet that draws the strainer
  # without labelling it - p33, where the client writes it six times - nothing is
  # offered and nothing is invented.  PROJECT: the client's habit.
  between_symbol_types: [PDIT]

  # What a switch's trailing H / L letters read as.  The legend's succeeding-letter
  # table (p3) stops at `S SWITCH` and defines no H or L modifier, so this comes
  # from the client's own lines: `LSHH` -> `LEVEL HIGH HIGH` 11 rows, `LSH` ->
  # `LEVEL HIGH` 11 rows.  The drawing supplies which is which - the bubble is
  # tagged LSHH / LSH / LSL and that tag is what the row carries.
  # LL and L carry **0 rows of evidence** in this client list (it has no LSL line
  # at all); they are written here to complete the pair the client did show, and
  # any row that uses them should be checked.  PROJECT, not a legend derivation.
  alarm_suffix:
    HH: [HIGH, HIGH]      # 11 rows
    H:  [HIGH]            # 11 rows
    LL: [LOW, LOW]        # 0 rows - completion, unverified
    L:  [LOW]             # 0 rows - completion, unverified

  # Finished lines that show the client's wording, per system name.  Used only to
  # show the selector the *order* the client writes in; it may not take words from
  # them.  Empty here: this project's finished list is an input to verification
  # mode, not something a real run has.
  examples: []

# P17 — words with no discriminating power when matching an Excel SYSTEM value
# against a drawing title.
matching:
  stopwords: [PID, 'P&ID', FOR, SYSTEM, THE, OF, AND, TO, A, B, C, '1', '2', '3', OR]

# P18 — the language this project's reviewers annotate in.
review_markup:
  script_ranges: ['가-힣']

# Q'ty multipliers.
#
# NOT the source of truth.  The multiplier is derived at run time from the
# legend's UNIT IDENTIFICATION NUMBERS table (page 5), which states the group
# and unit breakdown explicitly; deriving it means a plant with a different
# configuration works without editing this file.  The block below is used only
# if that table cannot be parsed, and its use is logged.
unit_multiplier_fallback:
  '00': 1
  '10': 2
  '11': 4

# Scope keywords that override the unit multiplier for an individual item.
# Verified on D00P-10PGB10-M05-0004, where 'AUXILIARY BOILER COOLER' carries
# '(PLANT COMMON)' directly beneath it and its 3 Excel rows are Q'ty 1 on a
# drawing whose other 21 rows are Q'ty 2.
qty_scope_overrides:
  - keyword: 'PLANT COMMON'
    multiplier: 1

# ---------------------------------------------------------------------------
# Valve rules (spike 4).  Item numbers V1..V8 refer to out/valve_project_deps.md.
#
# Only the values judged PROJECT are here.  The body and actuator *shapes* are
# LEGEND and stay in spike/detect_valves.py with the legend page cited at the
# point of use: the bowtie, the globe's waist disc, the butterfly's vane ticks,
# the open/closed fill convention and the actuator enclosure vocabulary are all
# drawn on legend pages 2 and 3, so they do not move with the project.
valves:
  # V1, V2 — how far an actuator may stand from the body it drives, and how far
  # off the stem axis.  Measured on drawing pages, not on the legend: p6 and p30
  # put the motor circle 26.9 pt along the stem, p33 up to 80.  The legend draws
  # the actuator at a fixed distance and never states a range.
  actuator_reach: 90.0
  actuator_offaxis: 12.0

  # V3 — how far a tag bubble may sit from the valve it labels.  Measured from
  # p6's MOV bubbles; a leader line can be drawn any length, so this is drafting
  # practice, not a rule.
  tag_reach: 190.0

  # V4 — the valve deliverables' Excel template.  A different sheet and a
  # different column order from the instrument list under `excel:` above; the
  # two are separate client templates, not one.
  excel:
    sheet: '3.0_Valve List'
    first_data_row: 8
    columns:
      'no': 1
      pid_no: 2
      valve_type: 3
      qty: 4
      system: 5
      description: 12
      remark: 39          # the client's own REMARK column (row 6)
      # Row 6 prints 'TAG NUMBER' at K; row 7 sub-heads 'ACTUATOR' at Y and
      # 'BODY' at AA under the merged TYPE group.  The app writes the body it
      # read (GATE / GLOBE / BUTTERFLY) and the actuator it read (MOTOR /
      # HYDRAULIC) into those two, and leaves column C's own MOV / MOV_I / HOV
      # vocabulary alone: mapping an actuator back onto it is ambiguous
      # (MOTOR is both MOV and MOV_I) and the app has no basis to choose.
      tag_no: 11
      actuator: 25
      body: 27

  # V5 — which body types each deliverable covers.  Taken from each file's own
  # DESCRIPTION line, plus the observation that the master files ball-bodied
  # MOVs under the gate/globe heading.
  deliverables:
    - tag: CZI
      path: data/CZI_Butterfly_Valve.xlsx
      bodies: [BUTTERFLY]
    - tag: CZH
      path: data/CZH_MOV_Gate_Globe.xlsx
      bodies: [GATE, GLOBE, BALL]

  # V6 — the deliverables' own VALVE TYPE vocabulary.  This is an operation
  # mode, not a body: MOV and MOV_I are motor-operated, HOV hydraulic, CV a
  # pneumatic control valve.  Nothing in the legend names these strings.
  valve_type_actuator:
    MOV: MOTOR
    MOV_I: MOTOR
    HOV: HYDRAULIC
    CV: PNEUMATIC

  # V7 — which tags make a pneumatic valve a modulating CV rather than an
  # on-off XV.  The tag vocabulary is LEGEND (p3's CONTROL DEVICE column, p4's
  # shutoff tags); the split between the two deliverables is this client's.
  cv_tags: [FCV, LCV, PCV, TCV, CV]
  xv_tags: [XV, HV]

  # V8 (removed) — stroke signatures for drawn actuator letters used to live
  # here.  They are now derived from each document at run time: stroked
  # glyphs are clustered against each other and each cluster is labelled by a
  # valve in it that carries a text tag bubble (legend p4 pairs MOV with the M
  # circle and HV with the hydraulic box).  A cluster with no such member is
  # reported as UNLABELED_GLYPH_CLUSTER instead of being guessed.  See
  # out/stroke_bootstrap.md and spike/detect_valves.derive_glyph_library.

  # Fallback for the two rules now measured off the legend at run time
  # (spike/legend_rules.py).  These are NOT the source of truth: VANE_TICK is
  # measured from the BUTTERFLY row of legend p2 and ACT_STEM from the VALVES
  # ACTUATORS column of legend p3.  This block is used only when a legend sheet
  # cannot be read, and its use is logged with the reason.  The values are the
  # ones this project's legend yields, so a fallback run reproduces it.
  # Valve rules to switch off for this project, from detect_valves.ALL_RULES:
  # WAIST_DISC / VANE_TICK / END_BARS / STROKE_LETTER / ACT_CLEARANCE /
  # ACT_STEM / PNEUMATIC_SHELL.  Empty means every measured rule applies, which
  # is the delivered state; a name here withdraws that rule from the analysis
  # and the result records it under applied_rules.valve_rules_disabled.
  disabled_rules: []

  legend_fallback:
    butterfly:
      tick_length: 3.0
      tick_reach_radii: 1.498
      bar_reach_radii: 2.822
      bar_min_radii: 2.378
      circle_diameter: 6.06
    actuator_stem:
      stem_gap: 0.0
      stem_offaxis: 0.03
      stem_length: 19.86
      centre_to_body: 26.97
    # Legend p3 VALVES ACTUATORS, the rows it labels PNEUMATIC: the DIAPHRAGM
    # dome measures 14.22 x 7.11 (a half circle, hence aspect 0.5) and the
    # CYLINDER box 14.16 square with its piston line across the middle.  Used
    # only when that sheet cannot be measured; `derive_pneumatic` normally
    # supplies these, and the report says which of the two happened.
    pneumatic:
      dome_flat: 14.22
      dome_depth: 7.11
      dome_aspect: 0.5
      cylinder_side: 14.16
      cylinder_aspect: 1.003
      cylinder_divider: 0.5

# --------------------------------------------------------------------------
# Review axes — why a person has to look
# --------------------------------------------------------------------------
#
# Every reason the engine can raise is filed under one axis, because "what am I
# being asked to decide" is the question a reviewer opens the screen with, and it
# is a different question from "which deliverable is this row in".  The axes are
# ordered by what it costs to get wrong: a scope call decides whether the row is
# ordered at all, a quantity call decides how many, and a Description is wording.
#
# A code that is not listed here is shown under `OTHER` rather than hidden - the
# screen must never quietly drop a reason.
review_axes:
  order: [SCOPE, QUANTITY, DESCRIPTION, DETECTION, SOURCE]
  labels:
    SCOPE: 스코프 판정
    QUANTITY: 수량
    DESCRIPTION: Description
    DETECTION: 검출
    SOURCE: 입력 자료
    OTHER: 미분류
  codes:
    # --- scope: does this row belong in the deliverable at all
    VENDOR_MARK_UNDEFINED: SCOPE          # 벤더마크가 NOTES 에 정의되지 않음
    SCOPE_OVERRIDE_UNRESOLVED: SCOPE      # PLANT COMMON 등 시트 승수 예외
    # --- quantity: how many are ordered
    MULTI_SIGNAL_BUNDLE: QUANTITY         # 맞닿은 신호 버블의 물리 수량
    MULTIPLIER_UNDEFINED: QUANTITY        # unit code 에 승수가 없음
    # --- description: wording to finish
    DESCRIPTION_INCOMPLETE: DESCRIPTION
    DESC_BETWEEN_SYMBOL: DESCRIPTION
    DESC_CCW_DIRECTION: DESCRIPTION
    DESC_GRADE_PARTIAL: DESCRIPTION
    DESC_GRADE_LOW: DESCRIPTION
    DESC_GRADE_NONE: DESCRIPTION
    # --- detection: is the row itself right
    IP_TOKEN_AS_ACTUATOR: DETECTION
    ACTUATOR_LETTER_UNREAD: DETECTION
    ACTUATOR_ON_UNEXPECTED_BODY: DETECTION
    UNLABELED_GLYPH_CLUSTER: DETECTION
    MIXED_TAG_GLYPH_CLUSTER: DETECTION
    ROW_DELETED: DETECTION                # 사용자가 지운 행
    # --- source: the inputs, not the reading of them
    ORIGIN_REFERENCE_MISSING: SOURCE
    REVIEWER_MARKUP: SOURCE               # 도면에 개정 표기가 있음
  # Codes whose axis was *not* obvious.  They are listed above with a decision and
  # the reasoning, so the choice can be argued with rather than guessed at:
  #   MULTIPLIER_UNDEFINED  -> QUANTITY.  It reads as a scope question ("is this
  #     sheet in scope"), but what it actually leaves undecided is the row's Q'ty,
  #     which is written as blank.  Filed where the missing value is.
  #   ACTUATOR_ON_UNEXPECTED_BODY -> DETECTION.  It changes which deliverable the
  #     row lands in, so it touches scope too; filed under detection because the
  #     question asked is "did we read this symbol right", and the scope follows
  #     from the answer rather than being the decision.
  #   REVIEWER_MARKUP -> SOURCE.  It is a fact about the drawing (client and
  #     drawing disagree), not a doubt about the row - `out/revision_gap.md` says
  #     not to correct it by rule.
