# L30 — 아날로그 연산자 어휘 (ISA-S5.2 · 범례 'SIGNAL PROCESSING SYMBOLS').
#
# 이름(names)은 범례 표의 FUNCTION 칸, 글자(labels)는 상자 안에 인쇄된 기호다.  프로젝트 값이 아니라 표준 기호라
# 여기 두고, 새 양식이 다른 이름 · 기호를 쓰면 이 파일에 한 줄 더한다 (코드는 고치지 않는다).
# 계산은 app/logic/aops.py 의 op 마다 한 함수 — 범례 MATH EQUATION 그대로.
ops:
  sum:      {ko: "합 (SUMMING)",             eq: "M = X1 + X2 + … (입력마다 계수 · 부호)", names: [SUMMING, SUM, ADDITION],
             labels: ["∑", "Σ", "SUM", "+/-", "∑+"]}
  mean:     {ko: "평균 (AVERAGING)",          eq: "M = (X1 + X2 + … + Xn) / n", names: [AVERAGING, AVERAGE, AVERAGE SELECTION, DUAL SELECTION, MEAN],
             labels: ["∑/N", "Σ/N", "AVG", "∑/N1", "∑N"]}
  diff:     {ko: "차 (DIFFERENCE)",           eq: "M = X1 − X2 (+ 입력에서 − 입력을 뺀다)", names: [DIFFERENCE, SUBTRACTION],
             labels: ["△", "Δ", "∆"]}
  absdiff:  {ko: "차의 절댓값",                eq: "M = |X1 − X2|", names: [ABSOLUTE DIFFERENCE], labels: ["|△|", "|Δ|", "|∆|"]}
  gain:     {ko: "비례 (PROPORTIONAL)",       eq: "M = K·X", names: [PROPORTIONAL, GAIN], labels: ["K"]}
  rgain:    {ko: "역비례 (REVERSE PROPORTIONAL)", eq: "M = −K·X", names: [REVERSE PROPORTIONAL], labels: ["-K", "−K"]}
  integral: {ko: "적분 (INTEGRAL)",           eq: "M = (1/T1)∫X dt — 시간에 따라 쌓인다", names: [INTEGRAL, INTEGRATOR], labels: ["∫", "INTEGRAL", "INT"]}
  deriv:    {ko: "미분 (DERIVATIVE)",         eq: "M = Td·dX/dt — 값이 멈춰 있으면 0", names: [DERIVATIVE], labels: ["D/DT", "DX/DT"]}
  mul:      {ko: "곱 (MULTIPLYING)",          eq: "M = X1 × X2", names: [MULTIPLYING, MULTIPLY, MULTIPLICATION], labels: ["X", "×", "*"]}
  div:      {ko: "나눗셈 (DIVIDING)",         eq: "M = X1 ÷ X2", names: [DIVIDING, DIVIDE, DIVISION], labels: ["÷", "/"]}
  sqrt:     {ko: "제곱근 (ROOT EXTRACTION)",  eq: "M = √X", names: [ROOT EXTRACTION, SQUARE ROOT], labels: ["√", "SQRT"]}
  pow:      {ko: "거듭제곱 (EXPONENTIAL)",    eq: "M = Xⁿ", names: [EXPONENTIAL], labels: ["XN", "X^N", "Xⁿ"]}
  fx:       {ko: "함수 발생기 F(X)",          eq: "M = f(X) — 꺾은선 표", names: [FUNCTION GENERATOR, CHARACTERIZER], labels: ["F(X)", "FX"]}
  ft:       {ko: "시간 함수 F(T)",            eq: "M = f(t)", names: [TIME FUNCTION], labels: ["F(T)", "FT"]}
  max:      {ko: "높은 값 선택 (HIGH SELECTOR)", eq: "M = 입력 중 큰 값", names: [HIGH SELECTOR, HIGH SELECTION, HIGH SELECT, MAXIMUM SELECTION], labels: [">", "MAX", "HS"]}
  min:      {ko: "낮은 값 선택 (LOW SELECTOR)",  eq: "M = 입력 중 작은 값", names: [LOW SELECTOR, LOW SELECTION, LOW SELECT, MINIMUM SELECTION], labels: ["<", "MIN", "LS"]}
  median:   {ko: "중간값 선택 (MEDIAN)",      eq: "M = 입력의 중간값", names: [MEDIAN SELECTION, MEDIAN], labels: ["MED"]}
  hilim:    {ko: "상한 제한 (HIGH LIMITING)", eq: "M = X (X < H) · H (X ≥ H)", names: [HIGH LIMITING, HIGH LIMIT, HIGH LIMITER], labels: ["HIGH LIMITING", "HL"]}
  lolim:    {ko: "하한 제한 (LOW LIMITING)",  eq: "M = X (X > L) · L (X ≤ L)", names: [LOW LIMITING, LOW LIMIT, LOW LIMITER], labels: ["LOW LIMITING", "LL"]}
  abs:      {ko: "절댓값 (ABSOLUTE VALUE)",   eq: "M = |X| (입력이 둘이면 |X1 − X2|)", names: [ABSOLUTE VALUE, ABSOLUTE], labels: ["ABS", "|A|"]}
  velim:    {ko: "변화율 제한 (VELOCITY LIMITING)", eq: "멈춘 값에서는 M = X", names: [VELOCITY LIMITING, RATE LIMIT, VELOCITY LIMIT], labels: ["VELOCITY LIMIT", "V>"]}
  lag:      {ko: "1차 지연 (LAG)",            eq: "멈춘 값에서는 M = k·X", names: [FIRST ORDER SIGNAL DELAY, FIRST ORDER LAG, LAG], labels: ["LAG"]}
  const:    {ko: "아날로그 신호 발생 (상수)",  eq: "M = A (도면 'A : 5%' · 운전원이 바꿀 수 있다)", names: [ANALOG SIGNAL GENERATOR, CONSTANT], labels: ["A"]}
  bias:     {ko: "바이어스 (BIAS)",           eq: "M = X ± b", names: [BIAS], labels: ["+", "-", "±", "+-", "-+"]}
  transfer: {ko: "전환 (TRANSFER)",           eq: "M = IN1 (조건 C = 1) · IN2 (C = 0)", names: [TRANSFER, SWITCH, SELECTOR SWITCH], labels: ["T", "TR", "SW"]}
  pid:      {ko: "PID 제어기",               eq: "출력 = 제어기 계산 — 시뮬레이션에서는 수동 출력값 또는 추종(Tr) 값", names: [PID, CONTROLLER, PID CONTROLLER], labels: ["PID", "PI", "SPC"]}
  convert:  {ko: "신호 변환 (CONVERTER)",     eq: "M = X (신호 종류만 바뀐다)", names: [CONVERTER], labels: ["I/P", "E/P", "P/I", "A/D", "D/A", "I/E", "E/I"]}
  formula:  {ko: "수식 블록",                 eq: "OUT = 도면에 인쇄된 식", names: [], labels: []}
# 출력이 1/0 인 아날로그 비교 — 값이 문턱을 넘으면 1
digital_ops:
  dev:      {ko: "편차 감시 (DEVIATION)",     eq: "|X1 − X2| > D 이면 1", names: [DEVIATION], labels: ["DEV"]}
# 표시등 — 상자 · 원 안에 색 글자 하나 (G R W B Y A) · 들어오는 선만 있고 나가는 선이 없다
lamp_labels: ["G", "R", "W", "B", "Y", "O", "L"]
# 입력 선 끝에 인쇄된 이름 — 계수 · 부호 · 조건 · 추종
pin_names: ["IN", "X", "TR", "TRK", "FLAG", "C", "COND", "SP", "PV", "FF", "AT"]
