[pytest]
# hotfix132 - the cache folder is not wanted (CLAUDE.md commands pass the same flag; twice is harmless).
addopts = -p no:cacheprovider
# Works only when pytest-timeout is installed (requirements.txt dev extras); without it
# pytest prints "unknown config option: timeout" once and goes on.
timeout = 300
markers =
    slow: needs a full analysis of the sample PDF (about 7 minutes)
    ui: drives the real UI in a browser; needs an existing analysis
    timing: depends on wall-clock time or sockets; on a slow PC run that file once more before calling it a failure
