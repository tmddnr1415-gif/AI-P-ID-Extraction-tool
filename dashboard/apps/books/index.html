<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계장도서검토</title>
<style>
/* 계장도서검토 — 내 PC 도서 폴더를 '본문 내용'으로 찾는 검색기 (대시보드 메뉴 '계장도서검토', /apps/books/)
   폐쇄망: 외부 글꼴·CDN 없음. PDF 는 같은 폴더 vendor/pdf.js(3.11, 파일 동봉)로 읽는다.
   도서 파일은 이 PC 브라우저 안에서만 읽고, 뽑은 본문은 이 PC 의 IndexedDB 에만 보관한다 (서버로 보내지 않음).
   색 = dashboard.html :root 토큰과 같은 값 (navy #1e2a5a · accent #2b44c9 …) */
:root{
  --navy:#1e2a5a; --navy-2:#2a3870; --accent:#2b44c9; --accent-d:#1f33a3; --accent-l:#e8ecfc;
  --bg:#eef1f8; --card:#fff; --line:#e1e6f2; --line-2:#d5dcea; --text:#1b2238; --sub:#667089;
  --bad:#d63a2f; --bad-l:#fde8e6; --ok:#168a5c; --ok-l:#dff4ea; --warn:#c77700; --warn-l:#fff6dc; --hl:#fff176;
  --shadow:0 2px 10px rgba(30,42,90,.08);
  --f-ui:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif; --f-mono:Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:13.5px}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
.btn{font-size:12.5px;color:var(--text);background:#fff;border:1px solid var(--line-2);border-radius:8px;padding:6px 12px;white-space:nowrap}
.btn:hover{background:#f4f6fd}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--accent-d)}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.muted{color:var(--sub);font-size:12px}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100%}

/* 위 띠 */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:14.5px;color:var(--navy);margin-right:4px;white-space:nowrap}
body.embed .brand{display:none}
.folder{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px;max-width:520px;min-width:0}
.folder b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder .dot{width:8px;height:8px;border-radius:50%;background:var(--sub);flex:none}
.folder.live .dot{background:var(--ok)}
.folder.cache .dot{background:var(--warn)}
.sp{flex:1}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);min-width:0;max-width:520px}
.prog .pb{width:140px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}
.prog .pb i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.prog span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 검색 영역 */
.sz{padding:14px 16px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.qrow{display:flex;gap:8px;max-width:1100px}
.qbox{flex:1;display:flex;align-items:center;gap:8px;border:2px solid var(--line-2);border-radius:12px;padding:0 12px;background:#fff}
.qbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-l)}
.qbox input{flex:1;border:0;outline:0;font:inherit;font-size:16px;padding:10px 0;min-width:0;background:transparent}
.qbox .ic{font-size:17px;color:var(--sub)}
.qbox .x{border:0;background:none;color:var(--sub);font-size:16px;padding:2px 4px}
.qbox input::-webkit-search-cancel-button{display:none}
.qrow .btn.pri{font-size:14px;padding:0 20px;border-radius:12px}
.opts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:8px;font-size:12.5px;color:var(--sub)}
.opts label{display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.opts select{font:inherit;font-size:12.5px;border:1px solid var(--line-2);border-radius:6px;padding:2px 4px;background:#fff;color:var(--text);max-width:220px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.chips .lbl{font-size:12px;color:var(--sub);margin-right:2px}
.chip{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--text)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.rec{background:var(--bg)}
.interp{margin-top:8px;font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.interp .k{color:var(--sub)}
.cpt{display:inline-flex;align-items:center;gap:4px;background:var(--accent-l);color:var(--navy);border-radius:6px;padding:2px 8px;font-weight:600;font-size:12px}
.cpt.part{background:var(--bg);color:var(--sub);font-weight:500}
.cpt small{font-weight:400;color:var(--sub)}
.dym{color:var(--warn)}

/* 본문: 결과 목록 | 미리보기 */
.main{display:grid;grid-template-columns:minmax(360px,44%) 1fr;min-height:0}
.list{overflow:auto;padding:12px 12px 24px 16px;border-right:1px solid var(--line)}
.pv{overflow:auto;padding:12px 16px 24px;min-width:0}
.sum{font-size:12.5px;color:var(--sub);margin:2px 2px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sum b{color:var(--text)}
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:15px}
.res{display:grid;grid-template-columns:34px 1fr;gap:4px 10px;background:var(--card);border:1px solid transparent;border-radius:12px;box-shadow:var(--shadow);padding:11px 12px;margin-bottom:8px;cursor:pointer}
.res:hover{border-color:var(--line-2)}
.res.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-l),var(--shadow)}
.res .rk{grid-row:1/4;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:2px}
.res .rk b{font-size:15px;color:var(--navy)}
.meter{width:6px;height:44px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.meter i{position:absolute;left:0;right:0;bottom:0;background:var(--accent);border-radius:3px}
.res .t{display:flex;gap:6px;align-items:baseline;min-width:0}
.res .t .nm{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .path{font-size:11.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .why{font-size:12.3px;line-height:1.55;color:var(--text)}
.res .why .w{display:block}
.tier{flex:none;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;white-space:nowrap}
.tier.t3{background:var(--accent);color:#fff}
.tier.t2{background:var(--accent-l);color:var(--accent-d)}
.tier.t1{background:var(--bg);color:var(--sub)}
.tier.t0{background:#fff;color:var(--sub);border:1px solid var(--line)}
.tier.t-1{background:var(--warn-l);color:var(--warn);border:1px solid #f0d58a}
.fmt{flex:none;font-family:var(--f-mono);font-size:10.5px;color:var(--sub);border:1px solid var(--line);border-radius:4px;padding:0 4px}
mark{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px}
.more{display:block;margin:6px auto 0}
.empty{text-align:center;color:var(--sub);padding:40px 10px;line-height:1.7}

/* 첫 화면 (P&ID · LOGIC · 판넬 공간확보 첫 화면의 ① ② 와 같은 모양) */
.intro{max-width:880px;margin:24px auto;padding:0 16px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}
.step{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px}
.step h3{margin:0 0 6px;font-size:13.5px;display:flex;gap:8px;align-items:center}
.step p{margin:0;color:var(--sub);font-size:12.5px;line-height:1.6}
.step-n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;flex:none}
.drop{border:2px dashed var(--line-2);border-radius:14px;background:var(--card);padding:28px 16px;text-align:center;color:var(--sub);transition:.15s}
.drop.over,.app.over .drop{border-color:var(--accent);background:var(--accent-l);color:var(--accent-d)}
.drop .big{font-size:15px;color:var(--text);margin:6px 0 12px}
.note{font-size:12px;color:var(--sub);line-height:1.6;margin-top:10px}
.app.over::after{content:'여기에 도서 폴더를 놓으세요';position:fixed;inset:10px;border:3px dashed var(--accent);border-radius:16px;background:rgba(232,236,252,.85);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--accent-d);pointer-events:none;z-index:50}

/* 미리보기 */
.pvh{display:flex;gap:10px;align-items:flex-start}
.pvh .tt{flex:1;min-width:0}
.pvh h2{margin:0;font-size:16px;word-break:break-all}
.pvh .path{font-size:12px;color:var(--sub);word-break:break-all;margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.badge{font-size:11.5px;background:var(--bg);border-radius:5px;padding:1px 7px;color:var(--sub)}
.whybox{background:var(--accent-l);border-radius:10px;padding:10px 12px;margin-top:10px}
.whybox h3{margin:0 0 4px;font-size:13px;color:var(--navy)}
.whybox .lead{font-weight:600;margin-bottom:6px;line-height:1.5}
.whybox ul{margin:0;padding-left:18px;line-height:1.65;font-size:12.5px}
.secttl{font-size:12.5px;font-weight:700;color:var(--navy);margin:14px 0 6px;display:flex;align-items:center;gap:6px}
.heads{display:flex;flex-wrap:wrap;gap:6px}
.heads button{border:1px solid var(--line-2);background:#fff;border-radius:6px;padding:3px 8px;font-size:12px;text-align:left;max-width:100%}
.heads button:hover{border-color:var(--accent)}
.heads button em{font-style:normal;color:var(--sub);margin-left:4px;font-family:var(--f-mono);font-size:11px}
.psg{border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:6px;background:#fff;cursor:pointer;font-size:12.5px;line-height:1.6}
.psg:hover,.psg.on{border-color:var(--accent)}
.psg .pg{font-family:var(--f-mono);font-size:11px;color:var(--accent-d);font-weight:700;margin-right:6px}
.viewer{border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:8px;overflow:hidden}
.vbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);background:#fafbfe;font-size:12.5px}
.vbar .pgno{font-family:var(--f-mono)}
.vbody{max-height:72vh;overflow:auto;position:relative;background:#f6f7fb}
.vbody .canvas-wrap{position:relative;margin:10px auto;box-shadow:0 1px 6px rgba(0,0,0,.18);background:#fff}
.vbody canvas{display:block}
.vbody .hlb{position:absolute;background:rgba(255,214,0,.42);border-radius:2px;mix-blend-mode:multiply;pointer-events:none}
.vbar .grp{display:inline-flex;align-items:center;gap:4px}
.vbar .seg{border:1px solid var(--line);border-radius:6px;padding:2px 8px;gap:10px;font-size:12px;color:var(--sub)}
.pgin{width:56px;font:inherit;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line-2);border-radius:5px;padding:1px 4px;text-align:right}
.vfind{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);background:#fff}
.vfind .fi{flex:1;min-width:200px;display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:8px;padding:0 8px}
.vfind .fi:focus-within{border-color:#ff8c1a;box-shadow:0 0 0 2px #ffe3c7}
.vfind input{flex:1;border:0;outline:0;font:inherit;font-size:13px;padding:5px 0;min-width:0;background:transparent}
.vfind input::-webkit-search-cancel-button{display:none}
.fcount{font-family:var(--f-mono);min-width:70px}
.flist{max-height:190px;overflow:auto;border-bottom:1px solid var(--line);background:#fffaf4;font-size:12px;line-height:1.55}
.flist .fh{padding:4px 10px;cursor:pointer;border-bottom:1px solid #f6ead9}
.flist .fh:hover,.flist .fh.on{background:#ffeedd}
.flist .pg{font-family:var(--f-mono);font-size:11px;color:#c25e00;font-weight:700;margin-right:6px}
mark.f{background:#ffc98f}
mark.f.cur{background:#ff8c1a;color:#fff;box-shadow:0 0 0 2px #ff8c1a}
.vbody .hlf{position:absolute;background:rgba(255,140,26,.38);border-radius:2px;mix-blend-mode:multiply;pointer-events:none}
.vbody .hlf.cur{background:rgba(255,120,0,.55);outline:2px solid #ff6a00}
.tlayer{position:absolute;inset:0;line-height:1;overflow:hidden}
.tlayer span{position:absolute;white-space:pre;color:transparent;transform-origin:0 0;cursor:text}
.tlayer span::selection{background:rgba(43,68,201,.32);color:transparent}
.tlayer br::selection{background:transparent}
.psg{position:relative;padding-right:34px!important}
.psg .cp{position:absolute;right:6px;top:6px;border:1px solid var(--line);background:#fff;border-radius:5px;font-size:11px;padding:1px 4px;opacity:.55}
.psg:hover .cp{opacity:1}
body.vmode{overflow:hidden}
#vwin{height:100%;display:flex;flex-direction:column;padding:10px 12px;gap:8px}
#vwin .vwh{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
#vwin .vwh b{font-size:15px;color:var(--navy)}
#vwin .viewer{flex:1;display:flex;flex-direction:column;min-height:0;margin:0}
#vwin .vbody{flex:1;max-height:none}
.vtext{white-space:pre-wrap;word-break:break-word;line-height:1.75;padding:14px 18px;font-size:13px;background:#fff;margin:0;font-family:var(--f-ui)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:80;box-shadow:var(--shadow);max-width:90vw}
.warnline{background:var(--warn-l);border:1px solid #f0d58a;border-radius:8px;padding:7px 10px;font-size:12.5px;margin-bottom:10px}

@media (max-width:860px){
  .main{grid-template-columns:1fr;grid-template-rows:auto auto}
  .list{border-right:0;border-bottom:1px solid var(--line);max-height:none}
  .steps{grid-template-columns:1fr}
  .app{height:auto;min-height:100%}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="bar">
    <span class="brand">📚 계장도서검토</span>
    <span class="folder" id="folderChip" title="검색 대상 폴더"><span class="dot"></span><b id="folderName">폴더 없음</b><span class="muted" id="folderStat"></span></span>
    <button class="btn sm" id="btnPick" title="검색할 도서 폴더 고르기 (하위 폴더 포함)">📁 폴더 선택</button>
    <button class="btn sm" id="btnReconnect" hidden>🔗 폴더 다시 연결</button>
    <button class="btn sm" id="btnRescan" hidden title="폴더에 새로 넣은 · 바뀐 · 지운 파일만 반영">🔄 새 파일 반영</button>
    <span class="sp"></span>
    <span class="prog" id="prog" hidden><span class="pb"><i id="progBar"></i></span><span id="progText"></span><button class="btn sm" id="btnStop">중지</button></span>
    <button class="btn sm" id="btnDict" title="검색어를 넓혀 주는 계장 용어 사전 보기">📖 용어 사전</button>
  </div>

  <div class="sz">
    <form class="qrow" id="qform" autocomplete="off">
      <div class="qbox"><span class="ic">🔍</span>
        <input id="q" type="search" placeholder="예) Transmitter 관련 도서 · 압력 전송기 설치 · HART 통신 · 제어밸브 포지셔너" aria-label="검색어">
        <button type="button" class="x" id="qclear" title="지우기" hidden>✕</button>
      </div>
      <button class="btn pri" type="submit">검색</button>
    </form>
    <div class="opts">
      <label title="Transmitter → 전송기·트랜스미터·압력 전송기·PT-101 같은 표현까지 함께 찾음"><input type="checkbox" id="optExpand" checked> 계장 용어 확장</label>
      <label>형식 <select id="optFmt"><option value="">전체</option></select></label>
      <label>폴더 <select id="optDir"><option value="">전체</option></select></label>
      <label>정렬 <select id="optSort"><option value="score">관련도순</option><option value="name">이름순</option></select></label>
    </div>
    <div class="chips" id="chips"></div>
    <div class="interp" id="interp" hidden></div>
  </div>

  <div class="main" id="main" hidden>
    <div class="list" id="list"></div>
    <div class="pv" id="pv"></div>
  </div>
  <div id="intro" class="intro" hidden></div>
</div>
<div id="vwin" hidden></div>
<input type="file" id="dirInput" webkitdirectory directory multiple hidden>

<script src="vendor/pdf.min.js"></script>
<script>
'use strict';
/* =====================================================================================
 * 계장도서검토 — 구조
 *   1) 용어 사전(THES): 계장 개념 → 한/영 표현 · 약어 · 하위 개념 · 계기 태그 패턴 · 다른 뜻(배제어)
 *   2) 본문 추출: PDF(pdf.js, 쪽 단위 · 목차) / EPUB / DOCX / HWPX / TXT / MD  → '쪽' 배열
 *   3) 보관: IndexedDB 'gyejang-books' (파일 경로+크기+수정시각이 같으면 다시 읽지 않음)
 *   4) 검색: 질의 해석(개념 인식·조사/불용어 제거·오타 교정) → 쪽 단위 BM25 → 책 점수
 *            = 깊이(가장 관련 높은 쪽들) + 폭(다룬 쪽 비율) + 목차·제목 일치 + 분야 문맥(다른 뜻 배제)
 *   5) 설명: 왜 관련 있는지(제목/목차/본문 분량/집중 구간/함께 다룬 주제) + 근거 구절 + 원본 쪽 미리보기
 * ===================================================================================== */
const VERSION = '2026-10-24.1';
const EXTRACT_VER = 1;                 // 본문 추출 방식이 바뀌면 올림 → 다시 읽음
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const fmtN = n => Number(n || 0).toLocaleString('ko-KR');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const Q0 = new URLSearchParams(location.search);
if (Q0.get('embed') === '1') document.body.classList.add('embed');
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
const SUPPORTED = { pdf:'PDF', epub:'EPUB', docx:'DOCX', hwpx:'HWPX', txt:'TXT', md:'MD' };
function toast(msg, ms = 2600) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}

/* ===================================================================================== 1) 용어 사전

function normText(t) {
  return String(t || '').normalize('NFKC')
    .replace(/\r\n?/g, '\n').replace(/\u00ad/g, '').replace(/[\u2010-\u2015\u2212]/g, '-')
    .replace(/[\u00a0\u2000-\u200b\u3000\ufeff]/g, ' ')
    .replace(/([A-Za-z])-\n([a-z])/g, '$1$2')            // 줄 끝 하이픈으로 끊긴 영어 단어 잇기
    .replace(/[ \t\f\v]+/g, ' ').replace(/ ?\n[ \n]*/g, '\n').trim();
}
// 긴 글을 약 2,500자 '쪽'으로 (문단 경계에서 자름). heads: [{t, at(글자 위치)}] → 쪽 번호로 바꿔 돌려줌
function paginate(text, heads = [], size = 2500) {
  const pages = [], starts = []; let i = 0; text = normText(text);
  while (i < text.length) {
    let e = Math.min(text.length, i + size);
    if (e < text.length) { const nl = text.lastIndexOf('\n', e); if (nl > i + size * 0.5) e = nl + 1; }
    starts.push(i); pages.push(text.slice(i, e).trim()); i = e;
  }
  const hp = heads.map(h => { let p = 0; while (p + 1 < starts.length && starts[p + 1] <= h.at) p++; return { t: h.t, p }; });
  return { pages: pages.length ? pages : [''], heads: hp };
}
const HEAD_RE = /^(?:(?:chapter|part|section|unit|module|lesson)\s+\d+[\s.:-]|제\s*\d+\s*[장편부절]\b|\d{1,2}\.\s+[A-Z가-힣])/i;
function guessHeads(pages) {   // 목차 정보가 없는 PDF: 'Chapter 3 …', '제3장 …' 같은 줄을 장 제목으로
  const out = [];
  pages.forEach((pg, p) => { for (const ln of pg.split('\n').slice(0, 6)) { const s = ln.trim(); if (s.length > 4 && s.length < 90 && HEAD_RE.test(s)) out.push({ t: s, p }); } });
  return out.slice(0, 400);
}

async function extractPdf(buf, onPage, stopFlag) {
  const doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false, disableFontFace: true }).promise;
  try {
    const pages = [];
    for (let i = 1; i <= doc.numPages; i++) {
      if (stopFlag && stopFlag()) throw new Error('중지됨');
      let s = '';
      try {
        const pg = await doc.getPage(i), tc = await pg.getTextContent();
        for (const it of tc.items) { if (it.str !== undefined) { s += it.str; if (it.hasEOL) s += '\n'; else if (it.str && !/\s$/.test(it.str)) s += ''; } }
        pg.cleanup();
      } catch (_) {}
      pages.push(normText(s));
      if (onPage && (i % 10 === 0 || i === doc.numPages)) onPage(i, doc.numPages);
    }
    let heads = [];
    try {   // PDF 책갈피(목차) → 장 제목 + 쪽
      const ol = await doc.getOutline();
      const walk = async (items, lv) => {
        for (const it of items || []) {
          if (heads.length >= 400) return;
          let p = -1;
          try { let d = it.dest; if (typeof d === 'string') d = await doc.getDestination(d); if (Array.isArray(d) && d[0]) p = typeof d[0] === 'number' ? d[0] : await doc.getPageIndex(d[0]); } catch (_) {}
          if (it.title && p >= 0) heads.push({ t: normText(it.title).replace(/\n/g, ' '), p });
          if (lv < 2) await walk(it.items, lv + 1);
        }
      };
      await walk(ol, 0);
    } catch (_) {}
    if (!heads.length) heads = guessHeads(pages);
    let title = '';
    try { const m = await doc.getMetadata(); title = (m?.info?.Title || '').trim(); } catch (_) {}
    return { pages, heads, title };
  } finally { try { doc.destroy(); } catch (_) {} }
}

      return `<div class="fh${i === this.fcur ? ' on' : ''}" data-fi="${i}"><span class="pg">${u}${h.p + 1}</span>${a ? '…' : ''}${esc(t.slice(a, h.i).replace(/\n/g, ' '))}<mark class="f">${esc(t.substr(h.i, h.n))}</mark>${esc(t.slice(h.i + h.n, b).replace(/\n/g, ' '))}…</div>`; }).join('') + (n > 300 ? `<div class="muted" style="padding:4px 8px">… ${fmtN(n - 300)}곳 더 (▲▼ 로 이동)</div>` : '');
    L.querySelector('.fh.on')?.scrollIntoView({ block: 'nearest' });
  }
  async draw() {
    const B = this.B, P = this.page, seq = ++this.seq, body = this.body, hp = this.hitPages, k = hp.indexOf(P);
    this.$('pg').value = P + 1;
    this.$('hitNo').textContent = hp.length ? `${k >= 0 ? k + 1 : '–'}/${hp.length}` : '';
    this.$('prevHit').disabled = !hp.some(p => p < P); this.$('nextHit').disabled = !hp.some(p => p > P);
    this.$('prevPage').disabled = P <= 0; this.$('nextPage').disabled = P >= B.nPages - 1;
    this.host.querySelectorAll('.fh').forEach(e => e.classList.toggle('on', +e.dataset.fi === this.fcur));
    if (this.onPage) this.onPage(P);
    const curK = this.fcur >= 0 && this.fhits[this.fcur].p === P ? this.fhits[this.fcur].k : -1;
    if (this.mode === 'page' && this.file && window.pdfjsLib) {
      if (!body.querySelector('.canvas-wrap')) body.innerHTML = '<div class="empty">쪽 그리는 중…</div>';
      try {
        const doc = await pdfDoc(B, this.file); if (seq !== this.seq) return;
        const pg = await doc.getPage(P + 1);
        const w = Math.max(320, body.clientWidth - 24), vp0 = pg.getViewport({ scale: 1 }), scale = w / vp0.width, vp = pg.getViewport({ scale });
        const dpr = window.devicePixelRatio || 1, cv = document.createElement('canvas');
        cv.width = Math.floor(vp.width * dpr); cv.height = Math.floor(vp.height * dpr); cv.style.width = vp.width + 'px'; cv.style.height = vp.height + 'px';
        const wrap = document.createElement('div'); wrap.className = 'canvas-wrap'; wrap.style.width = vp.width + 'px'; wrap.style.height = vp.height + 'px'; wrap.appendChild(cv);
        await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise;
        if (seq !== this.seq) return;
        // 투명 글자층(끌어 선택 → 복사) + 검색어(노랑) · 찾기(주황) 표시. 위치 = 글자 조각 위치 × 그 안의 글자 폭 비율
        const tc = await pg.getTextContent(), layer = document.createElement('div'); layer.className = 'tlayer';
        let first = null, cur = null, fk = 0;
        for (const it of tc.items) {
          if (!it.str) { if (it.hasEOL) layer.appendChild(document.createElement('br')); continue; }
          const tx = pdfjsLib.Util.transform(vp.transform, it.transform), fh = Math.hypot(tx[2], tx[3]), wd = it.width * scale;
          if (fh < 1) continue;
          const fam = tc.styles[it.fontName]?.fontFamily || 'sans-serif';
          MEAS.font = `${fh}px ${fam}`; const mw = t => MEAS.measureText(t).width, full = mw(it.str) || 1;
          const sp = document.createElement('span'); sp.textContent = it.str;
          Object.assign(sp.style, { left: tx[4] + 'px', top: (tx[5] - fh) + 'px', fontSize: fh + 'px', fontFamily: fam, transform: `scaleX(${wd / full})` });
          layer.appendChild(sp); if (it.hasEOL) layer.appendChild(document.createElement('br')); else layer.appendChild(document.createTextNode(' '));
          const box = (m, cls) => { const x = tx[4] + wd * (mw(it.str.slice(0, m.index)) / full), y = tx[5] - fh, b = document.createElement('div');
            b.className = cls; Object.assign(b.style, { left: x + 'px', top: y + 'px', width: Math.max(4, wd * (mw(m[0]) / full)) + 'px', height: fh * 1.15 + 'px' }); wrap.appendChild(b); return y; };
          for (const [re, cls] of [[this.re, 'hlb'], [this.fre, 'hlf']]) {
            if (!re) continue; re.lastIndex = 0; let m;
            while ((m = re.exec(it.str))) {
              if (!m[0]) { re.lastIndex++; continue; }
              const isCur = cls === 'hlf' && fk === curK, y = box(m, cls + (isCur ? ' cur' : ''));
              if (cls === 'hlf') { if (isCur) cur = y; fk++; } else if (first === null || y < first) first = y;
            }
          }
        }
        wrap.appendChild(layer);
        body.innerHTML = ''; body.appendChild(wrap);
        const y = cur ?? (this.fre ? null : first); body.scrollTop = y !== null ? Math.max(0, y - 140) : 0;
        pg.cleanup(); return;
      } catch (e) { if (seq !== this.seq) return; body.innerHTML = `<div class="warnline" style="margin:8px">원본 쪽을 그리지 못해 글자로 보여 줍니다 (${esc(e.message || e)})</div>`; }
    }
    const txt = B.pages[P] || '';
    const pre = document.createElement('pre'); pre.className = 'vtext'; pre.innerHTML = txt ? hl2(txt, this.re, this.fre, curK) : '<span class="muted">(이 쪽에는 글자가 없습니다)</span>';
    if (body.firstChild?.className !== 'warnline') body.innerHTML = ''; body.appendChild(pre);
    if (this.mode === 'page' && !this.file && B.ext === 'pdf') body.insertAdjacentHTML('afterbegin', '<div class="warnline" style="margin:8px">원본 쪽 그림은 [폴더 다시 연결] 후 볼 수 있습니다.</div>');
    const mk = pre.querySelector('mark.f.cur') || (!this.fre && pre.querySelector('mark'));
    body.scrollTop = mk ? Math.max(0, mk.offsetTop - 120) : 0;
  }
}
// 새 창: 같은 앱 주소에 viewer=1 — 본문은 이 PC 의 색인(IndexedDB), 원본 PDF 는 원래 창(opener)의 파일을 빌려 씀
function openViewerWindow(v) {
  const u = new URL(location.href); u.search = '';
  const P = new URLSearchParams({ viewer: '1', sig: v.B.sig, p: String(v.page + 1), q: v.q || '', f: v.fre?._t || '', m: v.mode });
  const w = window.open(`${u.pathname}?${P}`, '_blank', 'popup=yes,width=1100,height=920');
  if (!w) toast('새 창이 막혔습니다 — 브라우저 주소창 오른쪽의 팝업 차단 표시에서 허용해 주세요', 4000);
}
function openOriginal(B, f, pg) {
  if (!B) { const R = STATE.res?.results[STATE.sel]; if (!R) return; B = R.B; f = LIB.files.get(B.rel); pg = STATE.viewer?.page ?? 0; }
  if (!f) return;
  const url = URL.createObjectURL(f);
  const w = window.open(B.ext === 'pdf' ? `${url}#page=${(pg || 0) + 1}` : url, '_blank');
  if (!w) { const a = document.createElement('a'); a.href = url; a.download = B.name; a.click(); }
  setTimeout(() => URL.revokeObjectURL(url), 120000);
}
async function initViewerWindow() {   // ?viewer=1 로 열린 새 창
  document.body.classList.add('vmode'); $('#app').hidden = true;
  const W = $('#vwin'); W.hidden = false;
  const sig = Q0.get('sig'), rec = await DB.get('books', sig).catch(() => null);
  if (!rec) { W.innerHTML = '<div class="empty">이 책의 색인을 찾지 못했습니다. 원래 화면에서 다시 열어 주세요.</div>'; return; }
  const B = makeBook(rec); let file = null;
  try { file = window.opener?.BOOKS?.LIB.files.get(B.rel) || null; } catch (_) {}
  const q = Q0.get('q') || '', Q = q ? buildQuery(q) : null;
  const hitPages = Q ? [...new Set(Q.mains.flatMap(qq => [...matchConcept(B, qq).pages.keys()]))].sort((a, b) => a - b) : [];
  document.title = `${B.base} — 계장도서검토`;
  W.innerHTML = `<div class="vwh"><b>📖 ${esc(B.base)}</b><span class="muted">${esc(B.rel)} · ${SUPPORTED[B.ext]} · ${fmtN(B.nPages)}${B.ext === 'pdf' ? '쪽' : '구간'}${q ? ` · 검색어 '${esc(q)}' 노란 표시` : ''}</span></div><div class="viewer" id="viewerWin"></div>`;
  const v = new Viewer($('#viewerWin'), { B, re: Q ? hlRegex(Q) : null, q, hitPages, page: (+Q0.get('p') || 1) - 1, file, popup: true });
  if (Q0.get('m') === 'text') v.mode = 'text';
  STATE.viewer = v;

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); v.$('find').focus(); v.$('find').select(); return; }
    if (e.target.tagName === 'INPUT') return;

function showDict() {
  const P = $('#pv'); $('#main').hidden = false; $('#intro').hidden = true;

    <div class="muted" style="margin-bottom:8px">질문에 개념 이름 · 표현 중 하나만 들어 있으면 됩니다. 하위 개념(예: Transmitter → 압력 전송기 · 차압 전송기)도 함께 찾고, 계기 태그(PT-101 · FIT-2001A)는 약한 근거로 셉니다.</div>

      <div class="muted" style="line-height:1.6">${esc([...c.t.map(x => x[0]), ...c.ab.map(x => x[0])].join(' · '))}${c.tag ? ' · 계기 태그' : ''}</div></div>`).join('')}</div>`;

/* --- 폴더 고르기 */
async function pickFolder() {
  if (RUN.busy) { toast('지금 읽는 중입니다. 끝나거나 [중지] 후 다시 하세요'); return; }
  if (window.showDirectoryPicker) {   // https · localhost: 폴더 권한을 기억해 다음에 한 번에 다시 연결
    try {
      const h = await window.showDirectoryPicker({ id: 'gyejang-books', mode: 'read' });
      LIB.dirHandle = h; DB.put('kv', h, 'dir').catch(() => {});
      const out = []; setProg(0, '폴더 훑는 중…'); await walkHandle(h, h.name + '/', out); setProg(null);
      return useFiles(out, h.name);
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  $('#dirInput').value = ''; $('#dirInput').click();
}
$('#dirInput').addEventListener('change', e => {
  const fl = [...e.target.files]; if (!fl.length) return;
  const folder = (fl[0].webkitRelativePath || fl[0].name).split('/')[0];
  useFiles(fl.filter(f => relOk(f.webkitRelativePath || f.name)).map(f => ({ rel: f.webkitRelativePath || f.name, getFile: async () => f })), folder);
});
async function reconnect() {
  const h = LIB.dirHandle || await DB.get('kv', 'dir').catch(() => null);
  if (h && h.requestPermission) {
    try { if ((await h.requestPermission({ mode: 'read' })) === 'granted') { LIB.dirHandle = h; const out = []; setProg(0, '폴더 훑는 중…'); await walkHandle(h, h.name + '/', out); setProg(null); return useFiles(out, h.name); } } catch (_) {}
  }
  toast(`'${LIB.folder}' 폴더를 다시 골라 주세요`); $('#dirInput').value = ''; $('#dirInput').click();
}
// 끌어다 놓기
const app = $('#app'); let dragN = 0;
app.addEventListener('dragenter', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); dragN++; app.classList.add('over'); } });
app.addEventListener('dragover', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) e.preventDefault(); });
app.addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; app.classList.remove('over'); } });
app.addEventListener('drop', async e => {
  e.preventDefault(); dragN = 0; app.classList.remove('over');
  const its = [...(e.dataTransfer?.items || [])].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  const dirs = its.filter(x => x.isDirectory); if (!dirs.length) { toast('파일이 아니라 폴더를 놓아 주세요'); return; }
  const out = []; setProg(0, '폴더 훑는 중…'); for (const d of dirs) await walkEntry(d, '', out); setProg(null);
  useFiles(out, dirs.length === 1 ? dirs[0].name : dirs.map(d => d.name).join(' + '));
});

/* --- 이벤트 */
$('#qform').addEventListener('submit', e => { e.preventDefault(); doSearch($('#q').value); });
$('#q').addEventListener('input', () => { $('#qclear').hidden = !$('#q').value; });
$('#qclear').onclick = () => { $('#q').value = ''; doSearch(''); $('#q').focus(); };
$('#chips').addEventListener('click', e => { const b = e.target.closest('[data-q]'); if (b) { $('#q').value = b.dataset.q; doSearch(b.dataset.q); } });
['#optExpand', '#optFmt', '#optDir', '#optSort'].forEach(s => $(s).addEventListener('change', () => { if (STATE.q) doSearch(STATE.q, true); }));
$('#btnPick').onclick = pickFolder; $('#btnReconnect').onclick = reconnect; $('#btnRescan').onclick = reconnect;
$('#btnStop').onclick = () => { RUN.stop = true; };
$('#btnDict').onclick = showDict;
$('#list').addEventListener('click', e => {
  if (e.target.id === 'more') { STATE.shown += 30; renderResults(); return; }
  const r = e.target.closest('.res[data-i]'); if (!r) return;
  STATE.sel = +r.dataset.i; document.querySelectorAll('.res[data-i]').forEach(x => x.classList.toggle('on', x === r)); renderPreview();
});
$('#pv').addEventListener('click', e => {
  const c = e.target.closest('[data-cp]'); if (c) { e.stopPropagation(); const R = STATE.res?.results[STATE.sel]; if (R) copyText(snippet(R.B, R, +c.dataset.cp, STATE.res.Q).replace(/^…|…$/g, '') + '\n' + cite(R.B, +c.dataset.cp)); return; }
  const g = e.target.closest('[data-go]'); if (g && STATE.viewer) { STATE.viewer.go(+g.dataset.go); $('#viewerHost').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return; }
  if (e.target.id === 'openOrig') openOriginal();
});
document.addEventListener('keydown', e => {
  if (document.body.classList.contains('vmode') || !STATE.res || !STATE.res.results.length || e.target.tagName === 'INPUT' && e.target.id !== 'q') return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (e.target.id === 'q' && e.key === 'ArrowUp') return;
    e.preventDefault(); STATE.sel = Math.max(0, Math.min(Math.min(STATE.shown, STATE.res.results.length) - 1, STATE.sel + (e.key === 'ArrowDown' ? 1 : -1)));
    document.querySelectorAll('.res[data-i]').forEach(x => x.classList.toggle('on', +x.dataset.i === STATE.sel));
    $(`.res[data-i="${STATE.sel}"]`)?.scrollIntoView({ block: 'nearest' }); renderPreview();
  }
});
let rsz; window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { if (STATE.viewer?.mode === 'page') STATE.viewer.draw(); }, 250); });

/* --- 시작: 보관된 색인이 있으면 바로 검색 가능 (폴더 연결은 원본 미리보기 · 새 파일 반영 때만 필요) */
(async () => {
  if (Q0.get('viewer') === '1') return initViewerWindow();
  renderTop();
  if (!window.indexedDB) { toast('이 브라우저는 색인 보관(IndexedDB)을 쓸 수 없습니다 — Edge 또는 Chrome 으로 여세요', 6000); }

  if (had) {
    const h = await DB.get('kv', 'dir').catch(() => null);
    if (h && h.queryPermission && (await h.queryPermission({ mode: 'read' }).catch(() => '')) === 'granted') { LIB.dirHandle = h; reconnect(); }
  }

  const q = Q0.get('q'); if (q) { $('#q').value = q; doSearch(q); }
  $('#q').focus();
