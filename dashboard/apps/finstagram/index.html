<style>

<body>
<div class="topbar"><div class="in">
  <div class="logo">재무스타그램<small>DART 공시 재무제표 대시보드</small></div>
  <div class="search">
    <input id="q" placeholder="회사명 또는 종목코드 검색" autocomplete="off">
    <div class="dd" id="dd"></div>
  </div>
</div></div>

<div id="modal" class="modal" hidden>
  <div class="mbox" role="dialog" aria-modal="true">
    <div class="mhead"><div><b id="mTitle"></b><div class="note" id="mSub"></div></div><button class="mclose" aria-label="닫기">✕</button></div>
    <div id="mBody"></div>
  </div>
</div>

<div class="wrap">
  <div class="controls">
    <select id="year"></select>
    <select id="reprt">
      <option value="11011">사업보고서 (연간)</option>
      <option value="11014">3분기보고서</option>
      <option value="11012">반기보고서</option>
      <option value="11013">1분기보고서</option>
    </select>
    <select id="fs">
      <option value="">연결 우선 (없으면 별도)</option>
      <option value="CFS">연결재무제표</option>
      <option value="OFS">별도재무제표</option>
    </select>
  </div>

  <div id="main">
    <div class="card empty"><b>회사를 검색해 보세요</b>회사명을 입력하면 최근 공시된 재무제표와 요약을 보여드립니다.
      <div class="stories" id="chips"></div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const thisYear = new Date().getFullYear();
for (let y = thisYear; y >= 2015; y--) $('#year').insertAdjacentHTML('beforeend', `<option value="${y}">${y}년</option>`);
$('#year').insertAdjacentHTML('afterbegin', '<option value="" selected>최근 연도 자동</option>');

let current = null, charts = [], ddItems = [], ddIdx = -1, timer;

['삼성물산','삼성전자','SK하이닉스','현대자동차','NAVER','카카오'].forEach(n=>{
  const b=document.createElement('button');b.className='story';
  b.innerHTML=`<div class="ring"><span>${n[0]}</span></div>${n}`;
  b.onclick=()=>searchPick(n);
  $('#chips').appendChild(b);
});

{ const q0 = new URLSearchParams(location.search).get('q'); if (q0) setTimeout(() => { $('#q').value = q0; searchPick(q0); }, 50); }
$('#q').addEventListener('input', e => {
  clearTimeout(timer);
  const v = e.target.value.trim();
  if (!v) return hideDD();
  timer = setTimeout(async () => {
    const r = await apiSearch(v); if (r.error) { ddItems = []; return showErr(r.error); }
    ddItems = r; ddIdx = -1; renderDD();
  }, 150);
});
$('#q').addEventListener('keydown', e => {
  if (!ddItems.length) return;
  if (e.key === 'ArrowDown') { ddIdx = Math.min(ddIdx + 1, ddItems.length - 1); renderDD(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { ddIdx = Math.max(ddIdx - 1, 0); renderDD(); e.preventDefault(); }
  else if (e.key === 'Enter') pick(ddItems[Math.max(ddIdx, 0)]);
  else if (e.key === 'Escape') hideDD();
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) hideDD(); });
['year','reprt','fs'].forEach(id => $('#'+id).addEventListener('change', () => current && load()));
window.addEventListener('resize', () => charts.forEach(c => c.resize()));

function renderDD() {
  const dd = $('#dd');
  if (!ddItems.length) { dd.innerHTML = '<div><span>검색 결과가 없습니다</span></div>'; dd.style.display='block'; return; }
  dd.innerHTML = ddItems.map((c,i) => `<div class="${i===ddIdx?'on':''}" data-i="${i}"><b style="font-weight:600">${esc(c.corp_name)}${c.ceo_nm != null ? ` <em class="ceo">대표 ${esc(c.ceo_nm || '정보 없음')}</em>` : ''}</b><span>${c.stock_code ? '상장 '+c.stock_code : '비상장'}</span></div>`).join('');
  dd.style.display = 'block';
  dd.querySelectorAll('[data-i]').forEach(el => el.onclick = () => pick(ddItems[+el.dataset.i]));
}
/* 2026-11-09: 검색 실패를 조용히 넘기지 않고 이유 + 연결 점검을 보여 줌 · ?q=회사명 으로 열면 바로 검색 (대시보드 클로드 비서) */
async function apiSearch(q) { try { const r = await fetch('/api/search?q=' + encodeURIComponent(q)); const j = await r.json(); return Array.isArray(j) ? j : { error:j.error || ('응답 ' + r.status) }; } catch (e) { return { error:'재무스타그램 서버에 닿지 못했습니다: ' + e.message }; } }
async function searchPick(n) { const r = await apiSearch(n); if (r.error) return showErr(r.error); if (!r.length) return showErr(`'${n}' 으로 찾은 회사가 없습니다.`); pick(r[0]); }
function showErr(msg) { hideDD(); const main = $('#main'); let box = $('#finErr'); if (!box) { main.insertAdjacentHTML('afterbegin', '<div id="finErr" class="err" style="margin-bottom:12px"></div>'); box = $('#finErr'); }
  box.innerHTML = `⚠ 검색이 안 됩니다 — ${esc(msg)} <button id="finDiagBtn" style="margin-left:8px;cursor:pointer;border-radius:8px;border:1px solid currentColor;background:none;color:inherit;padding:2px 10px;font-weight:600">연결 점검</button><div id="finDiag" style="font-weight:400;margin-top:6px"></div>`;
  $('#finDiagBtn').onclick = runDiag; }
async function runDiag() { const el = $('#finDiag'); if (!el) return; el.textContent = 'DART 접속을 확인하는 중… (최대 30초)';
  try { const d = await (await fetch('/api/diag')).json();
    el.innerHTML = `<table style="border-collapse:collapse;font-size:12.5px">${[['DART 키', d.key ? (d.keyOk ? `있음 (${d.keyLen}자 ✓)` : `있음 (${d.keyLen}자 — DART 키는 40자)`) : '없음 — 대시보드 ⚙ 에서 .env 경로 지정'], ['키 파일', d.keyFile], ['프록시', d.proxy], ['DART 접속', (d.dart ? '✅ ' : '❌ ') + d.msg], ['회사 목록', d.corpCache ? '받아 둠' : '아직 못 받음(처음 검색 때 DART 에서 약 13MB)'], ['판', d.ver || ''], ['PAC', (d.pac || '없음') + (d.pacProxies?.length ? ' → ' + d.pacProxies.join(', ') : '') + (d.pacErr ? ' · ' + d.pacErr : '')], ['연결 길', d.route || '(아직 못 찾음)'], ['시도', (d.tried || []).join(' / ') || '-']].map(([a, b]) => `<tr><th style="text-align:left;padding:2px 10px 2px 0;white-space:nowrap">${a}</th><td style="text-align:left;word-break:break-all">${esc(b)}</td></tr>`).join('')}</table>`;
  } catch (e) { el.textContent = '점검 실패: ' + e.message; } }
function hideDD(){ $('#dd').style.display='none'; ddItems=[]; }
function pick(c){ current = c; $('#q').value = c.corp_name; hideDD(); load(); }

async function load() {
  const main = $('#main');
  main.classList.add('loading');
  if (!main.querySelector('.profile')) main.innerHTML = '<div class="card empty"><b>불러오는 중…</b>DART에서 재무제표를 가져오고 있습니다.</div>';
  const p = new URLSearchParams({corp_code: current.corp_code, year: $('#year').value, reprt: $('#reprt').value, fs: $('#fs').value});
  try {
    const d = await (await fetch('/api/fin?' + p)).json();
    render(d); if (d.error) showErr(d.error);
  } catch (e) {
    main.innerHTML = `<div class="err">불러오기 실패: ${esc(e.message)}</div>`;
  }
  main.classList.remove('loading');
}

// ---------- 포맷
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function won(v){
  if (v==null) return '-';
  const a=Math.abs(v), s=v<0?'-':'';
  if (a>=1e12) return s+(a/1e12).toLocaleString('ko-KR',{maximumFractionDigits:1})+'조';
  if (a>=1e8) return s+Math.round(a/1e8).toLocaleString('ko-KR')+'억';
  return s+Math.round(a).toLocaleString('ko-KR')+'원';
}
const eok = v => v==null ? '-' : (v/1e8).toLocaleString('ko-KR',{maximumFractionDigits:0});
const pf = (v,d=1) => v==null ? '-' : v.toFixed(d)+'%';
const cnt = v => v==null ? '-' : Math.round(v).toLocaleString('ko-KR');
const share = (a,b) => b ? (a/b*100).toFixed(1)+'%' : '-';
const manwon = v => v ? (v/1e4).toLocaleString('ko-KR',{maximumFractionDigits:0})+'만원' : '-';
function chg(cur, prev){
  if (cur==null || prev==null || prev===0) return '';
  const g=(cur-prev)/Math.abs(prev)*100;
  return `<span class="${g>=0?'up':'down'}">${g>=0?'▲':'▼'} ${Math.abs(g).toFixed(1)}%</span> <span class="note">전년 대비</span>`;
}
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---------- 막대 차트 (2D)
function tipBox() {
  return {backgroundColor: cssv('--card'), borderColor: cssv('--line'), borderWidth: 1, padding: [8, 10], textStyle: {color: cssv('--text'), fontSize: 12},
    extraCssText: 'box-shadow:0 4px 16px rgba(0,0,0,.12);border-radius:8px'};
}
// 툴팁: 값이 먼저(굵게), 이름은 뒤(옅게), 색은 짧은 선 키로만
function tipRows(title, rows) {
  const muted = cssv('--muted');
  return `<div style="color:${muted};margin-bottom:4px">${esc(title)}</div>` + rows.map(r =>
    `<div style="display:flex;align-items:center;gap:8px;line-height:1.7"><span style="display:inline-block;width:12px;height:2px;border-radius:1px;background:${r.color}"></span><b>${esc(r.value)}</b><span style="color:${muted}">${esc(r.name)}</span></div>`).join('');
}
function bars(el, cats, series, colors, fmt, opts = {}) {
  const chart = echarts.init(el);
  const text2 = cssv('--text2'), muted = cssv('--muted'), line = cssv('--line'), axis = cssv('--axis'), surf = cssv('--card');
  const n = series.length;
  const vals = series.flatMap(([, d]) => d.map(x => Math.abs((x && typeof x === 'object' ? x.value : x) || 0)));
  const axisMax = opts.stack ? Math.max(0, ...cats.map((_, j) => series.reduce((a, [, d]) => a + Math.abs((d[j] && typeof d[j] === 'object' ? d[j].value : d[j]) || 0), 0))) : Math.max(0, ...vals);
  chart.setOption({
    grid: {left: 8, right: 8, top: n > 1 ? 34 : 12, bottom: 4, containLabel: true},
    legend: n > 1 ? {top: 0, left: 0, icon: 'roundRect', itemWidth: 10, itemHeight: 10, itemGap: 14, textStyle: {color: text2}} : {show: false},
    tooltip: {trigger: 'axis', axisPointer: {type: 'shadow', shadowStyle: {color: cssv('--hover'), opacity: .6}}, ...tipBox(),
      formatter: ps => tipRows(ps[0].axisValueLabel, ps.map(p => ({color: p.color, name: p.seriesName + (p.data?.est ? ' (예상)' : ''), value: p.value == null ? '-' : fmt(p.value)})))},
    xAxis: {type: 'category', data: cats, axisTick: {show: false}, axisLine: {lineStyle: {color: axis}}, axisLabel: {color: muted}},
    yAxis: {type: 'value', splitLine: {lineStyle: {color: line, width: 1, type: 'solid'}}, axisLabel: {color: muted, formatter: v => fmt(v, true, axisMax)}},
    series: series.map(([name, data], i) => ({type: 'bar', name, data, barMaxWidth: 24, barGap: '15%', barCategoryGap: '35%',
      stack: opts.stack ? 's' : undefined,
      itemStyle: {color: colors[i], borderRadius: opts.stack ? (i === n - 1 ? [4, 4, 0, 0] : 0) : [4, 4, 0, 0],
        ...(opts.stack ? {borderColor: surf, borderWidth: 1} : {})},
      emphasis: {focus: 'none', itemStyle: {opacity: .82}}})),
  });
  charts.push(chart);
  return chart;
}

// ---------- 직원 현황
function renderEmp(e, d) {
  if (!e || e.error) return `<div class="card mt"><h3>직원 현황</h3><div class="note">${esc(e?.error || '직원 현황 데이터가 없습니다.')}</div></div>`;
  const t = e.total;
  const tiles = [
    ['총 직원 수', cnt(t.total)+'명', ''],
    ['정규직', cnt(t.regular)+'명', share(t.regular, t.total)],
    ['비정규직(기간제)', cnt(t.contract)+'명', share(t.contract, t.total)],
    ['남 / 여', `${cnt(t.male)} / ${cnt(t.female)}`, t.total ? `여성 ${share(t.female, t.total)}` : ''],
    ['평균 근속연수', t.tenure==null ? '-' : t.tenure+'년', ''],
    ['1인 평균 급여', manwon(t.salary_avg), ''],
  ].map(([l,v,s]) => `<div class="ratio"><div class="l">${l}</div><div class="v">${v}</div>${s?`<div class="note">${s}</div>`:''}</div>`).join('');

  const bar = (r,c) => { const T=r+c||1; return `<div class="stack" title="정규직 ${share(r,T)} / 비정규직 ${share(c,T)}"><i style="width:${r/T*100}%"></i><i class="c" style="width:${c/T*100}%"></i></div>`; };
  const ten = x => x==null ? '-' : x+'년';
  const divRows = e.divisions.map(x => `<tr><td><b>${esc(x.name)}</b></td><td>${cnt(x.regular)}</td><td>${cnt(x.contract)}</td><td><b>${cnt(x.total)}</b></td>
      <td>${share(x.contract, x.total)}</td><td class="hide-s">${bar(x.regular, x.contract)}</td><td>${cnt(x.male)}</td><td>${cnt(x.female)}</td><td>${ten(x.tenure)}</td></tr>`).join('');
  const sumRow = `<tr class="total"><td>합계</td><td>${cnt(t.regular)}</td><td>${cnt(t.contract)}</td><td>${cnt(t.total)}</td><td>${share(t.contract, t.total)}</td>
      <td class="hide-s">${bar(t.regular, t.contract)}</td><td>${cnt(t.male)}</td><td>${cnt(t.female)}</td><td>${ten(t.tenure)}</td></tr>`;
  const sexRows = (e.by_sex||[]).map(x => `<tr><td><b>${esc(x.sex)}</b></td><td>${cnt(x.regular)}</td><td>${cnt(x.regular_part)}</td><td>${cnt(x.contract)}</td><td>${cnt(x.contract_part)}</td>
      <td><b>${cnt(x.total)}</b></td><td>${ten(x.tenure)}</td><td>${x.salary_avg ? (x.salary_avg / 1e8).toFixed(2) : '-'}</td></tr>`).join('');

  return `<div class="card mt">
    <h3>직원 현황 <span class="note">${esc(e.stlm_dt||'')} 기준 · ${esc(d.reprt_name)} · 본사(별도) 기준</span></h3>
    <div class="ratios" style="margin-top:0;margin-bottom:18px">${tiles}</div>
    <div class="grid">
      <div>
        <div class="note" style="margin-bottom:8px">사업부문별 (단위: 명) <span class="legend"><i></i>정규직 <i class="c"></i>비정규직</span></div>
        <div class="tbl"><table class="emp">
          <thead><tr><th>사업부문</th><th>정규직</th><th>비정규직</th><th>합계</th><th>비정규 비율</th><th class="hide-s">구성</th><th>남</th><th>여</th><th>평균근속</th></tr></thead>
          <tbody>${divRows}${sumRow}</tbody></table></div>
      </div>
      <div>
        <div class="note" style="margin-bottom:8px">사업부문별 고용형태 (단위: 명)</div>
        <div class="chart" id="empChart" style="height:260px"></div>
      </div>
    </div>
    ${sexRows ? `<div class="note" style="margin:18px 0 8px">성별 고용형태 (단위: 명)</div>
    <div class="unit">(인원: 명 · 급여: 억원)</div><div class="tbl"><table class="emp">
      <thead><tr><th>성별</th><th>정규직</th><th>└ 단시간</th><th>비정규직</th><th>└ 단시간</th><th>합계</th><th>평균근속</th><th>1인 평균급여(억원)</th></tr></thead>
      <tbody>${sexRows}</tbody></table></div>` : ''}
    <p class="note" style="margin-top:12px">※ 사업보고서 '직원 등의 현황' 기준이며, 비정규직은 공시상 '기간제 근로자'입니다. 소속 외 근로자(파견·용역)는 포함되지 않습니다.</p>
  </div>`;
}

// ---------- 렌더
function render(d) {
  charts.forEach(c => c.dispose()); charts = [];
  const c = d.company || {};
  const cls = {Y:'유가증권',K:'코스닥',N:'코넥스',E:'기타'}[c.corp_cls] || '';
  const name = c.corp_name || current.corp_name;
  const k = d.key || {}, v = (n,i=0) => k[n] ? k[n][i] : null;
  const emp = d.employees && !d.employees.error ? d.employees.total.total : null;
  const head = `<div class="card profile">
      <div class="avatar">${(c.stock_code || c.hm_url) ? `<img src="/api/logo?stock_code=${esc(c.stock_code || '')}&hm_url=${encodeURIComponent(c.hm_url || '')}" alt="${esc(name)} CI" onerror="this.outerHTML='<span>${esc((c.stock_name || name).replace(/^\(주\)|㈜/,'')[0])}</span>'">` : `<span>${esc((c.stock_name || name).replace(/^\(주\)|㈜/,'')[0])}</span>`}</div>
      <div class="pinfo">
        <h2>${esc(name)} ${cls ? `<span class="badge">${cls}</span>` : ''}</h2>
        ${d.year ? `<div class="pstats">
          <div><b>${won(v('revenue'))}</b>매출액</div><div><b>${won(v('operating_income'))}</b>영업이익</div>
          <div><b>${emp!=null ? cnt(emp)+'명' : '-'}</b>직원</div></div>` : ''}
        <div class="meta">${c.stock_code ? '종목코드 '+c.stock_code+' · ' : ''}대표 ${esc(c.ceo_nm||'-')} · 결산월 ${esc(c.acc_mt||'-')}월
        ${c.hm_url ? ` · <a href="${/^https?:/.test(c.hm_url)?'':'http://'}${esc(c.hm_url)}" target="_blank" rel="noopener">홈페이지</a>` : ''}</div>
        ${d.year ? `<div class="meta">${d.year}년 ${d.reprt_name} · ${d.fs_name} · 단위 ${d.currency}
          · <a href="https://dart.fss.or.kr/dsaf001/main.do?rcpNo=${d.rcept_no}" target="_blank" rel="noopener">공시 원문 보기</a></div>` : ''}
      </div>
    </div>`;
  if (d.error) { $('#main').innerHTML = head + `<div class="err mt">${esc(d.error)}</div>`; return; }

  const r = d.summary.ratios;
  const cum = d.reprt_code !== '11011';
  lastData = d;
  const kpis = ['revenue','operating_income','net_income','assets','liabilities','equity'].map(key => {
    const l = METRICS.find(m => m[0] === key)[1] + (cum && !['assets','liabilities','equity'].includes(key) ? ' (누적)' : '');
    return `<button class="card kpi click" data-metric="${key}" title="최근 5개년 비교"><div class="l">${l}<span class="more">5년 비교 ›</span></div>
      <div class="v">${won(v(key))}</div><div class="d">${chg(v(key), v(key,1))||'&nbsp;'}</div></button>`;
  }).join('');

  const s = d.summary;
  const ratioList = [
    ['영업이익률', pf(r.op_margin)], ['순이익률', pf(r.net_margin)], ['ROE', pf(r.roe)], ['ROA', pf(r.roa)],
    ['부채비율', pf(r.debt_ratio,0)], ['유동비율', pf(r.current_ratio,0)], ['자기자본비율', pf(r.equity_ratio)], ['FCF', won(r.fcf)],
  ].map(([l,val]) => `<div class="ratio"><div class="l">${l}</div><div class="v">${val}</div></div>`).join('');

  const order = ['BS','IS','CIS','CF','SCE'];
  const sjs = Object.keys(d.statements).sort((a,b) => order.indexOf(a) - order.indexOf(b));
  const labels = cum ? [`${d.periods[0]} 당기`, `${d.periods[1]} 전기`, ''] : d.periods.map(p => p+'년');

  $('#main').innerHTML = head + `
    <div class="grid kpis mt">${kpis}</div>
    ${c.stock_code ? '<div class="card mt" id="stockCard"><h3>주가</h3><div class="note">시세를 불러오는 중…</div></div>' : ''}
    <div class="card mt" id="qtrCard"><h3>분기 누적 실적 · 컨센서스</h3><div class="note">분기 실적과 컨센서스를 불러오는 중…</div></div>
    <div class="grid two mt">
      <div class="card summary">
        <h3>재무 요약</h3>
        <div class="headline">${esc(s.headline)}</div>
        <div class="tags">${s.tags.map(t => `<span class="tag ${t.tone}">${esc(t.label.replace(/\s/g,''))}</span>`).join('')}</div>
        <ul>${s.lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>
        <div class="ratios">${ratioList}</div>
        <p class="note" style="margin-top:12px">※ 공시 수치를 바탕으로 자동 계산한 요약이며 투자 판단의 근거로 사용하기 전 원문을 확인하세요.</p>
      </div>
      <div class="card">
        <h3>실적 추이 <span class="note">단위: 억원</span></h3>
        <div class="chart" id="finChart"></div>
      </div>
    </div>
    <div class="card mt" id="irCard" hidden></div>
    <div class="card mt" id="segCard"><h3>사업부문별 실적</h3><div class="note">공시 원본(XBRL)에서 사업부문 정보를 불러오는 중…</div></div>
    <div class="card mt" id="susCard"><h3>미래 지속가능성 점검</h3><div class="note">최근 5개년 데이터를 분석하는 중…</div></div>
    <div class="card mt" id="ordCard"><h3>수주 현황</h3><div class="note">사업보고서 원문에서 수주 현황을 찾는 중… (처음엔 10~20초)</div></div>
    ${renderEmp(d.employees, d)}
    <div class="card mt">
      <h3>재무제표 <span class="note">${cum ? ' · 손익/현금흐름은 누적 기준' : ''}</span></h3>
      <div class="tabs">${sjs.map((sj,i) => `<button data-sj="${sj}" class="${i===0?'on':''}">${esc(d.statements[sj].name)}</button>`).join('')}</div>
      <div class="unit">(단위: 억원)</div><div class="tbl" id="tbl"></div>
    </div>`;

  const showTable = sj => {
    const st = d.statements[sj];
    const cols = st.rows.some(x => x.values[2] != null) ? 3 : 2;
    const majors = /총계|합계|^매출액$|영업이익|당기순이익|활동.*현금흐름|^수익|매출총이익/;
    $('#tbl').innerHTML = `<table><thead><tr><th>계정과목</th>${labels.slice(0,cols).map(l=>`<th>${l}</th>`).join('')}</tr></thead><tbody>` +
      st.rows.map(x => `<tr class="${majors.test(x.name.replace(/\s/g,''))?'major':''}"><td>${esc(x.name)}${x.detail?` <span class="note">${esc(x.detail)}</span>`:''}</td>` +
        x.values.slice(0,cols).map(val => `<td class="${val<0?'neg':''}">${eok(val)}</td>`).join('') + '</tr>').join('') + '</tbody></table>';
  };
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b)); showTable(b.dataset.sj);
  });
  if (sjs.length) showTable(sjs[0]);
  document.querySelectorAll('.kpi.click').forEach(b => b.onclick = () => openHistory(b.dataset.metric));
  loadExtras(d);

  // 실적 차트
  const n = [0,1,2].filter(i => ['revenue','operating_income','net_income'].some(x => v(x,i) != null)).length;
  const idx = [...Array(n).keys()].reverse();
  bars($('#finChart'), idx.map(i => labels[i]),

// ---------- 5개년 비교
const METRICS = [
  ['revenue','매출액'], ['gross_profit','매출총이익'], ['operating_income','영업이익'], ['net_income','당기순이익'],
  ['assets','자산총계'], ['liabilities','부채총계'], ['equity','자본총계'], ['cash','현금및현금성자산'], ['ocf','영업활동현금흐름'],
];
const RATIOS = [
  ['op_margin','영업이익률', x => x.revenue ? x.operating_income / x.revenue * 100 : null],
  ['net_margin','순이익률', x => x.revenue ? x.net_income / x.revenue * 100 : null],
  ['debt_ratio','부채비율', x => x.equity ? x.liabilities / x.equity * 100 : null],
];
let lastData = null, histCache = {}, histChart = null;

async function openHistory(metric) {
  const d = lastData;
  const m = $('#modal');
  m.hidden = false; document.body.style.overflow = 'hidden';
  $('#mTitle').textContent = `${d.company.corp_name} · 최근 5개년 비교`;
  $('#mSub').textContent = `${d.reprt_name} · ${d.fs_name}${d.reprt_code !== '11011' ? ' · 손익/현금흐름은 동기 누적' : ''} · 단위: 억원`;
  $('#mBody').innerHTML = '<div class="empty" style="padding:40px">불러오는 중…</div>';
  const ck = [d.company.corp_code, d.year, d.reprt_code, d.fs_div].join('|');
  try {
    histCache[ck] = histCache[ck] || await (await fetch(`/api/history?corp_code=${d.company.corp_code}&year=${d.year}&reprt=${d.reprt_code}&fs=${d.fs_div}`)).json();
    renderHistory(histCache[ck], metric);
  } catch (e) { $('#mBody').innerHTML = `<div class="err">불러오기 실패: ${esc(e.message)}</div>`; }
}

function renderHistory(h, metric) {
  const years = [...h.years].reverse();  // 오래된 연도 → 최근
  const val = (y, k) => h.data[y]?.[k] ?? null;
  const name = (METRICS.find(x => x[0] === metric) || [, metric])[1];
  const yoy = years.map((y, i) => { const a = val(y, metric), b = i ? val(years[i-1], metric) : null; return a != null && b ? (a - b) / Math.abs(b) * 100 : null; });
  const first = years.findIndex(y => val(y, metric) != null), last = years.length - 1;
  const span = last - first, a0 = val(years[first], metric), a1 = val(years[last], metric);
  const cagr = span > 0 && a0 > 0 && a1 > 0 ? (Math.pow(a1 / a0, 1 / span) - 1) * 100 : null;
  const pctCell = g => g == null ? '<td>-</td>' : `<td class="${g >= 0 ? 'up' : 'down'}">${g >= 0 ? '+' : ''}${g.toFixed(1)}%</td>`;

  const rows = METRICS.filter(([k]) => years.some(y => val(y, k) != null)).map(([k, nm]) =>
    `<tr class="${k === metric ? 'sel' : ''}" data-metric="${k}"><td>${nm}</td>${years.map(y => `<td class="${val(y,k) < 0 ? 'neg' : ''}">${eok(val(y, k))}</td>`).join('')}</tr>` +
    (k === metric ? `<tr class="sub"><td>└ 전년 대비</td>${yoy.map(pctCell).join('')}</tr>` : '')).join('');
  const ratioRows = RATIOS.map(([k, nm, f]) => `<tr><td>${nm}</td>${years.map(y => { const r = f(h.data[y] || {}); return `<td>${r == null || !isFinite(r) ? '-' : r.toFixed(1) + '%'}</td>`; }).join('')}</tr>`).join('');

  $('#mBody').innerHTML = `
    <div class="mstats">
      <div><span>${name} (${years[last]})</span><b>${won(a1)}</b></div>
      <div><span>전년 대비</span><b class="${(yoy[last] ?? 0) >= 0 ? 'up' : 'down'}">${yoy[last] == null ? '-' : (yoy[last] >= 0 ? '+' : '') + yoy[last].toFixed(1) + '%'}</b></div>
      <div><span>${span}년 연평균 성장률(CAGR)</span><b>${cagr == null ? '-' : (cagr >= 0 ? '+' : '') + cagr.toFixed(1) + '%'}</b></div>
    </div>
    <div class="chart" id="histChart" style="height:220px"></div>
    <div class="mt"><div class="unit">(단위: 억원)</div></div><div class="tbl"><table class="emp hist">
      <thead><tr><th>항목</th>${years.map(y => `<th>${y}년</th>`).join('')}</tr></thead>
      <tbody>${rows}<tr class="total"><td colspan="${years.length + 1}">주요 비율</td></tr>${ratioRows}</tbody>
    </table></div>
    <p class="note" style="margin-top:10px">행을 클릭하면 해당 항목의 추이를 볼 수 있습니다. 과거 연도는 이후 공시의 비교 수치(재작성 반영)를 우선 사용합니다.</p>`;

  if (histChart) { charts = charts.filter(c => c !== histChart); histChart.dispose(); }
  bars($('#histChart'), years.map(y => y + '년'), [[name, years.map(y => val(y, metric) == null ? null : Math.round(val(y, metric) / 1e8))]],
    [cssv('--c1')], eokFmt);
  histChart = charts[charts.length - 1];
  document.querySelectorAll('.hist tr[data-metric]').forEach(tr => tr.onclick = () => renderHistory(h, tr.dataset.metric));
}

// ---------- 사업부문 · 지속가능성 (지연 로딩)
const eokFmt = (x, short, max = Math.abs(x)) => short ? (max >= 10000 ? (x/10000).toLocaleString('ko-KR',{maximumFractionDigits:1})+'조' : x.toLocaleString('ko-KR')) : won(x*1e8);

  fetch(`/api/quarters?corp_code=${cc}&stock_code=${sc}&year=${qYear}&fs=${d.fs_div || 'CFS'}`).then(r => r.json()).then(s => { if (lastData?.rcept_no === token) renderQuarters(s, d); })
    .catch(e => { const el = $('#qtrCard'); if (el) el.innerHTML = `<h3>분기 누적 실적 · 컨센서스</h3><div class="err">${esc(e.message)}</div>`; });

function renderSegments(s, d) {
  const el = $('#segCard'); if (!el) return;
  if (s.error || !s.segments?.length) { el.innerHTML = `<h3>사업부문별 실적</h3><div class="note">${esc(s.error || '사업부문 정보가 없습니다.')}</div>`; return; }
  const seg = s.segments, sum = k => seg.reduce((a, x) => a + (x[k] || 0), 0);
  const revT = sum('revenue'), oiT = sum('operating_income'), hasPrev = seg.some(x => x.revenue_prev != null);
  const g = (a, b) => a == null || !b ? '<td>-</td>' : (() => { const v = (a - b) / Math.abs(b) * 100; return `<td class="${v >= 0 ? 'up' : 'down'}">${v >= 0 ? '+' : ''}${v.toFixed(1)}%</td>`; })();
  const margin = (o, r) => o == null || !r ? '-' : (o / r * 100).toFixed(1) + '%';
  const row = (x, cls = '') => `<tr class="${cls}"><td>${x.name.startsWith('<') ? x.name : `<b>${esc(x.name)}</b>`}</td>
    <td>${eok(x.revenue)}</td><td>${x.share ?? share(x.revenue, revT)}</td>${hasPrev ? `<td>${eok(x.revenue_prev)}</td>${g(x.revenue, x.revenue_prev)}` : ''}
    <td class="${x.operating_income < 0 ? 'neg' : ''}">${eok(x.operating_income)}</td><td>${margin(x.operating_income, x.revenue)}</td>
    ${hasPrev ? `<td>${eok(x.operating_income_prev)}</td>${g(x.operating_income, x.operating_income_prev)}` : ''}</tr>`;
  const tot = {name: '부문 합계', revenue: revT, operating_income: oiT, revenue_prev: hasPrev ? sum('revenue_prev') : null, operating_income_prev: hasPrev ? sum('operating_income_prev') : null, share: '100%'};
  // 연결 손익과의 차이 = 내부거래 제거·연결조정
  const k = d.key, cRev = k.revenue?.[0], cOi = k.operating_income?.[0];
  const adj = cRev != null && s.period === d.year ? `<tr class="sub-adj"><td>내부거래·연결조정 <span class="note">(공시 손익계산서 − 부문 합계)</span></td><td>${eok(cRev - revT)}</td><td></td>${hasPrev ? '<td></td><td></td>' : ''}<td>${cOi != null ? eok(cOi - oiT) : '-'}</td><td></td>${hasPrev ? '<td></td><td></td>' : ''}</tr>` : '';
  el.innerHTML = `<h3>사업부문별 실적 <span class="note">${s.period}년 · ${s.fs_name} 기준</span></h3>
    <div class="unit">(단위: 억원)</div><div class="tbl"><table class="emp">
      <thead><tr><th>사업부문</th><th>매출</th><th>매출 비중</th>${hasPrev ? `<th>${s.period_prev} 매출</th><th>증감</th>` : ''}<th>영업이익</th><th>영업이익률</th>${hasPrev ? `<th>${s.period_prev} 영업이익</th><th>증감</th>` : ''}</tr></thead>
      <tbody>${seg.map(x => row(x)).join('')}${row(tot, 'total')}${adj}</tbody></table></div>
    <div class="grid two mt">
      <div><div class="note" style="margin-bottom:6px">부문별 매출</div><div class="chart" id="segRev" style="height:240px"></div></div>
      <div><div class="note" style="margin-bottom:6px">부문별 영업이익</div><div class="chart" id="segOi" style="height:240px"></div></div>
    </div>
    <p class="note" style="margin-top:10px">※ 부문 매출에는 부문 간 내부거래가 포함될 수 있어 합계가 연결 매출과 다를 수 있습니다.</p>`;
  const cats = seg.map(x => x.name), toE = v => v == null ? null : Math.round(v / 1e8);
  bars($('#segRev'), cats, hasPrev ? [[s.period_prev + '년', seg.map(x => toE(x.revenue_prev))], [s.period + '년', seg.map(x => toE(x.revenue))]] : [[s.period + '년', seg.map(x => toE(x.revenue))]],
    hasPrev ? [cssv('--prior'), cssv('--c1')] : [cssv('--c1')], eokFmt);
  bars($('#segOi'), cats, hasPrev ? [[s.period_prev + '년', seg.map(x => toE(x.operating_income_prev))], [s.period + '년', seg.map(x => toE(x.operating_income))]] : [[s.period + '년', seg.map(x => toE(x.operating_income))]],
    hasPrev ? [cssv('--prior'), cssv('--c2')] : [cssv('--c2')], eokFmt);
}

function ordAgg() {
  const o = ordData, m = {};
  const ps = o.projects.filter(p => (!ordState.active || p.active) && (ordState.scope === 'all' || p[ordState.mode] !== '한국'));
  ps.forEach(p => { const k = p[ordState.mode]; const e = m[k] ||= {name: k, count: 0, amount: 0, remain: 0, ...o.countries[k]}; e.count++; e.amount += p.amount; e.remain += p.remain || 0; });
  return {list: Object.values(m).sort((a, b) => b[ordState.metric] - a[ordState.metric]), ps};
}

  56:['🌧️','어는 비'],57:['🌧️','어는 비'],61:['🌧️','비'],63:['🌧️','비'],65:['🌧️','강한 비'],66:['🌧️','어는 비'],67:['🌧️','어는 비'],71:['🌨️','눈'],73:['🌨️','눈'],75:['❄️','강한 눈'],77:['🌨️','싸락눈'],
  80:['🌦️','소나기'],81:['🌦️','소나기'],82:['⛈️','강한 소나기'],85:['🌨️','눈보라'],86:['🌨️','눈보라'],95:['⛈️','뇌우'],96:['⛈️','뇌우'],99:['⛈️','뇌우']};
let wxData = {}, clockTimer = null;
const localTime = tz => { try { return new Intl.DateTimeFormat('ko-KR', {timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false}).format(new Date()); } catch { return '-'; } };
const localDay = tz => { try { const f = o => new Intl.DateTimeFormat('en-CA', {timeZone: o}).format(new Date()); const a = f(tz), b = f('Asia/Seoul'); return a > b ? ' (+1일)' : a < b ? ' (−1일)' : ''; } catch { return ''; } };
const wxIcon = w => w && w.code != null ? (WX[w.code] || ['🌡️', ''])[0] : '';
const wxText = w => w && w.temp != null ? `${wxIcon(w)} ${Math.round(w.temp)}°` : '';
async function loadWx(names) {
  const need = names.filter(n => !wxData[n]);

}
function tickClocks() {

  if (mapChart && !mapChart.isDisposed()) mapChart.setOption({series: [{}, {label: {formatter: mapLabel}}, {}]});
  document.querySelectorAll('.gpin [data-tz]').forEach(e => e.textContent = localTime(e.dataset.tz));
}
const mapLabel = p => { const w = wxData[p.name]; return w?.tz ? `${p.name}  ${localTime(w.tz)}\n${wxText(w)}` : p.name; };


// ---------- 3D 지구본 (globe.gl · three.js) — Google Earth 스타일
let globe = null, globeEl = null, globeP = null;
const GLOBE_LIB = 'vendor/globe.gl.min.js';
const TEX = 'vendor/img/';
const loadGlobeLib = () => globeP ||= new Promise((ok, no) => {
  if (window.Globe) return ok();
  const sc = document.createElement('script'); sc.src = GLOBE_LIB; sc.onload = ok; sc.onerror = () => { globeP = null; no(new Error('3D 지구본 라이브러리를 불러오지 못했습니다.')); };
  document.head.appendChild(sc);
});
function flyTo(v, ms = 1600) { if (globe) { globe.controls().autoRotate = false; globe.pointOfView({lat: v.center[1], lng: v.center[0], altitude: v.alt ?? 1.5}, ms); } }

async function drawGlobe(list, ps, key, mx, pickC) {
  const box = $('#ordMap'); if (!box) return;
  box.className = 'map globe';
  try { await loadGlobeLib(); } catch (e) { box.className = 'map'; box.innerHTML = `<div class="empty">${esc(e.message)} 2D 지도를 이용하세요.</div>`; return; }
  if (!$('#ordMap')) return;
  const C = ordData.countries, sel = ordState.country, c1 = '#3987e5', c2 = '#eb6834';
  const pts = list.filter(c => c.lon != null && c[key] > 0);
  const flows = {};
  ps.filter(p => p.order !== p.exec && C[p.order] && C[p.exec]).forEach(p => { const k = p.order + '>' + p.exec; (flows[k] ||= {from: p.order, to: p.exec, v: 0, n: 0}).v += p[key] || 0; flows[k].n++; });
  const top = new Set([...pts].sort((a, b) => b[key] - a[key]).slice(0, 7).map(c => c.name));
  if (sel) top.add(sel);

  // 같은 컨테이너면 인스턴스 재사용(시점 유지), 아니면 새로 생성
  if (!globe || globeEl !== box) {
    if (globe) globe._destructor?.();
    box.innerHTML = '';
    globeEl = box;
    globe = Globe()(box)

      .bumpImageUrl(TEX + 'earth-topology.png')
      .backgroundImageUrl(TEX + 'night-sky.png')
      .showAtmosphere(true).atmosphereColor('#7cc0ff').atmosphereAltitude(0.2)
      .width(box.clientWidth).height(box.clientHeight)
      .pointOfView({lat: 25, lng: 70, altitude: 2.3});
    const ctl = globe.controls(); ctl.autoRotate = true; ctl.autoRotateSpeed = 0.35; ctl.enableDamping = true;
    ctl.addEventListener('start', () => { ctl.autoRotate = false; const b = $('#ordView .on'); if (b) b.classList.remove('on'); });
    box.insertAdjacentHTML('beforeend', `<div class="gtools"><button data-z="in" title="확대">＋</button><button data-z="out" title="축소">－</button><button data-z="home" title="전 세계">⌂</button><button data-z="spin" title="자동 회전">⟳</button></div><div class="ghud" id="gHud"></div>`);
    box.querySelectorAll('.gtools button').forEach(b => b.onclick = () => {
      const pv = globe.pointOfView();
      if (b.dataset.z === 'in') globe.pointOfView({...pv, altitude: Math.max(0.25, pv.altitude * 0.65)}, 500);
      if (b.dataset.z === 'out') globe.pointOfView({...pv, altitude: Math.min(4, pv.altitude * 1.5)}, 500);
      if (b.dataset.z === 'home') flyTo(MAP_VIEWS.world);
      if (b.dataset.z === 'spin') globe.controls().autoRotate = !globe.controls().autoRotate;
    });
    const ro = new ResizeObserver(() => { if (globe && globeEl === box) globe.width(box.clientWidth).height(box.clientHeight); });
    ro.observe(box);
  }
  const hud = $('#gHud');
  if (hud) hud.textContent = `${ordState.mode === 'exec' ? '수행 국가' : '수주 국가'} · ${key === 'amount' ? '계약액' : '잔액'} · 최대 ${won(mx)}`;

  const tip = c => { const w = wxData[c.name] || {};
    return `<div style="background:rgba(18,18,18,.9);color:#f0efec;padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.6;border:1px solid rgba(255,255,255,.15)">
      <div style="color:#c3c2b7">${esc(c.name)}${w.city ? ' · ' + esc(w.city) : ''}</div>
      <div><span style="display:inline-block;width:12px;height:2px;background:${c1};vertical-align:3px;margin-right:6px"></span><b>${won(c[key])}</b> <span style="color:#c3c2b7">${c.count}건 · ${key === 'amount' ? '계약액' : '잔액'}</span></div>
      <div style="color:#c3c2b7">현지 ${w.tz ? localTime(w.tz) + localDay(w.tz) : '-'} · ${w.code != null ? `${wxIcon(w)} ${(WX[w.code] || [, ''])[1]} ${Math.round(w.temp)}°C` : '날씨 정보 없음'}</div></div>`; };

  globe
    // 3D 막대: 높이 ∝ 금액 (같은 기준선에서 올라가므로 길이 비교 가능)
    .pointsData(pts).pointLat(c => c.lat).pointLng(c => c.lon)
    .pointAltitude(c => 0.01 + 0.45 * c[key] / mx).pointRadius(c => c.name === sel ? 1.0 : 0.75)
    .pointColor(c => !sel || c.name === sel ? (c.name === sel ? c2 : c1) : 'rgba(57,135,229,.35)')
    .pointResolution(16).pointsMerge(false).pointsTransitionDuration(600)
    .pointLabel(tip)
    .onPointClick(c => { pickC(c.name); globe.pointOfView({lat: c.lat, lng: c.lon, altitude: 0.9}, 1400); })
    // 발주국 → 수행국 흐름: 움직이는 호
    .arcsData(Object.values(flows)).arcStartLat(f => C[f.from].lat).arcStartLng(f => C[f.from].lon).arcEndLat(f => C[f.to].lat).arcEndLng(f => C[f.to].lon)
    .arcColor(f => sel && f.to !== sel && f.from !== sel ? ['rgba(235,104,52,.15)', 'rgba(235,104,52,.15)'] : ['rgba(235,104,52,.25)', c2])
    .arcStroke(0.5).arcDashLength(0.45).arcDashGap(0.25).arcDashAnimateTime(2600).arcAltitudeAutoScale(0.45)

      d.onclick = () => { pickC(c.name); globe.pointOfView({lat: c.lat, lng: c.lon, altitude: 0.9}, 1400); };

  if (sel && C[sel]) globe.controls().autoRotate = false;
}

// 원 지름: 넓이가 금액에 비례 (지름 ∝ √금액), 최소 8px
const bubbleD = (v, max) => Math.max(8, 52 * Math.sqrt(Math.max(0, v) / max));
const niceRound = v => { const p = Math.pow(10, Math.floor(Math.log10(v))); return Math.round(v / p) * p; };

function drawRegions(list, key) {
  const tot = list.reduce((a, c) => a + c[key], 0) || 1, agg = {};
  list.forEach(c => { const r = regionOf(c.name); agg[r] = (agg[r] || 0) + c[key]; });
  // 고정 순서(지역 → 범주 슬롯): 색은 순위가 아니라 지역을 따른다
  const order = ['국내', '중동', '아시아', '미주', '유럽', '오세아니아', '아프리카', '기타'];
  const slot = {'국내': '--prior', '중동': '--c1', '아시아': '--c2', '미주': '--c3', '유럽': '--c4', '오세아니아': '--c5', '아프리카': '--c6', '기타': '--muted'};
  const parts = order.filter(r => agg[r] > 0).map(r => ({r, v: agg[r], sh: agg[r] / tot * 100}));
  $('#ordRegion').setAttribute('aria-label', parts.map(x => `${x.r} ${x.sh.toFixed(0)}%`).join(', '));
  $('#ordRegion').innerHTML = parts.map(x => `<span class="${x.r === '유럽' ? 'dk' : ''}" title="${x.r} ${won(x.v)} (${x.sh.toFixed(1)}%)" style="flex:${x.v} 1 0;background:var(${slot[x.r]})${x.r === '국내' ? ';color:var(--text)' : ''}">${x.sh >= 9 ? x.sh.toFixed(0) + '%' : ''}</span>`).join('');
  $('#ordRegionKeys').innerHTML = parts.map(x => `<span><i style="background:var(${slot[x.r]})"></i>${x.r} <b style="color:var(--text)">${x.sh.toFixed(1)}%</b></span>`).join('');
}

function drawSizeKey(max) {
  const vals = [max, max / 4, max / 16].map(niceRound).filter((v, i, A) => v > 0 && A.indexOf(v) === i);
  $('#ordSizeKey').innerHTML = vals.map(v => { const d = bubbleD(v, max); return `<div><svg width="${d + 4}" height="${d + 4}"><circle cx="${d / 2 + 2}" cy="${d / 2 + 2}" r="${d / 2}"/></svg>${won(v)}</div>`; }).join('');
}

async function drawOrdMap() {

    dropChart(mapChart); mapChart = null;
    return drawGlobe(list, ps, key, mx, pickC);
  }
  $('#ordMapNote').textContent = '원 넓이 = 금액 · 라벨 = 현지 시각과 대표 도시의 현재 날씨(Open-Meteo, 30분 갱신) · 라벨은 상위 국가와 선택 국가만 표시, 나머지는 마우스를 올리거나 오른쪽 표에서 확인 · 원/행을 누르면 아래 프로젝트가 필터됩니다 · 휠로 확대';

  if (!$('#ordMap')) return;

       data: Object.values(flows).filter(f => C[f.from] && C[f.to]).map(f => ({...f, coords: [[C[f.from].lon, C[f.from].lat], [C[f.to].lon, C[f.to].lat]]})),
       symbol: ['none', 'arrow'], symbolSize: 7, lineStyle: {color: c2, width: 2, opacity: sel ? .25 : .75, curveness: .25}},

    ],
  });

}

function drawProjects(ps) {
  const f = ordState.country;
  const rows = ps.filter(p => !f || p[ordState.mode] === f).sort((a, b) => (b.remain || 0) - (a.remain || 0) || b.amount - a.amount);
  $('#ordFilter').innerHTML = `<b style="color:var(--text)">프로젝트 목록</b> ${rows.length}건 ${f ? `<span class="chip">${esc(f)} <button aria-label="필터 해제">✕</button></span>` : ''}`;
  $('#ordFilter').querySelector('.chip button')?.addEventListener('click', () => { ordState.country = null; drawOrdMap(); });
  const prog = p => p.amount && p.done != null ? Math.min(100, p.done / p.amount * 100) : null;
  $('#ordProj').innerHTML = `<thead><tr><th>공사명</th><th>발주처</th><th>수주국</th><th>수행국</th><th>계약일</th><th>완공예정</th><th>계약액</th><th>잔액</th><th>진행률</th><th>상태</th></tr></thead><tbody>` +
    rows.slice(0, 200).map(p => { const g = prog(p); return `<tr><td><b>${esc(p.name)}</b>${p.cat ? ` <span class="note">${esc(p.cat)}</span>` : ''}</td><td style="text-align:left;white-space:normal;min-width:160px">${esc(p.client)}</td>
      <td>${esc(p.order)}</td><td>${esc(p.exec)}</td><td>${esc(p.date || '-')}</td><td>${esc(p.end || '-')}</td><td>${eok(p.amount)}</td><td>${p.active ? eok(p.remain) : '-'}</td>
      <td>${g == null ? '-' : `<div class="stack" title="${g.toFixed(0)}%" style="min-width:70px"><i style="width:${g}%"></i></div>`}</td>
      <td><span class="pill ${p.active ? 'on' : ''}">${p.active ? '진행 중' : `~${p.last_seen} 공시`}</span></td></tr>`; }).join('') + '</tbody>';
}


// ---------- 회사 IR 실적발표: 분기·반기 사업부문별
let irState = {period: 'q', metric: 'revenue', n: 8}, irData = null;
function renderIR(r, d) {
  const el = $('#irCard'); if (!el) return;
  if (!r.supported) { el.hidden = true; return; }
  el.hidden = false;
  if (!r.quarters?.length) { el.innerHTML = `<h3>분기·반기 사업부문별 실적</h3><div class="note">회사 IR 실적발표 자료를 읽지 못했습니다. ${esc((r.errors || []).join(' / '))}</div>`; return; }
  irData = r;
  el.innerHTML = `<div class="cardhead"><h3>분기·반기 사업부문별 실적 <span class="note">회사 IR 실적발표 기준 · 연결</span></h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <div class="seg" id="irPeriod"><button data-v="q">분기</button><button data-v="h">반기</button></div>
        <div class="seg" id="irMetric"><button data-v="revenue">매출</button><button data-v="operating_income">영업이익</button></div>
      </div></div>
    <div id="irBody"></div>
    <p class="note" style="margin-top:10px">※ 출처: <a href="${esc(r.page)}" target="_blank" rel="noopener">${esc(r.source)}</a> 보고서 ${r.reports.length}건(PDF)에서 '경영실적' 표를 자동 추출했습니다.
      같은 분기가 여러 보고서에 나오면 가장 최근 보고서의 값(재작성 반영)을 씁니다. 각 분기 부문 합계가 회사 발표 합계와 맞는지 검산했고, 반기는 분기 값을 더한 것입니다.
      DART에 공시되기 전 분기는 회사 발표 잠정치입니다.</p>`;
  const bind = (id, key) => el.querySelectorAll(`#${id} button`).forEach(b => {
    b.classList.toggle('on', b.dataset.v === irState[key]);
    b.onclick = () => { irState[key] = b.dataset.v; el.querySelectorAll(`#${id} button`).forEach(x => x.classList.toggle('on', x === b)); drawIR(); };
  });
  bind('irPeriod', 'period'); bind('irMetric', 'metric');
  drawIR();
}

function irPeriods() {
  const Q = irData.quarters, segOrder = [];
  Q.forEach(x => Object.keys(x.segments).forEach(k => segOrder.includes(k) || segOrder.push(k)));
  const val = (x, seg) => (irState.metric === 'revenue' ? x.segments : x.oi_segments)[seg];
  let P;
  if (irState.period === 'q') {
    P = Q.slice(-irState.n).map(x => ({label: `${String(x.year).slice(2)}.${x.q}Q`, src: [x], full: true}));
  } else {
    const H = {};
    Q.forEach(x => { const k = `${x.year}H${x.q <= 2 ? 1 : 2}`; (H[k] ||= {label: `${String(x.year).slice(2)}.${x.q <= 2 ? '상' : '하'}반기`, src: []}).src.push(x); });
    P = Object.values(H).map(h => ({...h, full: h.src.length === 2})).slice(-6);
  }
  P.forEach(p => {
    p.seg = Object.fromEntries(segOrder.map(s => [s, p.src.every(x => val(x, s) != null) ? p.src.reduce((a, x) => a + val(x, s), 0) : null]));
    p.total = p.src.reduce((a, x) => a + (x[irState.metric] || 0), 0);
    p.rev = p.src.reduce((a, x) => a + (x.revenue || 0), 0);
  });
  return {P, segOrder};
}

function drawIR() {
  const {P, segOrder} = irPeriods(), isRev = irState.metric === 'revenue';
  const last = P[P.length - 1];
  // 전년 동기 = 마지막 기간에 포함된 분기와 같은 분기의 전년 값 합 (진행 중인 반기도 같은 분기끼리 비교)
  const qmap = Object.fromEntries(irData.quarters.map(x => [x.year + 'Q' + x.q, x]));
  const prevSrc = last.src.map(x => qmap[(x.year - 1) + 'Q' + x.q]);
  const pv = (fn) => prevSrc.every(Boolean) ? prevSrc.reduce((a, x) => a + (fn(x) ?? NaN), 0) : null;
  const prevYear = {seg: Object.fromEntries(segOrder.map(s => [s, pv(x => (irState.metric === 'revenue' ? x.segments : x.oi_segments)[s])])), total: pv(x => x[irState.metric])};
  const g = (a, b) => a == null || !b ? '<td>-</td>' : (() => { const v = (a - b) / Math.abs(b) * 100; return `<td class="${v >= 0 ? 'up' : 'down'}">${v >= 0 ? '+' : ''}${v.toFixed(1)}%</td>`; })();
  const rows = segOrder.map(s => `<tr><td><b>${esc(s)}</b></td>${P.map(p => `<td class="${p.seg[s] < 0 ? 'neg' : ''}">${eok(p.seg[s])}</td>`).join('')}
      <td>${isRev ? share(last.seg[s], last.total) : (last.seg[s] != null && irData.quarters.length ? (() => { const rv = last.src.reduce((a, x) => a + (x.segments[s] || 0), 0); return rv ? (last.seg[s] / rv * 100).toFixed(1) + '%' : '-'; })() : '-')}</td>
      ${g(last.seg[s], prevYear?.seg[s])}</tr>`).join('');
  const tot = `<tr class="total"><td>합계</td>${P.map(p => `<td>${eok(p.total)}</td>`).join('')}<td>${isRev ? '100%' : last.rev ? (last.total / last.rev * 100).toFixed(1) + '%' : '-'}</td>${g(last.total, prevYear?.total)}</tr>`;
  $('#irBody').innerHTML = `<div class="unit">(단위: 억원)</div><div class="tbl"><table class="emp">
      <thead><tr><th>사업부문</th>${P.map(p => `<th>${p.label}${p.full ? '' : '<br><span class="note">진행 중</span>'}</th>`).join('')}
        <th>${isRev ? '비중' : '영업이익률'}<br><span class="note">${last.label}</span></th><th>전년 동기<br><span class="note">대비${last.full ? '' : ' (같은 분기)'}</span></th></tr></thead>
      <tbody>${rows}${tot}</tbody></table></div>
    <div class="chart mt" id="irChart" style="height:280px"></div>`;
  const pal = ['--c1', '--c2', '--c3', '--c4', '--c5', '--c6'].map(cssv);
  // 매출: 부문 누적 막대(구성) · 영업이익: 음수가 있어 묶은 막대
  bars($('#irChart'), P.map(p => p.label), segOrder.slice(0, 6).map(s => [s, P.map(p => p.seg[s] == null ? null : Math.round(p.seg[s] / 1e8))]), pal, eokFmt, {stack: isRev});
}

function closeModal(){ $('#modal').hidden = true; document.body.style.overflow = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.closest('.mclose')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
</script>
