// iframe 을 띄우기 전에 /version 확인 (3초, JSON 이 와야 성공). P&ID 는 대시보드 데이터를 쓰지 않으므로 대시보드 오프라인 여부와 무관
async function pidConnect(key) {
  const wrap = $('#pidwrap'); if (!wrap || wrap.dataset.route !== key) return;
  const body = $('.pidbody', wrap), base = pidBase(key), url = pidUrl(key), R = PID_ROUTES[key], T = esc(R.title);
  body.innerHTML = `<div class="pidmsg muted">${T} 서버 연결 확인 중…</div>`;
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 6000);   // 분석 중이면 응답이 늦을 수 있어 넉넉히
  let ok = false, ver = null;
  try { const r = await fetch(base + '/version', { signal:ctl.signal, cache:'no-store' }); if (r.ok) { ver = await r.json(); ok = true; } }
  catch (_) {} finally { clearTimeout(timer); }
  if ($('#pidwrap') !== wrap) return;                    // 확인하는 동안 다른 메뉴로 이동함
  const note = $('.pidnote', wrap);                        // 재무스타그램: DART 키가 없으면 머리줄에 안내 (운영자가 ⚙ 에서 .env 경로 지정)
  if (note) note.innerHTML = key === 'finstagram' && ok && ver && ver.key === false ? ` · <b class="finwarn">⚠ DART API 키가 없습니다 — ${ADMIN ? '오른쪽 ⚙ 에서 .env 경로를 지정하세요' : '운영자(서버 PC)에게 키 설정을 요청하세요'}</b>` : '';
  body.innerHTML = ok
    ? `<iframe class="pidframe" src="${esc(url)}" title="${T}"></iframe>`
    : `<div class="pidmsg"><p>${esc(R.off || PID_OFF)}</p>
         <p class="muted">${esc(base)}</p><button class="btn pri" data-pidretry>다시 시도</button></div>`;
  if (!ok) setTimeout(() => { if ($('#pidwrap') === wrap && $('[data-pidretry]', wrap)) pidConnect(key); }, 5000);   // 그 화면에 있는 동안 5초마다 다시 확인
}

// 부서원 명단: 가장 최근 연도 유닛분장의 구성원 (그룹장 제외)
function deptNames() {                                     // IEC(India Engineering Center) 유닛·영문 이름은 빼고
  const recs = DB.recs?.unit || [], y = recs.map(r => String(r.fields['연도'] || '')).sort().pop();
  const rs = recs.filter(r => String(r.fields['연도'] || '') === y && !isIecUnit(r)), heads = new Set(rs.flatMap(r => parseMembers(r.fields['그룹장']).map(m => m.name)));
  return [...new Set(rs.flatMap(r => parseMembers(r.fields['구성원']).map(m => m.name)))].filter(n => n && !heads.has(n) && !isEng(n));
}
/* IEC 인력 (India Engineering Center, 영문 이름): 가장 최근 연도 유닛분장의 IEC 유닛('I&C ENG Group' · 'IEC' 가 들어간 유닛) 구성원.
 * 유닛분장 표에 아직 등록하지 않았으면 기본 명단(IEC_DEFAULT). 수행 PJT 그래프는 영문 이름을 세지 않고, 입찰 PJT 그래프는 IEC 인원도 셈 */
const isEng = t => /[a-z]/i.test(t) && !/[가-힣]/.test(t);
const IEC_RE = /\bIEC\b|I\s*&\s*C\s*ENG/i;
const isIecUnit = r => IEC_RE.test(r.fields['유닛'] || '') || IEC_RE.test(r.fields['담당'] || '');
const IEC_DEFAULT = { unit:'I&C ENG Group', duty:'IEC 인력 구성 · India Engineering Center',
  mem:'Ranjit Malakar(Part Leader)\nAbhishek Sinha(Pro)\nNikhil Aggarwal(Pro)\nGurbaksh Singh(Pro)\nSakshi Tiwari(Pro)\nPrakash Chand Jaiswal(Pro)\nAbhishek Rai(Pro)\nDinesh Kumar(Pro)\nVikas Khare(Pro)\nSurabhi Gupta(Pro - expected)\nSonal Gupta(Pro - GET*)\nSamridhi(Pro - GET*)' };
/* 담당자 칸 → 사람별 묶음 (모든 그래프 공통): 부서원 명단 + 칸에만 있는 이름. 칸에 그 이름이 '들어 있으면' 그 사람 것
 * ('홍길동 프로' · 'PM 김철수' · '홍길동 이영희' · '박민수(LE), 홍길동' 모두). eng = 'skip' 영문 이름(IEC) 뺌 · 'keep' 칸에 있는 영문 이름은 셈 · 'iec' IEC 명단까지 */
function personGroups(recs, getV, eng = 'skip') {
  const iec = eng === 'iec' ? iecNames() : [], dn = [...deptNames(), ...iec], toks = new Set();
  recs.forEach(r => tokens(getV(r)).forEach(t => toks.add(t)));
  const extra = [...toks].filter(t => !dn.some(n => t.includes(nk(n)) || nk(t).includes(nk(n)))).filter(t => eng !== 'skip' || !isEng(t)).map(t => isEng(t) ? t.replace(/\b[a-z]/g, ch => ch.toUpperCase()) : t);
  return [...new Set([...dn, ...extra])].map(n => [n, recs.filter(r => hasName(getV(r), n))]);

function iecNames() {
  const recs = DB.recs?.unit || [], y = recs.map(r => String(r.fields['연도'] || '')).sort().pop();

        let x = L; const segs = i.parts.filter(p => p.v > 0).map(p => { const pw = (W - L - 70) * p.v / max, g = `<g${tipA(p)}><rect class="bar" x="${x}" y="${y + 2}" width="${Math.max(pw, 2)}" height="15" fill="${p.color}"/></g>`; x += pw; return g; }).join('');

        return `<g${tipA(i)}><rect x="0" y="${y}" width="${W}" height="${rh}" fill="transparent"/><text x="${L - 8}" y="${y + 14}" text-anchor="end" font-size="12" fill="#1b2238">${esc(trunc(i.l, 12))}</text>${segs}<text x="${L + w + 6}" y="${y + 14}" font-size="12" fill="#667089">${fmt(i.v)} <tspan font-size="10.5">(${lab})</tspan></text></g>`;
      }
      return `<g${tipA(i)}><rect x="0" y="${y}" width="${W}" height="${rh}" fill="transparent"/><text x="${L - 8}" y="${y + 14}" text-anchor="end" font-size="12" fill="#1b2238">${esc(trunc(i.l, 12))}</text><rect class="bar" x="${L}" y="${y + 2}" width="${Math.max(w, 2)}" height="15" rx="3" fill="${color}"/><text x="${L + w + 6}" y="${y + 14}" font-size="12" fill="#667089">${fmt(i.v)}</text></g>`;
    }).join('')}</svg>`;
  }
  const W = 520, H = 230, T = 22, B = 70, bw = (W - 20) / items.length, ch = H - T - B;

    const h = ch * i.v / max, x = 10 + k * bw + bw * .18, w = bw * .64;

  return `<section class="card lvcard"><h2>🌴 근태 상세 — ${esc(plabel)} <span class="muted">· 시수 파일 Type '근태' 줄의 날짜별 시간 · 총 ${fmtH(tot)}h · ${rows.length}명 · 월을 바꾸면 그 달만</span><button class="btn sm" data-aleave style="margin-left:auto">닫기</button></h2>

const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    ch.setUint16(12, dt, true); ch.setUint16(14, dd, true); ch.setUint32(16, crc, true); ch.setUint32(20, sz, true); ch.setUint32(24, sz, true);

const xesc = s => String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

      const cols = ['수행', '입찰', '기타'].flatMap(k => getCols().filter(c => c.kind === k && used.has(c.id)));
      rows = [[...['그룹', '분야', '이름', '수행', '입찰', 'Total', ...cols.map(c => c.name), '과제+기타업무(%)', 'Remarks'].map(v => ({ v, s:ST.HEAD }))]];
      widths = [10, 14, 14, 6, 6, 7, ...cols.map(() => 9), 12, 30];

          : { v:f[k] ?? '', s:h.has(k) ? ST.CHGB : ST.BODY };
        rows.push([txt('그룹'), txt('분야'), txt('이름'), { v:st.run, s:ST.CTR }, { v:st.bid, s:ST.CTR }, { v:st.run + st.bid, s:ST.CTR },
          ...cols.map((c, i) => { const a = A[c.id]; if (a) sums[i] += num(a.pct); const hc = h.has('배정.' + c.id + '.pct') || h.has('배정.' + c.id + '.role'); return { v:a ? num(a.pct) : '', s:hc ? (a?.role === 'LE' ? ST.CHGLE : ST.CHGBC) : (a?.role === 'LE' ? ST.LE : ST.CTR) }; }),
          { v:f['과제+기타업무(%)'] === '' || f['과제+기타업무(%)'] == null ? '' : num(f['과제+기타업무(%)']), s:h.has('과제+기타업무(%)') ? ST.CHGBC : ST.CTR }, txt('Remarks')]);

    } else {

      rows = [fields.map(f => ({ v:def(f).label || f, s:ST.HEAD }))];
      widths = fields.map(f => Math.max(8, Math.round(def(f).w / 6.5)));

async function setServerUrl() {
  const c = await ask('서버 주소 설정', `<p class="muted">이 PC의 dashboard.html 사본이 접속할 서버 주소입니다. 이 브라우저에 저장됩니다.<br>기본값: ${DEFAULT_SERVERS.map(esc).join(' → ')} 순서로 자동 시도</p>
    <input id="srvIn" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px" value="${esc(serverUrl())}" placeholder="http://PC이름:8080">`,
    [{ id:'ok', label:'저장 후 다시 연결', cls:'pri' }, { id:'reset', label:'기본값으로' }, { id:'no', label:'취소' }]);
  if (c === 'reset') { try { localStorage.removeItem(LS_SRV); } catch (_) {} UNLOAD_OK = true; return location.reload(); }
  const v = c === 'ok' ? (document.querySelector('#srvIn')?.value || '').trim() : '';
  if (!v) return;
  if (!/^https?:\/\/[^\s/]+/.test(v)) return toast('http://IP:포트 형식으로 입력하세요', true);
  try { localStorage.setItem(LS_SRV, v.replace(/\/+$/, '')); } catch (_) {}
  UNLOAD_OK = true; location.reload();
}

function openChangePw() {
  if (!AUTH || !SERVER || OFFLINE) return toast('서버에 로그인되어 있을 때만 바꿀 수 있습니다', true);
  const f = (id, l, ac) => `<label style="display:block;margin:8px 0">${l}<input type="password" id="${id}" maxlength="64" autocomplete="${ac}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;margin-top:4px"></label>`;
  openDlg(dlg, `<form id="pwf"><div class="dh"><span>🔑 비밀번호 변경 · ${esc(AUTH.name)} (${esc(AUTH.id)})</span><button type="button" class="btn sm" data-close>닫기</button></div>
    <div class="db">${f('pw0', '지금 비밀번호', 'current-password')}${f('pw1', '새 비밀번호 (8자 이상)', 'new-password')}${f('pw2', '새 비밀번호 확인', 'new-password')}
      <p class="muted" style="margin:6px 0 0">바꾸면 다른 PC·브라우저에 로그인된 것은 로그아웃됩니다. 이 화면은 그대로 쓸 수 있습니다.</p><p id="pwErr" class="tswarn" hidden></p></div>
    <div class="df"><button type="button" class="btn" data-close>취소</button><button class="btn pri" type="submit">변경</button></div></form>`);
  dlg.onclick = e => { if (e.target.closest('[data-close]')) dlg.close(); };
  const err = m => { const p = $('#pwErr'); p.textContent = m; p.hidden = !m; };
  $('#pw0').focus();
  $('#pwf').onsubmit = async e => {
    e.preventDefault();
    const a = $('#pw0').value, b = $('#pw1').value, c = $('#pw2').value;
    if (!a) return err('지금 비밀번호를 입력하세요');
    if (b.length < 8) return err('새 비밀번호는 8자 이상');
    if (b !== c) return err('새 비밀번호 확인이 일치하지 않습니다');
    if (a === b) return err('지금 비밀번호와 다른 비밀번호를 입력하세요');
    try { const r = await api('POST', 'auth/password', { password:a, newPassword:b }); authSave(r.token, r.user); dlg.close(); toast('🔑 비밀번호를 바꿨습니다'); }
    catch (er) { err(er.message); }
  };
}

      [{ id:'ok', label:'로그아웃', cls:'pri' }, { id:'no', label:'취소' }]) !== 'ok') return;
    if (!OFFLINE) { try { await api('POST', 'auth/logout', {}); } catch (_) {} }

}

(async function init() {
  const k = location.hash.slice(1); route = validRoute(k) ? k : 'home';
  bdayBoot();                                              // 생일 팝업: 화면을 열자마자 (이 PC 에 보관한 명단)

    if (!info || info.mode !== 'server') {                 // VS Code Live Preview 등 /api 가 없는 서버로 열린 경우

        <p class="muted">서버 PC에서 <b>start_server.bat</b> 을 실행한 뒤 위 주소로 접속하세요. 다른 PC는 http://서버PC_IP:8080 으로 접속합니다.</p>
        <button class="btn" id="btnLocalMode" style="margin-top:8px">서버 없이 폴더 모드로 계속</button></div>`;
      $('#btnLocalMode').onclick = () => initFolderMode();
      return;
    }
    ADMIN = !!info.admin; SERVER_INFO = info; setPerms(info.perms, info.super);
    root = { name:serverLabel() };
    await startOnline();
    return;
  }
  // 파일(file://)로 연 사본: 서버 연결을 먼저 시도 → 실패하면 보관본으로 오프라인 모드
  if (location.protocol === 'file:') {
    try {                                                    // 교체 뒤 다시 열렸는데 버전이 그대로면: 다른 파일에 쓴 것 → 기억한 파일을 버리고 알림 (다음 교체 때 다시 고름)
      const u = JSON.parse(sessionStorage.getItem('dept-upd') || 'null'); sessionStorage.removeItem('dept-upd');
      if (u && Date.now() - u.at < 120000) {
        if (u.to && u.to !== APP_VERSION) { await kv('readwrite', st => st.delete('self')).catch(() => {}); setTimeout(() => toast(`교체가 지금 쓰는 파일(${selfPath()})에 들어가지 않았습니다 — 위 배너의 [지금 교체]를 다시 눌러 이 폴더의 파일을 고르세요`, true), 1500); }
        else setTimeout(() => toast(`새 버전(${APP_VERSION})으로 바꿨습니다`), 1500);
      }
    } catch (_) {}
    SERVER = true;
    let info = null;
    // 설정한 주소가 있으면 그 주소만, 없으면 PC 이름 주소 → IP 주소 순으로 시도
    API_BASE = normUrl(DEFAULT_SERVERS[0] || '');
    info = await findServer();                               // 설정한 주소 → 기본 주소(PC 이름 · IP) → 예전에 연결됐던 주소 모두 동시에
    if (info && info.mode === 'server') { ADMIN = !!info.admin; SERVER_INFO = info; setPerms(info.perms, info.super); checkVersion(info); root = { name:serverLabel() }; await startOnline(); return; }
    let c = await cacheLoad(); const sn = snapLoad();
    if (sn && (!c || String(sn.savedAt || '') > String(c.savedAt || ''))) {   // 파일 안에 넣어 둔 보관본이 더 새것이거나 브라우저 보관본이 없으면 그것으로
      try { await kv('readwrite', s => s.put(sn, 'cache')); } catch (_) {}
      if (!c) setTimeout(() => toast(`이 파일에 들어 있는 ${fmtTime(sn.savedAt) || ''} 기준 데이터로 열었습니다 (서버가 켜지면 자동으로 최신으로)`), 600);
      c = sn;
    }
    API_BASE = c?.server || API_BASE;                       // 오프라인: 마지막으로 연결됐던 서버로 재연결 시도
    if (c) {
      OFFLINE = true; root = { name:'오프라인 (이 PC 보관본)' };
      if (AUTH) user = AUTH.name; else { user = ''; GUEST = true; }   // 오프라인: 마지막 로그인 계정으로 (서버 연결 시 토큰 재확인), 없으면 보기 전용
      try { await loadAll(); } catch (e) { toast(e.message, true); }
      render(); showMyTodo(); bdayCheck(); if (BLOCKED) toast(BLOCKED, true); return;   // 오프라인으로 연 파일: 보관 명단으로 생일 팝업
    }
    SERVER = false; API_BASE = ''; ADMIN = true; renderMenu(); renderHeader();
    $('#btnFolder').style.display = 'none'; $('#btnWho').hidden = true; $('#whoLine').hidden = true;   // 부서원이 '데이터 폴더 선택'을 누르지 않게 (폴더 모드는 아래 작은 글씨로만)
    $('#content').innerHTML = `<div class="card welcome"><h2>서버가 꺼져 있어 열 수 없습니다</h2>
      <p>서버 <b>${esc(serverUrl())}</b> 에 연결하지 못했고, 이 PC(이 브라우저)에 보관된 데이터도 없습니다.</p>${BLOCKED ? `<p class="banner bad" style="display:block">⛔ ${esc(BLOCKED)}</p>` : ''}
      <p><b>서버가 켜지면 [다시 시도]</b>를 누르세요. 한 번 열리면 그때부터는 서버가 꺼져도 이 파일로 마지막 데이터를 볼 수 있습니다.</p>
      <div class="muted" style="font-size:13px;line-height:1.7;text-align:left;background:var(--bg,#f4f6fb);border-radius:8px;padding:10px 14px">보관된 데이터가 없는 흔한 이유
        <br>· 서버가 켜져 있을 때 <b>이 파일이 아니라 주소(http://…)로</b> 들어갔다 → 주소와 파일은 보관 장소가 따로입니다. 다음에는 이 파일로 여세요
        <br>· 이 파일로 열었지만 <b>로그인 화면에서 바로 닫았다</b> (예전 버전)
        <br>· 브라우저가 <b>닫을 때 사이트 데이터를 지우도록</b> 설정됨 · InPrivate/시크릿 창 · 다른 브라우저(Chrome↔Edge)로 열었다
        <br>→ 서버가 켜지면 위쪽 [💾 자동 보관 켜기]를 한 번 누르세요. 파일 안에도 보관되어 이런 경우에도 열립니다. 서버 폴더 <b>deploy</b> 의 새 dashboard.html 은 처음부터 데이터가 들어 있습니다</div>
      <p style="margin-top:14px"><button class="btn pri" id="btnRetry">다시 시도</button> <button class="btn" id="btnSrv2">서버 주소 변경</button></p>
      <p class="muted" style="font-size:12px;margin-bottom:0">관리자용: <a href="#" id="btnLocalMode">서버 없이 공유 폴더를 직접 여는 폴더 모드</a></p></div>`;
    $('#btnRetry').onclick = () => location.reload();
    $('#btnSrv2').onclick = () => setServerUrl();
    $('#btnLocalMode').onclick = e => { e.preventDefault(); initFolderMode(); };
    return;
  }
  await initFolderMode();
})();
async function startOnline() {
  const bdp = loadBirthdays();                               // 생일 명단: 기다리지 않고 미리 받음
  if (AUTH) bdp.then(bdayCheck);                            // 저장된 로그인으로 들어오면 바로 팝업
  user = ''; let warm = null;                               // 로그인 화면이 뜨면 그 뒤에서 보관본을 먼저 만듦 → 로그인 안 하고 닫아도 다음에 오프라인으로 열림
  await authStart(() => { warm = loadAll({ warm:true }).catch(() => {}); });
  bdp.then(bdayCheck);                                      // 로그인 화면에서 로그인(또는 비회원 보기)한 뒤 팝업 — 그 사용자에게 아직 안 보였으면                             // 서버 모드: 로그인 / 계정 개설 / 비회원
  await refreshPerms();
  if (warm) await warm;                                    // 두 번 불러오기가 겹치지 않게
  try { await loadAll(); } catch (e) { toast('불러오기 실패: ' + e.message, true); }
  render();
  await tsDueCheck();                                      // 매달 첫째 주: 직전 달 시수 올리기 할 일
  showMyTodo();
  presenceStart();
  if (QUEUE.length) await trySync(false);                   // 지난번에 못 올린 오프라인 수정이 있으면 '덮어쓸까요?' 후 업로드
  askUpdate();                                             // 새 버전이 있으면 '교체하세요'
  setTimeout(autoEmbed, 4000); setInterval(autoEmbed, 60e3);   // 파일 사본: 로그인 중 10분마다 파일 안 보관본도 갱신 (1분마다 확인)
}
async function initFolderMode() {
  render();
  if (!('showDirectoryPicker' in window)) { $('#content').innerHTML = '<div class="card welcome"><h2>지원하지 않는 브라우저입니다</h2><p>File System Access API 를 지원하는 <b>Chrome 또는 Edge (데스크톱)</b> 에서 열어주세요.</p></div>'; $('#btnFolder').disabled = true; return; }
  if (!user) { await askName(true); render(); }
  try {
    const h = await kv('readonly', s => s.get('root'));
    if (h) { if (await h.queryPermission({ mode:'readwrite' }) === 'granted') await useRoot(h); else { pending = h; render(); } }
  } catch (_) {}
}
