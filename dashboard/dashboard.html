<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계장ENG그룹 Dashboard</title>
<style>
:root{
  --navy:#1e2a5a; --navy-2:#2a3870; --navy-hi:#3a4a8f;
  --accent:#2b44c9; --accent-d:#1f33a3; --accent-l:#e8ecfc;
  --bg:#eef1f8; --card:#fff; --line:#e1e6f2; --text:#1b2238; --sub:#667089;
  --bad:#d63a2f; --bad-l:#fde8e6; --ok:#168a5c; --ok-l:#dff4ea; --warn:#c77700; --hl:#FFF176; --hl-t:inherit;
  --shadow:0 2px 10px rgba(30,42,90,.08);
  --side-w:240px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}

/* ---------- 사이드바 ---------- */
#side{position:fixed;inset:0 auto 0 0;width:var(--side-w);background:var(--navy);color:#dfe5ff;display:flex;flex-direction:column;z-index:30;transition:transform .2s}
.logo{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.logo b{display:block;font-size:17px;letter-spacing:.5px;color:#fff}
.logo span{font-size:13px;color:#aab6ee}
.menu-title{padding:16px 18px 6px;font-size:11px;letter-spacing:2px;color:#8a98d8}
#menu{flex:1;overflow:auto;padding:0 8px}
.mi{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;margin:2px 0;border:0;border-radius:8px;background:none;color:#dfe5ff;text-align:left}
.mi:hover{background:var(--navy-2)}
.mi.on{background:var(--accent);color:#fff;font-weight:700}
.mi .n{margin-left:auto;font-size:11px;background:rgba(255,255,255,.16);padding:1px 8px;border-radius:99px}
.mi.on .n{background:rgba(255,255,255,.28)}
.mi.top{font-weight:700;font-size:14px}
.mhead{display:flex;align-items:center;gap:2px}
.mhead .mi{flex:1}
.mtog{border:0;background:none;color:#aab6ee;width:28px;height:34px;border-radius:6px;font-size:14px}
.mtog:hover{background:var(--navy-2);color:#fff}
.mgrp.act .mhead .mi:not(.on){color:#fff}
.msub{margin:0 0 6px 10px;padding-left:8px;border-left:1px solid rgba(255,255,255,.14)}
.mi.subi{padding:7px 10px;font-size:13px;margin:1px 0}
.mi .ml{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .chgmark{flex:none;width:8px;margin-left:-6px;margin-right:-4px;color:#FFE066;font-weight:900;text-align:center}
.mi .chgtag{flex:none;white-space:nowrap;margin-left:auto;font-size:10px;font-weight:700;background:#FFE066;color:#4a3a00;padding:1px 7px;border-radius:99px}
.mi .chgtag + .n{margin-left:6px}
.lg-hl{background:#FFF176;padding:0 6px;font-weight:700}
.side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:#aab6ee;display:flex;flex-direction:column;gap:6px}
.side-foot button{background:var(--navy-2);border:0;color:#dfe5ff;padding:6px 10px;border-radius:6px;text-align:left}
.side-foot button:hover{background:var(--navy-hi)}
#scrim{display:none}

/* ---------- 본문 ---------- */
#main{margin-left:var(--side-w);min-height:100%;transition:margin .2s}
body.nav-closed #main{margin-left:0}
body.nav-closed #side{transform:translateX(-100%)}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:16px 24px 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#burger{border:1px solid var(--line);background:#fff;border-radius:8px;width:38px;height:38px;font-size:18px}
.ttl{margin-right:auto;min-width:220px}
.ttl h1{margin:0;font-size:20px;color:var(--accent-d)}
.ttl p{margin:2px 0 0;color:var(--sub);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;color:var(--text)}
.btn:hover{background:#f4f6fd}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--accent-d)}
.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
select.sel{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px}
#content{padding:6px 24px 40px}
.banner{background:#fff6dc;border:1px solid #f0d58a;border-radius:10px;padding:10px 14px;margin-bottom:14px}
.banner.bad{background:var(--bad-l);border-color:#f3b4ae}
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:15px}

/* ---------- 홈 ---------- */
.badges{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;font-weight:600;font-size:13px;border:0;background:#e9edf8;color:var(--text)}
.badge b{background:var(--bad);color:#fff;border-radius:99px;padding:1px 9px;font-size:13px}
.badge.zero b{background:var(--ok)}
.badge.red{background:var(--bad-l);color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:linear-gradient(180deg,#fff,#f1f4ff);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;text-align:left;transition:transform .12s}
.kpi:hover{transform:translateY(-2px);border-color:var(--accent)}
.kpi .l{font-size:12px;color:var(--sub)}
.kpi .v{font-size:28px;font-weight:700;margin:4px 0 2px}
.kpi .v small{font-size:13px;font-weight:400;color:var(--sub);margin-left:3px}
.kpi .go{font-size:12px;color:var(--accent)}
.kpi.red .v{color:var(--bad)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.charts .card{margin:0}
svg.chart{width:100%;height:auto;display:block}
svg text{font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.donut{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.empty{color:var(--sub);padding:24px;text-align:center}
ul.recent{list-style:none;margin:0;padding:0}
ul.recent li{display:grid;grid-template-columns:110px 90px 90px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
ul.recent li:last-child{border:0}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--accent-l);color:var(--accent-d)}
.tag.del{background:var(--bad-l);color:var(--bad)}.tag.new{background:var(--ok-l);color:var(--ok)}
.tag.ok{background:var(--ok-l);color:var(--ok)}

/* ---------- 연도 탭 · 상태 배지 ---------- */
.ytabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:2px 0 12px}
.ytabs .sp{flex:1}
.yt{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;transition:all .15s}
.yt:hover{border-color:var(--accent);color:var(--accent)}
.yt.on{background:linear-gradient(135deg,#2b44c9,#6a5cff);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(43,68,201,.3)}
.vtog{display:inline-flex;gap:4px}
.pjst{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.pjst.live{background:var(--ok-l);color:var(--ok)}.pjst.end{background:#e9ebf2;color:#59607a}
.wst{display:inline-flex;align-items:center;gap:2px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.wst small{font-weight:400;opacity:.75;font-size:10px}
.wsl{font-size:11.5px;margin-top:3px;color:var(--sub)}
.wst.done{background:#dff4ea;color:#11734c}.wst.run{background:#e3ebff;color:#2b44c9}.wst.soon{background:#fff1d6;color:#a35f00}
.wst.late{background:#fde2df;color:#c22b20}.wst.miss{background:#f3e8ff;color:#7b3fc4}.wst.perm{background:#eef0f4;color:#68708a}
/* ---------- 통합 업무 보드 ---------- */
.whero{position:relative;overflow:hidden;border-radius:18px;padding:22px 24px 16px;margin-bottom:16px;color:#fff;
  background:radial-gradient(circle at 85% -20%,rgba(255,255,255,.25),transparent 45%),linear-gradient(120deg,#1b2a8c 0%,#3b3fd8 45%,#7b4ee8 75%,#d04fa8 100%);box-shadow:0 10px 30px rgba(43,40,160,.28)}
.whero h2{margin:0 0 4px;font-size:22px;letter-spacing:-.3px}
.whero p{margin:0;opacity:.85;font-size:13px}
.wh-top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.whero .wadd{margin-left:10px;background:#fff;color:#3b3fd8;font-weight:700;border:0;padding:10px 18px;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.whero .wadd:hover{transform:translateY(-1px)}
.whero .yt{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.whero .yt.on{background:#fff;color:#3b3fd8;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.wtypes{display:flex;gap:8px;flex-wrap:wrap}
.wtc{border:0;border-radius:12px;padding:8px 14px;background:rgba(255,255,255,.12);color:#fff;font-size:13px}
.wtc b{margin-left:4px;font-size:15px}
.wtc.on{background:#fff;color:var(--c,#3b3fd8);font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.wkpis{display:grid;grid-template-columns:1.4fr repeat(6,1fr);gap:12px;margin-bottom:16px}
.wk{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 14px;text-align:left;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s;overflow:hidden}
.wk::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kc,#2b44c9)}
button.wk:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(30,42,90,.14)}
.wk.on{outline:2px solid var(--kc);background:color-mix(in srgb,var(--kc) 7%,#fff)}
.wki{font-size:18px}.wkl{font-size:12px;color:var(--sub)}.wkv{font-size:26px;font-weight:800;color:var(--kc,#1b2238);line-height:1.1}.wks{font-size:11px;color:var(--sub)}
.wk-run{--kc:#2b44c9}.wk-soon{--kc:#d98a00}.wk-late{--kc:#d63a2f}.wk-done{--kc:#168a5c}.wk-perm{--kc:#7a8199}.wk-miss{--kc:#8b4fd6}
.wk-main{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;border:0}
.wk-main::before{display:none}.wk-main .wkl,.wk-main .wks{color:rgba(255,255,255,.9)}
.wkr{display:flex;align-items:center;gap:10px}.wring{width:54px;height:54px}.wk-main .wkv{color:#fff;font-size:32px}.wk-main small{font-size:15px}
.wgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px}
.wph,.wpr{display:grid;grid-template-columns:40px 150px 1fr 1fr 56px;gap:10px;align-items:center}
.wph{font-size:11px;color:var(--sub);padding:0 8px 6px;border-bottom:1px solid var(--line)}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}.dot.h1{background:#4f7cff}.dot.h2{background:#ff7a59}
.wpr{width:100%;border:0;background:none;padding:7px 8px;border-radius:10px;text-align:left}
.wpr:hover{background:#f4f6ff}.wpr.on{background:#e8ecfc}
.wpn{font-weight:700;font-size:13px;display:flex;flex-direction:column}.wpn small{font-weight:400;font-size:11px}.wpn i{font-style:normal}
.wbar{position:relative;height:20px;background:#f1f3f9;border-radius:7px;overflow:hidden}
.wbar span{position:absolute;left:0;top:0;bottom:0;border-radius:7px;min-width:2px}
.wbar .h1{background:linear-gradient(90deg,#4f7cff,#7aa2ff)}.wbar .h2{background:linear-gradient(90deg,#ff7a59,#ffb199)}
.wbar em{position:relative;font-style:normal;font-size:12px;font-weight:700;padding-left:8px;line-height:20px}
.wtot{font-size:18px;font-weight:800;text-align:right}.wtot small{font-size:11px;color:var(--sub);font-weight:400;margin-left:2px}
.wav{display:inline-flex;width:34px;height:34px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.15)}
.wav img{width:100%;height:100%;object-fit:cover}.wav b{display:flex;width:100%;height:100%;align-items:center;justify-content:center;color:#fff;font-size:14px}
.wav.sm{width:22px;height:22px}.wav.sm b{font-size:11px}
.wseg{display:flex;height:30px;border-radius:10px;overflow:hidden;margin:6px 0 8px;font-size:12px;font-weight:700;color:#fff}
.wseg span{display:flex;align-items:center;justify-content:center;min-width:22px}
.ws-done{background:#20a46b}.ws-run{background:#4f6bff}.ws-soon{background:#f0a020}.ws-late{background:#e5483c}.ws-miss{background:#9a62e0}.ws-none{flex:1;background:#eef0f4;color:var(--sub)}
.wleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--sub);margin-bottom:10px}.wleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.wtrack h3{font-size:13px;margin:8px 0 6px}
.wurg{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;margin-bottom:6px}
.wurg:hover{border-color:var(--accent);background:#fafbff}.wurg .wst{grid-row:span 2;align-self:center}.wurg .muted{font-size:11.5px}
.wtype{display:inline-block;padding:3px 9px;border-radius:8px;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);white-space:nowrap}
.wnew{display:inline-block;margin-left:4px;font-size:10px;font-weight:800;color:#fff;background:#ff4d6d;border-radius:6px;padding:1px 5px}
.wtitle{font-size:13.5px}.wd{white-space:nowrap;font-variant-numeric:tabular-nums}
.wperson{display:inline-flex;align-items:center;gap:5px;margin:1px 6px 1px 0;white-space:nowrap}
.wtable td{vertical-align:top}.wtable tr.r-done td{opacity:.62}
.wbody .fx{max-height:120px;overflow:auto}
.wpick{display:grid;gap:8px}.wpick span{display:flex;flex-direction:column;border-left:4px solid var(--c);background:#f7f8fc;border-radius:8px;padding:8px 12px}.wpick small{color:var(--sub)}
@media (max-width:1300px){.wkpis{grid-template-columns:repeat(4,1fr)}.wk-main{grid-column:span 2}.wgrid{grid-template-columns:1fr}}
.wpeople h2{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.wpeople .pfold{margin-left:auto}
.pfmore{display:block;width:100%;margin-top:6px;border:1px dashed var(--line);background:#fafbff;border-radius:10px;padding:7px;color:var(--accent);font-weight:700}
.pfmore:hover{background:var(--accent-l)}
/* ---------- 게시판 유형 · 실명 ---------- */
.bkinds{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.wtc2{border:1px solid var(--line);border-radius:99px;padding:6px 14px;background:#fff;font-size:13px;color:var(--c,var(--text))}
.wtc2 b{margin-left:3px}.wtc2.on{background:var(--c,var(--accent));border-color:transparent;color:#fff;font-weight:700}
.bkind{display:inline-block;font-size:11.5px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);border-radius:99px;padding:2px 9px;margin-right:6px;white-space:nowrap}
.nick.real{background:#e6f4ea;color:#11734c;font-weight:700}
.bkpick{display:flex;gap:8px;margin-bottom:10px}.bkpick label{cursor:pointer}.bkpick input{display:none}
.bkpick span{display:inline-block;border:1.5px solid var(--line);border-radius:10px;padding:7px 14px;font-weight:700;color:var(--c)}
.bkpick input:checked+span{background:var(--c);border-color:var(--c);color:#fff}
.amode{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text)}.amode select{border:1px solid var(--line);border-radius:6px;padding:4px 6px}
/* ---------- 통합 업무 현황판 (유형 카드) ---------- */
.whero.task-hero{background:radial-gradient(circle at 85% -20%,rgba(255,255,255,.25),transparent 45%),linear-gradient(120deg,#1b2a8c 0%,#3b3fd8 45%,#7b4ee8 75%,#d04fa8 100%)}
.ttcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:14px;margin-bottom:16px}
.ttc{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);overflow:hidden}
.ttc::before{content:'';position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.ttc.on{outline:2px solid var(--c);background:color-mix(in srgb,var(--c) 5%,#fff)}
.ttc-h{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;width:100%;border:0;background:none;padding:4px 0 8px;text-align:left}
.ttc-i{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;font-size:22px;background:color-mix(in srgb,var(--c) 14%,#fff)}
.ttc-n{font-weight:800;font-size:15px;color:var(--c);display:flex;flex-direction:column}.ttc-n small{font-weight:400;font-size:11.5px;color:var(--sub)}
.ttc-v{font-size:30px;font-weight:900;color:var(--c);text-align:right;line-height:1}.ttc-v small{display:block;font-size:11px;font-weight:400;color:var(--sub)}
.ttc-s{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}.ttc-s .wst{font-size:11px;padding:1px 7px}
.ttc-b{height:8px;border-radius:5px;background:#eef0f5;overflow:hidden}.ttc-b i{display:block;height:100%;background:var(--c)}
.ttc-x{font-size:12px;margin:6px 0 8px}
.ttc-u{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;width:100%;border:1px solid var(--line);background:#fafbff;border-radius:9px;padding:5px 8px;margin-top:5px;font-size:12.5px;text-align:left}
.ttc-u:hover{border-color:var(--c)}.ttc-u .wst{font-size:10.5px;padding:1px 6px}.ttc-u em{font-style:normal;color:var(--sub);font-size:11.5px}
.ttc-ok{font-size:12px;color:var(--ok);margin-top:6px}
/* ---------- 담당 업무 요약 · 종결 버튼 ---------- */
.psums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.psum{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:linear-gradient(180deg,#fff,#f7f9ff)}
.psum h4{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:6px}.psum h4 span{margin-left:auto;background:var(--accent);color:#fff;border-radius:99px;padding:0 8px;font-size:12px}
.psum ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.psum li{font-size:12.5px;line-height:1.4}.psum li small{display:block;color:var(--sub);font-size:11.5px}.psum li .wst{font-size:10.5px;padding:1px 6px}
.btn.wclose{border-color:#b7e4c7;color:#11734c;background:#effaf3}
@media (max-width:900px){.psums{grid-template-columns:1fr}}
/* ---------- 시수 올리기 (끌어다 놓기 · 미리보기) ---------- */
.tsdrop{display:flex;flex-direction:column;align-items:center;gap:4px;border:2.5px dashed #a9b6e8;border-radius:16px;padding:22px 16px;background:linear-gradient(135deg,#f5f8ff,#f9f2ff);cursor:pointer;text-align:center;transition:all .15s;margin-bottom:12px}
.tsdrop:hover,.tsdrop.over{border-color:var(--accent);background:linear-gradient(135deg,#e8eeff,#f3e8ff);transform:scale(1.01)}
.tsdrop.has{border-style:solid;border-color:#38b27f;background:linear-gradient(135deg,#effaf3,#f3fbff)}
.tsd-i{font-size:34px}.tsdrop b{font-size:15px}.tsdrop .muted{font-size:12px}
.tswarn{background:#fff4e6;border:1px solid #ffd8a8;color:#7a4a00;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.tssum{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;margin-bottom:8px}
.tsbar{display:flex;height:26px;border-radius:8px;overflow:hidden;margin-bottom:8px}

table.t tr.r-open td:not(.hl):not(.sel):not(.selrow):not(.selcol):not(.msel){background:#FFF1E2}

/* 내 업무: 팝업 목록 + 오른쪽 툴바 */
.titem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;margin-top:8px}

.titem.done{background:#f3faf6}
.titem .tt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.tk{flex:none;font-size:11px;font-weight:700;color:var(--accent-d);background:var(--accent-l);border-radius:99px;padding:1px 8px;white-space:nowrap}
.ts{flex:none;font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
.ts.ok{background:var(--ok-l);color:var(--ok)}.ts.no{background:#ffe9d6;color:#b05a00}
.tprog{height:6px;border-radius:99px;background:#e6e9f2;overflow:hidden;margin:4px 0 2px}.tprog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.alldone{background:var(--ok-l);color:var(--ok);border-radius:10px;padding:14px 16px;font-size:15px;margin-bottom:6px}
#taskbar{position:fixed;right:12px;top:130px;z-index:22;width:250px;max-height:calc(100vh - 160px);display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(30,42,90,.18);font-size:12px}

#taskbar .tbh{display:flex;gap:6px;align-items:center;padding:9px 10px 4px;cursor:move;user-select:none}
#taskbar .tbgrip{color:#9aa3bd;font-size:14px;cursor:move;padding:0 2px}#taskbar.drag{opacity:.85;box-shadow:0 12px 34px rgba(30,42,90,.3)}
#taskbar .tbtab{cursor:move}
#taskbar .tbh b{font-size:13px}
#taskbar .tbp{margin-left:auto;font-weight:700;color:#b05a00}#taskbar .tbp.all{color:var(--ok)}
#taskbar .tbh button{border:0;background:#eef1f8;border-radius:6px;width:24px;height:22px;cursor:pointer}
#taskbar .tprog{margin:2px 10px 6px}
#taskbar .tbl{overflow:auto;padding:0 8px 8px}
#taskbar .tbi{display:flex;gap:6px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:6px 4px;border-top:1px solid #f0f2f8;border-radius:6px;cursor:pointer}
#taskbar .tbi:hover{background:var(--accent-l)}

#taskbar .tbi.done .tt{color:var(--sub)}
#taskbar .tbi .tk{font-size:10px;padding:0 6px}
#taskbar .tbtab{border:0;border-radius:10px 0 0 10px;background:var(--navy);color:#fff;padding:10px 8px;font-size:12px;line-height:1.4;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;margin-right:-12px}
#taskbar .tbtab.all{background:var(--ok)}
#taskbar .tbh .tbmsg{width:auto;padding:0 6px;position:relative}
#taskbar .ubadge{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;line-height:16px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;font-style:normal;font-weight:700}
#taskbar .tbsec{display:flex;gap:6px;align-items:baseline;padding:8px 12px 2px;font-size:12px;font-weight:700;border-top:1px solid var(--line)}
#taskbar .tbu{max-height:38vh;flex:none}

#taskbar .tbu .tbi[disabled]{cursor:default;background:none}
#taskbar .mto{color:var(--accent);font-size:12px}
.pdot{color:#b4bccb;font-size:11px}.pdot.on{color:#1fa64a}
@media print{#taskbar{display:none!important}}

.menu-title{display:flex;align-items:center}

.permwrap{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:8px}

/* P&ID 분석: 본문(#content) 전체를 iframe 으로 채움, 바깥 스크롤 없음 */

.welcome{max-width:560px;margin:60px auto;text-align:center}

}

  if (removed) toast(`${HISTORY_DAYS}일 지난 수정 이력 ${removed}건을 정리했습니다`);
}

async function createRecord(key, fields, { id, order } = {}) {
  needLogin();
  if (OFFLINE) return offlineCreate(key, fields, { id, order });
  if (SERVER) {
    try { return (await api('POST', 'rec/' + key, { fields, id, order, by:user })).rec; }
    catch (e) { if (!e.offline) throw e; goOffline(); return offlineCreate(key, fields, { id, order }); }
  }
  const dd = await sub(['data', key]), now = stamp();
  id = id || newId(key);
  if (await readJSON(dd, id + '.json')) throw new Error('같은 ID의 행이 이미 존재합니다');
  if (order == null) order = (DB.recs[key].reduce((m, r) => Math.max(m, r.order), 0)) + 10;
  const rec = { id, sheet:key, order, fields, meta:{ createdBy:user, createdAt:now, updatedBy:user, updatedAt:now, rev:1 } };
  await writeJSON(dd, id + '.json', rec);
  await addHistory(key, id, { action:'create', by:user, at:now, label:recLabel(key, fields), before:null, after:fields, changed:Object.keys(flatten(fields)) });
  return rec;
}

async function saveEdit(key, id, newFields, baseRev, { force = false, action = 'update' } = {}) {
  needLogin();
  if (OFFLINE) return offlineUpdate(key, id, newFields);
  if (SERVER) {
    try { return await api('PUT', `rec/${key}/${enc(id)}`, { fields:newFields, baseRev, force, action, by:user }); }
    catch (e) { if (!e.offline) throw e; goOffline(); return offlineUpdate(key, id, newFields); }
  }
  const dd = await sub(['data', key]), name = id + '.json';
  const cur = await readJSON(dd, name);
  if (!cur) return { status:'deleted' };
  const mismatch = cur.meta.rev !== baseRev;
  if (!force && mismatch) return { status:'conflict', cur };
  const changed = diffPaths(cur.fields, newFields);
  if (!changed.length) return { status:'nochange', cur };
  const now = stamp();
  const changes = { ...(cur.meta.changes || {}) }; changed.forEach(p => changes[p] = now);
  // 마지막 마감 이후 첫 수정 직전 내용(orig) 보관 → '추가된 내용'(파란 글씨) 비교 기준
  const since = DB.state.lastClosedAt || '', m0 = cur.meta;
  const orig = m0.orig != null && (m0.origSince || '') === since ? m0.orig : cur.fields;
  const rec = { ...cur, fields:newFields, meta:{ ...m0, updatedBy:user, updatedAt:now, rev:m0.rev + 1, changes, orig, origSince:since } };
  await writeJSON(dd, name, rec);
  await addHistory(key, id, { action: force && mismatch ? 'overwrite' : action, by:user, at:now, label:recLabel(key, newFields), before:cur.fields, after:newFields, changed, prevBy:cur.meta.updatedBy, prevAt:cur.meta.updatedAt });
  return { status:'ok', rec };
}

async function deleteRecord(key, id) {
  needLogin();
  if (OFFLINE) return offlineDelete(key, id);
  if (SERVER) {
    try { return (await api('DELETE', `rec/${key}/${enc(id)}?by=${enc(user)}`)).status === 'ok'; }
    catch (e) { if (!e.offline) throw e; goOffline(); return offlineDelete(key, id); }
  }
  const dd = await sub(['data', key]), td = await sub(['trash', key]), name = id + '.json';
  const cur = await readJSON(dd, name);
  if (!cur) return false;
  const now = stamp();
  await writeJSON(td, name, { ...cur, meta:{ ...cur.meta, deletedBy:user, deletedAt:now } });
  await dd.removeEntry(name);
  await addHistory(key, id, { action:'delete', by:user, at:now, label:recLabel(key, cur.fields), before:cur.fields, after:null, changed:[] });
  return true;
}

async function restoreFromTrash(key, id) {
  needLogin();
  if (SERVER) return (await api('POST', `trash/${key}/${enc(id)}/restore`, { by:user })).status;
  const dd = await sub(['data', key]), td = await sub(['trash', key]), name = id + '.json';
  const t = await readJSON(td, name);
  if (!t) return 'none';
  if (await readJSON(dd, name)) return 'exists';
  const now = stamp(), { deletedBy, deletedAt, ...meta } = t.meta;
  await writeJSON(dd, name, { ...t, meta:{ ...meta, updatedBy:user, updatedAt:now, rev:(meta.rev || 1) + 1 } });
  await td.removeEntry(name);
  await addHistory(key, id, { action:'restore', by:user, at:now, label:recLabel(key, t.fields), before:null, after:t.fields, changed:[] });
  return 'ok';
}

async function addColumn(name, kind) {
  needLogin();
  if (OFFLINE) throw new Error('오프라인에서는 PJT 열을 추가할 수 없습니다');

}

/* =====================================================================
 *  오프라인 모드: 보관본(IndexedDB 'cache') + 대기열(IndexedDB 'queue') + 30초마다 재연결·자동 업로드
 * ===================================================================== */
let QUEUE = [];
const opId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
async function cacheSave() {
  try {
    await kv('readwrite', s => s.put({ savedAt:stamp(), server:API_BASE || location.origin, recs:DB.recs, cols:DB.cols, state:DB.state,
      baseSheets:DB.baseSheets || null, baseKey:DB.baseKey || '', board:DB.board || [], profiles:DB.profiles || [], sheetCols:DB.sheetCols || {} }, 'cache'));
    OFFLINE_AT = stamp();
  } catch (_) {}
}
async function cacheLoad() { try { return await kv('readonly', s => s.get('cache')); } catch (_) { return null; } }
async function queueLoad() { try { QUEUE = (await kv('readonly', s => s.get('queue'))) || []; } catch (_) { QUEUE = []; } }
async function queueSave() { try { await kv('readwrite', s => s.put(QUEUE, 'queue')); } catch (e) { toast('대기열 저장 실패: ' + e.message, true); } }

/* 대기열 작업을 화면 데이터에 반영 (보관본 위에 겹쳐 보기) */
function applyOp(op) {
  const arr = DB.recs[op.key] || (DB.recs[op.key] = []), i = arr.findIndex(r => r.id === op.id);
  if (op.op === 'create') {
    if (i < 0) arr.push({ id:op.id, sheet:op.key, order:op.order, fields:op.fields, meta:{ createdBy:op.by, createdAt:op.at, updatedBy:op.by, updatedAt:op.at, rev:0, pending:true } });
    else arr[i] = { ...arr[i], fields:op.fields };
  } else if (op.op === 'update') {
    if (i >= 0) { const r = arr[i]; arr[i] = { ...r, fields:op.fields, meta:{ ...r.meta, updatedBy:op.by, updatedAt:op.at, pending:true } }; }
  } else if (op.op === 'delete') { if (i >= 0) arr.splice(i, 1); }
  arr.sort(byOrder);
}
async function offlineCreate(key, fields, { id, order } = {}) {
  id = id || newId(key);
  if (order == null) order = (DB.recs[key].reduce((m, r) => Math.max(m, r.order), 0)) + 10;
  const op = { uid:opId(), op:'create', key, id, order, fields, by:user, at:stamp() };
  QUEUE.push(op); await queueSave(); applyOp(op);
  return DB.recs[key].find(r => r.id === id);
}
async function offlineUpdate(key, id, fields) {
  const cur = DB.recs[key].find(r => r.id === id);
  if (!cur) return { status:'deleted' };
  if (!diffPaths(cur.fields, fields).length) return { status:'nochange', cur };
  const at = stamp(), ex = QUEUE.find(o => o.key === key && o.id === id && (o.op === 'update' || o.op === 'create'));
  if (ex) { ex.fields = fields; ex.at = at; ex.by = user; }               // 같은 행은 한 건으로 합침 (수정 전 버전은 처음 것 유지)
  else QUEUE.push({ uid:opId(), op:'update', key, id, fields, baseRev:cur.meta.rev, baseFields:cur.fields, baseBy:cur.meta.updatedBy, baseAt:cur.meta.updatedAt, by:user, at });
  await queueSave(); applyOp({ op:'update', key, id, fields, by:user, at });
  return { status:'ok' };
}
async function offlineDelete(key, id) {
  const cur = DB.recs[key].find(r => r.id === id); if (!cur) return false;
  const created = QUEUE.some(o => o.key === key && o.id === id && o.op === 'create');
  const upd = QUEUE.find(o => o.key === key && o.id === id && o.op === 'update');
  QUEUE = QUEUE.filter(o => !(o.key === key && o.id === id));
  if (!created) QUEUE.push({ uid:opId(), op:'delete', key, id, baseRev:cur.meta.rev, baseFields:upd ? upd.baseFields : cur.fields, by:user, at:stamp() });
  await queueSave(); applyOp({ op:'delete', key, id });
  return true;
}

function goOffline() {
  if (OFFLINE) return;
  OFFLINE = true;
  toast('서버 연결이 끊겨 오프라인 모드로 전환했습니다. 수정 내용은 이 PC에 보관됩니다', true);
}

/* 대기열 업로드: 서버 버전이 바뀐 행은 [내 것으로 덮어쓰기 / 서버 것 유지 / 나중에] 선택 */
async function getServerRec(key, id) {
  try { return await api('GET', `rec/${key}/${enc(id)}`); } catch (e) { if (e.status === 404) return null; throw e; }
}
function diffTable(a, b, la, lb) {
  const x = flatten(a || {}), y = flatten(b || {});
  const ks = Object.keys({ ...x, ...y }).filter(k => (x[k] ?? '') !== (y[k] ?? ''));
  return `<div class="chg" style="font-weight:700"><span></span><span>${la}</span><span>${lb}</span></div>` +
    (ks.map(k => `<div class="chg"><b>${esc(k)}</b><pre class="b">${esc(x[k] ?? '')}</pre><pre class="a">${esc(y[k] ?? '')}</pre></div>`).join('') || '<p class="muted">내용 차이 없음</p>');
}
async function syncOp(op, force) {                       // force: [예 (덮어쓰기)] — 충돌해도 묻지 않고 내 것으로
  const label = `${esc(SHEET[op.key]?.label || op.key)} · <b>${esc(recLabel(op.key, op.fields || op.baseFields || {}))}</b>`;
  const choose = (title, body) => ask(title, body, [{ id:'mine', label:'내 것으로 덮어쓰기', cls:'pri' }, { id:'server', label:'서버 것 유지' }, { id:'later', label:'나중에' }]);
  if (op.op === 'create') {
    try { await api('POST', 'rec/' + op.key, { fields:op.fields, id:op.id, order:op.order, by:op.by }); }
    catch (e) { if (e.status !== 409) throw e; }                          // 이미 올라간 행
    return 'done';
  }
  const cur = await getServerRec(op.key, op.id);
  if (op.op === 'update') {
    if (cur && cur.meta.rev === op.baseRev) {
      const r = await api('PUT', `rec/${op.key}/${enc(op.id)}`, { fields:op.fields, baseRev:op.baseRev, by:op.by });
      if (r.status === 'ok' || r.status === 'nochange') return 'done';
    }
    const now = cur || null;
    const c = force ? 'mine' : await choose('⚠ 오프라인 수정 충돌', now
      ? `${label}<p>오프라인으로 수정하는 동안 서버에서 <b>${esc(now.meta.updatedBy)}</b>님이 <b>${fmtTime(now.meta.updatedAt)}</b>에 이 행을 수정했습니다.<br><span class="muted">내 오프라인 수정: ${esc(op.by)} · ${fmtTime(op.at)}</span></p>${diffTable(now.fields, op.fields, '서버 최신', '내 오프라인 수정')}`
      : `${label}<p>오프라인으로 수정하는 동안 서버에서 이 행이 <b>삭제</b>되었습니다. [내 것으로 덮어쓰기]를 누르면 내 내용으로 다시 만듭니다.</p>`);
    if (c === 'mine') {
      if (now) await api('PUT', `rec/${op.key}/${enc(op.id)}`, { fields:op.fields, baseRev:now.meta.rev, force:true, by:op.by });
      else { try { await api('POST', 'rec/' + op.key, { fields:op.fields, id:op.id, by:op.by }); } catch (e) { if (e.status !== 409) throw e; } }
      return 'done';
    }
    return c === 'server' ? 'done' : 'later';
  }
  if (op.op === 'delete') {
    if (!cur) return 'done';
    if (cur.meta.rev !== op.baseRev) {
      const c = force ? 'mine' : await ask('⚠ 오프라인 삭제 충돌', `${label}<p>오프라인으로 삭제한 행을 서버에서 <b>${esc(cur.meta.updatedBy)}</b>님이 <b>${fmtTime(cur.meta.updatedAt)}</b>에 수정했습니다.</p>${diffTable(op.baseFields, cur.fields, '내가 삭제할 때 내용', '서버 최신')}`,
        [{ id:'mine', label:'그래도 삭제(휴지통)', cls:'pri' }, { id:'server', label:'서버 것 유지' }, { id:'later', label:'나중에' }]);
      if (c === 'server') return 'done';
      if (c !== 'mine') return 'later';
    }
    await api('DELETE', `rec/${op.key}/${enc(op.id)}?by=${enc(op.by)}`);
    return 'done';
  }
  return 'done';
}
let syncing = false;
async function trySync(manual) {
  if (!SERVER || syncing || dlg.open || dlg2.open) return;
  syncing = true;
  try {
    let info;
    try { info = await api('GET', 'info'); rememberServers(info); }
    catch (e) {
      if (location.protocol === 'file:') { const prev = API_BASE; info = await findServer(); if (!info) API_BASE = prev; }   // IP 가 바뀌었을 수 있음 → 기억해 둔 다른 주소들
      if (!info) { if (manual) toast(BLOCKED || '서버에 연결할 수 없습니다. 오프라인 상태를 유지합니다', true); return; }
    }
    ADMIN = !!info.admin; SERVER_INFO = info; setPerms(info.perms); checkVersion(info);
    const was = OFFLINE; OFFLINE = false;
    if (was) root = { name:serverLabel() };
    let up = 0, later = 0;
    const mine = QUEUE.filter(op => AUTH && !(op.by && op.by !== AUTH.name));
    let mode = 'each';
    if (mine.length) {                                     // 서버가 다시 켜짐 → 꺼져 있을 때 쓴 내용을 덮어쓸지 먼저 물음
      if (SYNC_HOLD && !manual) mode = 'hold';
      else { mode = await askOverwrite(mine); SYNC_HOLD = mode === 'hold'; }
    }
    for (const op of [...QUEUE]) {
      if (!AUTH || (op.by && op.by !== AUTH.name)) { later++; continue; }   // 다른 사람이 이 PC에서 오프라인 수정한 것은 그 사람이 로그인했을 때 업로드
      if (mode === 'hold') { later++; continue; }
      let r;
      try { r = await syncOp(op, mode === 'yes'); }
      catch (e) { if (e.offline) { OFFLINE = true; break; } toast(`업로드 실패 (${SHEET[op.key]?.label}): ${e.message}`, true); r = 'later'; }
      if (r === 'done') { QUEUE = QUEUE.filter(o => o.uid !== op.uid); await queueSave(); up++; } else later++;
    }
    if (OFFLINE) { await loadAll(); render(); toast('업로드 중 연결이 끊겼습니다. 남은 대기열은 다음 연결 때 올립니다', true); return; }
    await loadAll(); render(); presenceStart();
    if (was || up || manual) toast(`서버에 연결되었습니다${up ? ` · 서버가 꺼져 있을 때 쓴 내용 ${up}건 반영` : ''}${later ? ` · ${later}건은 이 PC에 보관 (나중에)` : ''}`);
  } finally { syncing = false; }
  askUpdate();
}
/* 서버가 꺼져 있을 때 이 PC 에서 쓴 내용(대기열) → '덮어쓸까요?' : yes = 모두 반영(충돌도 내 것으로) / each = 충돌 행만 비교 창 / hold = 나중에 */
let SYNC_HOLD = false;
async function askOverwrite(list) {
  const rows = list.slice(0, 40).map(o => `<tr><td>${esc(SHEET[o.key]?.label || o.key)}</td><td>${esc(trunc(recLabel(o.key, o.fields || o.baseFields || {}), 40))}</td><td><span class="tag ${o.op === 'delete' ? 'del' : o.op === 'create' ? 'new' : ''}">${OPNAME[o.op]}</span></td><td>${fmtTime(o.at)}</td></tr>`).join('');
  const c = await ask('💾 서버가 꺼져 있을 때 작성한 내용이 있습니다',
    `<p style="margin-top:0">서버가 꺼져 있던 동안 이 PC 에서 작성·수정한 내용 <b>${list.length}건</b>이 있습니다.<br><b style="font-size:15px">켜진 서버에 덮어쓸까요?</b></p>
    <div class="tw" style="max-height:40vh"><table class="t"><thead><tr><th>시트</th><th>항목</th><th>작업</th><th>작성 시각</th></tr></thead><tbody>${rows}</tbody></table></div>${list.length > 40 ? `<p class="muted">… 외 ${list.length - 40}건</p>` : ''}
    <p class="muted" style="margin-bottom:0">[예] 모두 서버에 반영 — 그 사이 다른 사람이 같은 행을 고쳤어도 <b>내 내용으로 덮어씀</b> (덮어쓴 전 내용은 이력에 남음)<br>[하나씩 확인] 다른 사람이 고친 행만 비교해서 고름 · [나중에] 이 PC 에 계속 보관 (위 배너의 [지금 동기화]로 다시)</p>`,
    [{ id:'yes', label:'예 (덮어쓰기)', cls:'pri' }, { id:'each', label:'하나씩 확인' }, { id:'later', label:'나중에' }]);
  await new Promise(ok => setTimeout(ok, 0));
  return c === 'yes' || c === 'each' ? c : 'hold';
}
/* 프로그램 업데이트: 부서원 PC 의 dashboard.html(file://) 이 서버보다 옛 버전이면 '교체하세요' → [예] 를 누르면 그 파일을 새 파일로 덮어씀
   (Edge/Chrome File System Access API: 처음 한 번 저장 창에서 지금 쓰는 파일을 고르면 그 파일 핸들을 IndexedDB 'self' 에 기억 → 다음부터 창 없이 바로) */
let UPD_ASKED = '';
const selfName = () => { try { return decodeURIComponent(location.pathname.split('/').pop()) || 'dashboard.html'; } catch (_) { return 'dashboard.html'; } };
const selfPath = () => { try { return decodeURIComponent(location.pathname).replace(/^\/([A-Za-z]:)/, '$1').replace(/\//g, '\\'); } catch (_) { return location.pathname; } };
async function newHtml() {
  const res = await fetch(API_BASE + '/dashboard.html', { cache:'no-store' });
  if (!res.ok) throw new Error(`서버 오류 (${res.status})`);
  const t = await res.text();
  if (!t.includes('const APP_VERSION')) throw new Error('받은 파일이 대시보드가 아닙니다');
  return t;
}
async function askUpdate(manual) {
  if (!NEWVER || OFFLINE || (!manual && (UPD_ASKED === NEWVER || dlg.open || dlg2.open))) return;
  UPD_ASKED = NEWVER;
  let html; try { html = await newHtml(); } catch (e) { if (manual) toast('새 버전을 받지 못했습니다: ' + e.message, true); return; }
  const c = await ask('🆕 프로그램이 업데이트되었습니다',
    `<p style="margin-top:0;font-size:15px"><b>부서원의 dashboard.html 을 업데이트 파일로 교체하세요.</b></p>
    <p>내 파일 버전 <b>${esc(APP_VERSION)}</b> → 새 버전 <b style="color:var(--accent)">${esc(NEWVER)}</b><br><span class="muted">지금 쓰는 파일: ${esc(selfPath())}</span></p>
    <p class="muted" style="margin-bottom:0">[예] 를 누르면 이 PC 의 파일을 새 파일로 덮어쓰고 다시 엽니다.${'showSaveFilePicker' in window ? `<br>처음 한 번은 <b>저장 창</b>이 열립니다 → 위 경로의 <b>${esc(selfName())}</b> 를 고르고 [저장] → [예(바꾸기)]. 다음부터는 창 없이 바로 바뀝니다.` : '<br>이 브라우저는 파일을 직접 덮어쓸 수 없어 새 파일을 내려받습니다 → 내려받은 파일로 직접 바꿔 주세요.'}</p>`,
    [{ id:'yes', label:'예 (교체)', cls:'pri' }, { id:'no', label:'나중에' }]);
  if (c === 'yes') await replaceSelf(html);
}
async function replaceSelf(html) {
  const fname = selfName();
  if (!('showSaveFilePicker' in window)) { location.href = API_BASE + '/dashboard.html?download=1'; return toast('새 파일을 내려받았습니다. 지금 쓰는 dashboard.html 을 그 파일로 바꿔 주세요'); }
  try {
    let h = null;
    try { h = await kv('readonly', st => st.get('self')); } catch (_) {}
    if (h && h.name !== fname) h = null;                   // 다른 이름의 파일을 열었으면 다시 고름
    if (h && await h.queryPermission({ mode:'readwrite' }) !== 'granted' && await h.requestPermission({ mode:'readwrite' }) !== 'granted') h = null;
    if (!h) h = await window.showSaveFilePicker({ id:'dept-dashboard-self', suggestedName:fname, types:[{ description:'대시보드 (HTML)', accept:{ 'text/html':['.html', '.htm'] } }] });
    const w = await h.createWritable(); await w.write(new Blob([html], { type:'text/html' })); await w.close();
    try { await kv('readwrite', st => st.put(h, 'self')); } catch (_) {}
    if (h.name === fname) { toast('새 버전으로 바꿨습니다. 다시 엽니다…'); setTimeout(() => location.reload(), 1200); }
    else toast(`새 버전을 '${h.name}' 으로 저장했습니다. 지금 연 파일(${fname}) 대신 그 파일을 여세요`, true);
  } catch (e) {
    if (e.name === 'AbortError') return toast('교체를 취소했습니다. 위 배너의 [지금 교체]로 다시 할 수 있습니다', true);
    toast(`교체하지 못했습니다 (${e.message}) — 배너의 [새 버전 다운로드]로 받아 직접 바꿔 주세요`, true);
  }
}
function checkVersion(info) { NEWVER = info.version && info.version !== APP_VERSION && location.protocol === 'file:' ? info.version : ''; }
const serverLabel = () => `${(API_BASE || location.origin).replace(/^https?:\/\//, '')} (서버${ADMIN ? ' · 관리자' : ''})`;

/* 대기열 보기 / 내보내기 / 가져오기 */
const OPNAME = { create:'추가', update:'수정', delete:'삭제' };
function openQueue() {
  const rows = QUEUE.map((o, i) => `<tr><td>${esc(SHEET[o.key]?.label || o.key)}</td><td>${esc(recLabel(o.key, o.fields || o.baseFields || {}))}</td><td><span class="tag ${o.op === 'delete' ? 'del' : o.op === 'create' ? 'new' : ''}">${OPNAME[o.op]}</span></td><td>${esc(o.by)}</td><td>${fmtTime(o.at)}</td><td><button class="btn sm bad" data-qdel="${i}">취소</button></td></tr>`).join('');
  openDlg(dlg, `<div class="dh"><span>오프라인 대기열 (${QUEUE.length}건)</span><button class="btn sm" data-close>닫기</button></div>
    <div class="db"><p class="muted">서버에 아직 올라가지 않은 수정입니다. 서버가 연결되면 자동 업로드됩니다(30초마다 재연결 시도).<br>급할 때는 [내보내기]로 JSON 파일을 만들어 전달하고, 받은 사람이 [가져오기] 하면 같은 방식으로 서버에 반영됩니다.</p>
      ${QUEUE.length ? `<table class="t"><thead><tr><th>시트</th><th>항목</th><th>작업</th><th>작성자</th><th>시각</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="empty">대기 중인 수정이 없습니다</div>'}</div>
    <div class="df"><input type="file" id="qFile" accept=".json,application/json" hidden>
      <button class="btn" id="qImport">가져오기</button><button class="btn" id="qExport" ${QUEUE.length ? '' : 'disabled'}>내보내기</button>
      <button class="btn pri" id="qSync">지금 동기화</button></div>`, true);
  dlg.onclick = async e => {
    if (e.target.closest('[data-close]')) return dlg.close();
    const d = e.target.closest('[data-qdel]');
    if (d) {
      const o = QUEUE[+d.dataset.qdel];
      if (await ask('대기열 항목 취소', `${OPNAME[o.op]} · <b>${esc(recLabel(o.key, o.fields || o.baseFields || {}))}</b><br>이 오프라인 수정을 버립니다. 서버에 올라가지 않습니다.`, [{ id:'ok', label:'버리기', cls:'pri' }, { id:'no', label:'취소' }]) !== 'ok') return;
      QUEUE = QUEUE.filter(x => x.uid !== o.uid); await queueSave(); await loadAll().catch(() => {}); render(); openQueue();
    }
  };
  $('#qExport').onclick = exportQueue;
  $('#qImport').onclick = () => $('#qFile').click();
  $('#qFile').onchange = e => { const f = e.target.files[0]; if (f) importQueue(f); };
  $('#qSync').onclick = async () => { dlg.close(); await trySync(true); };
}
function exportQueue() {
  const d = new Date(), data = { type:'dept-dashboard-queue', version:1, exportedAt:stamp(), exportedBy:user, ops:QUEUE };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type:'application/json' }));
  a.download = `대기열_${safeName(user)}_${todayISO()}_${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast(`대기열 ${QUEUE.length}건을 파일로 내보냈습니다`);
}
async function importQueue(file) {
  try {
    const d = JSON.parse(await file.text());
    if (d.type !== 'dept-dashboard-queue' || !Array.isArray(d.ops)) throw new Error('대기열 파일이 아닙니다');
    const have = new Set(QUEUE.map(o => o.uid));
    const add = d.ops.filter(o => o && o.uid && !have.has(o.uid) && SHEET[o.key] && OPNAME[o.op] && /^[A-Za-z0-9_\-]{1,80}$/.test(o.id));
    QUEUE.push(...add); await queueSave();
    dlg.close();
    toast(`${d.exportedBy || ''} 대기열 ${add.length}건을 가져왔습니다${add.length < d.ops.length ? ` (중복·잘못된 ${d.ops.length - add.length}건 제외)` : ''}`);
    if (OFFLINE) { await loadAll(); render(); } else await trySync(true);
  } catch (e) { toast('가져오기 실패: ' + e.message, true); }
}

const dlg = $('#dlg'), dlg2 = $('#dlg2');
function openDlg(el, html, wide) {
  el.className = wide ? 'wide' : ''; el.innerHTML = html;
  if (!el.open) { el.removeAttribute('style'); el.showModal(); }            // 새로 열 때는 가운데 위치로

/* 팝업 위쪽(제목 줄)을 끌어서 이동 */
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('dialog .dh');
  if (!h || e.button !== 0 || e.target.closest('button,input,select,textarea,a')) return;
  const d = h.closest('dialog'), r = d.getBoundingClientRect(), sx = e.clientX, sy = e.clientY;
  Object.assign(d.style, { margin:'0', left:r.left + 'px', top:r.top + 'px', right:'auto', bottom:'auto' });
  h.setPointerCapture(e.pointerId);
  h.onpointermove = ev => {
    d.style.left = Math.min(innerWidth - 80, Math.max(80 - r.width, r.left + ev.clientX - sx)) + 'px';
    d.style.top = Math.min(innerHeight - 40, Math.max(0, r.top + ev.clientY - sy)) + 'px';
  };
  h.onpointerup = h.onpointercancel = () => { h.onpointermove = h.onpointerup = h.onpointercancel = null; };
});
function ask(title, body, buttons) {
  return new Promise(res => {
    openDlg(dlg2, `<div class="dh">${esc(title)}</div><div class="db">${body}</div><div class="df">${buttons.map(b => `<button class="btn ${b.cls || ''}" data-id="${b.id}">${esc(b.label)}</button>`).join('')}</div>`);
    let done = false;
    const fin = v => { if (done) return; done = true; dlg2.close(); res(v); };
    dlg2.onclick = e => { const b = e.target.closest('button[data-id]'); if (b) fin(b.dataset.id); };
    dlg2.onclose = () => { if (!dlg2.open) fin(null); };   // 바로 앞 창의 늦게 온 close 이벤트는 무시 (창이 열려 있으면 내 창이 아님)
  });
}
async function askName(first) {

/* ---------- 계정: 로그인 / 계정 개설 / 비밀번호 재설정 / 비회원 (서버 모드) ---------- */
function authSave(token, u) {
  AUTH = { token, id:u.id, name:u.name }; GUEST = false; user = u.name;
  try { localStorage.setItem(LS_AUTH, JSON.stringify(AUTH)); } catch (_) {}
}
function authClear() {
  AUTH = null; user = '';
  try { localStorage.removeItem(LS_AUTH); } catch (_) {}
}
let authExpiring = false;
function authExpired() {                                 // 서버가 토큰을 거부: 비회원으로 전환 후 로그인 창
  if (authExpiring) return; authExpiring = true;
  authClear(); GUEST = true; render();
  toast('로그인이 만료되었습니다. 다시 로그인하세요', true);
  setTimeout(async () => { await authDialog('login'); authExpiring = false; afterAuth(); }, 300);
}
// 저장된 토큰 확인 → 유효하면 그대로, 아니면 로그인 창. 서버 연결 중일 때만 호출
async function authStart() {
  if (AUTH?.token) {
    try { const me = await api('GET', 'auth/me'); authSave(AUTH.token, me); return; }
    catch (e) { if (e.offline) { user = AUTH.name; return; } authClear(); }
  }
  await authDialog();
}
async function refreshPerms() { try { setPerms((await api('GET', 'info')).perms); } catch (_) {} }   // 로그인·로그아웃 후 그 계정의 메뉴 권한
async function afterAuth() { await refreshPerms(); TB.prev = null; TB.active = ''; todoShown = false; render(); showMyTodo(); presenceStart(); }
// 첫 화면: 전체 화면 로그인 (ID 입력 → 비밀번호 입력 2단계, 계정 개설·비밀번호 재설정·비회원 보기)
const LS_LASTID = 'dept-auth-lastid';
function authDialog(start = 'home') {
  return new Promise(res => {
    let lastId = ''; try { lastId = localStorage.getItem(LS_LASTID) || ''; } catch (_) {}
    let curId = lastId;
    const scr = document.createElement('div'); scr.id = 'authScreen';
    document.body.appendChild(scr); document.documentElement.style.overflow = 'hidden';   // 뒤쪽 화면 스크롤바 숨김
    const fin = () => { scr.remove(); document.documentElement.style.overflow = ''; res(); };
    const eye = '<button type="button" class="aeye" data-eye title="비밀번호 보기/숨기기" aria-label="비밀번호 보기/숨기기"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>';
    const field = (id, label, type = 'text', extra = '') => `<div class="afl"><input id="${id}" type="${type}" placeholder="${label}" aria-label="${label}" ${extra}>${type === 'password' ? eye : ''}</div>`;
    const links = arr => `<div class="alinks">${arr.map(([go, t]) => `<button type="button" data-go="${go}">${t}</button>`).join('')}</div>`;
    const pages = {
      id: () => `${field('aId', 'ID', 'text', `maxlength="20" autocomplete="username" value="${esc(curId)}"`)}
          <button class="asubmit" data-do="next" disabled>다음</button>
          ${links([['join', '계정 개설'], ['guest', '비회원으로 보기']])}`,
      pw: () => `<div class="aident"><span>${esc(curId)}</span><button type="button" data-go="id">변경</button></div>
          ${field('aPw', '비밀번호', 'password', 'maxlength="64" autocomplete="current-password"')}
          <p class="aerr" id="aErr"></p>
          <button class="asubmit" data-do="login" disabled>로그인</button>
          ${links([['reset', '비밀번호를 잊으셨나요?'], ['join', '계정 개설'], ['guest', '비회원으로 보기']])}`,
      join: () => `<h3>계정 개설</h3>
          ${field('aId', 'ID (영문 소문자·숫자 3~20자)', 'text', 'maxlength="20" autocomplete="username"')}
          ${field('aName', '본명 (수정 이력에 표시됩니다)', 'text', 'maxlength="20"')}
          ${field('aPw', '비밀번호 (8자 이상)', 'password', 'maxlength="64" autocomplete="new-password"')}
          ${field('aPw2', '비밀번호 확인', 'password', 'maxlength="64" autocomplete="new-password"')}
          <p class="anote">아래 메일주소와 생년월일은 비밀번호를 잊었을 때 본인 확인에만 사용합니다. (원문은 저장하지 않고 확인용 값만 저장)</p>
          ${field('aMail', '메일주소', 'email', 'maxlength="100"')}
          <div class="afl"><label class="adate">생년월일<input id="aBirth" type="date" min="1900-01-01" aria-label="생년월일"></label></div>
          <p class="aerr" id="aErr"></p>
          <button class="asubmit" data-do="join">계정 만들기</button>
          ${links([['id', '← 로그인으로 돌아가기']])}`,
      reset: () => `<h3>비밀번호 재설정</h3>
          <p class="anote">계정 개설 때 입력한 메일주소와 생년월일이 맞으면 새 비밀번호로 바꿉니다.</p>
          ${field('aId', 'ID', 'text', `maxlength="20" value="${esc(curId)}"`)}
          ${field('aMail', '메일주소', 'email', 'maxlength="100"')}
          <div class="afl"><label class="adate">생년월일<input id="aBirth" type="date" min="1900-01-01" aria-label="생년월일"></label></div>

    const show = p => {

    async function run(kind) {

        if (kind === 'next') { curId = v('aId').toLowerCase(); return show('pw'); }
        if ((kind === 'join' || kind === 'reset') && $('#aPw', scr).value !== $('#aPw2', scr).value) return err('비밀번호 확인이 일치하지 않습니다');
        if (kind === 'login') {
          const r = await api('POST', 'auth/login', { id:curId, password:$('#aPw', scr).value });
          authSave(r.token, r.user); remember(r.user.id); toast(`${r.user.name}님 환영합니다`); return fin();

        if (kind === 'join') {

          authSave(r.token, r.user); remember(r.user.id); toast(`계정을 만들었습니다 · ${r.user.name}님 환영합니다`); return fin();
        }
        if (kind === 'reset') {
          const id = v('aId').toLowerCase();
          await api('POST', 'auth/reset', { id, email:v('aMail'), birth:v('aBirth'), password:$('#aPw', scr).value });
          toast('비밀번호를 바꿨습니다. 새 비밀번호로 로그인하세요'); curId = id; remember(id); show('pw');
        }

    scr.onclick = e => {
      const ey = e.target.closest('[data-eye]');
      if (ey) { const i = ey.previousElementSibling; i.type = i.type === 'password' ? 'text' : 'password'; return i.focus(); }
      const g = e.target.closest('[data-go]');
      if (g) { if (g.dataset.go === 'guest') { authClear(); GUEST = true; return fin(); } return show(g.dataset.go); }
      const d = e.target.closest('[data-do]'); if (d && !d.disabled) run(d.dataset.do);
    };
    scr.oninput = sync;
    scr.onkeydown = e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); $('.asubmit', scr)?.click(); } };
    show(start === 'join' || start === 'reset' ? start : lastId ? 'pw' : 'id');
  });
}

/* ---------- 접속자 표시 (30초마다 ping) · 쪽지 ---------- */
const PRES = { users:[], unread:0, ready:false };
const presenceOn = () => SERVER && !OFFLINE && !!AUTH;
let presTimer = null;
function presenceStart() {
  if (!presenceOn()) return;
  ping(); if (!presTimer) presTimer = setInterval(ping, 30000);
}
async function ping() {
  if (!presenceOn()) return;
  try {
    const r = await api('POST', 'auth/ping', {});
    if (PRES.ready && r.unread > PRES.unread) toast(`📨 새 쪽지 ${r.unread - PRES.unread}건 — 오른쪽 툴바의 쪽지함에서 확인하세요`);
    PRES.users = r.users; PRES.unread = r.unread; PRES.ready = true;
    if (setPerms(r.perms) && !dlg.open && !dlg2.open) { toast('메뉴 권한이 변경되었습니다'); render(); }   // 운영자가 권한을 바꾸면 30초 안에 반영
    renderTaskBar();
  } catch (e) { if (e.status === 401) authExpired(); }
}
async function sendMsg(to, toName, prefill = '') {
  const c = await ask(`✉ ${toName}님에게 쪽지`, `<textarea id="msgBody" rows="6" maxlength="1000" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px" placeholder="내용 (1000자 이내)">${esc(prefill)}</textarea>
    <p class="muted">보내는 사람: ${esc(AUTH?.name || '')} (${esc(AUTH?.id || '')})</p>`, [{ id:'ok', label:'보내기', cls:'pri' }, { id:'no', label:'취소' }]);
  const body = c === 'ok' ? (document.querySelector('#msgBody')?.value || '').trim() : '';
  if (!body) return;
  try { await api('POST', 'msg', { to, body }); toast(`${toName}님에게 쪽지를 보냈습니다`); }
  catch (e) { toast('쪽지 보내기 실패: ' + e.message, true); }
}
async function openInbox(tab = 'in') {
  let box;
  try { box = await api('GET', 'msg'); } catch (e) { return toast('쪽지함을 불러오지 못했습니다: ' + e.message, true); }
  const list = tab === 'in' ? box.inbox : box.sent;
  const item = (m, i) => `<div class="msgi ${tab === 'in' && !m.read ? 'unread' : ''}"><div class="mh">
      ${tab === 'in' ? `<b>${esc(m.fromName)}</b><span class="muted">${esc(m.from)}</span>` : `<span class="muted">받는 사람</span><b>${esc(m.toName)}</b>`}
      <span class="muted">${fmtTime(m.at)}</span>${tab === 'sent' ? `<span class="tag ${m.read ? 'new' : ''}">${m.read ? '읽음' : '안 읽음'}</span>` : ''}
      <span class="sp"></span>${tab === 'in' ? `<button class="btn sm" data-mre="${i}">답장</button>` : ''}<button class="btn sm bad" data-mdel="${i}">삭제</button></div>
      <div class="mb">${esc(m.body)}</div></div>`;
  openDlg(dlg2, `<div class="dh"><span>📨 쪽지함</span><button class="btn sm" data-mclose>닫기</button></div>
    <div class="db"><div class="mtabs"><button class="btn sm ${tab === 'in' ? 'pri' : ''}" data-mtab="in">받은 쪽지 ${box.inbox.filter(m => !m.read).length ? `(${box.inbox.filter(m => !m.read).length})` : ''}</button><button class="btn sm ${tab === 'sent' ? 'pri' : ''}" data-mtab="sent">보낸 쪽지</button></div>
    ${list.map(item).join('') || `<div class="empty">${tab === 'in' ? '받은 쪽지가 없습니다' : '보낸 쪽지가 없습니다'}</div>`}
    <p class="muted">쪽지는 180일 뒤 자동 삭제됩니다.</p></div>`, true);
  dlg2.oncancel = null; dlg2.onclose = null; dlg2.onkeydown = null;
  dlg2.onclick = async e => {
    if (e.target.closest('[data-mclose]')) return dlg2.close();
    const t = e.target.closest('[data-mtab]'); if (t) return openInbox(t.dataset.mtab);
    const r = e.target.closest('[data-mre]'); if (r) { const m = list[+r.dataset.mre]; return sendMsg(m.from, m.fromName); }
    const d = e.target.closest('[data-mdel]');
    if (d) { const m = list[+d.dataset.mdel]; try { await api('DELETE', `msg/${tab}/${enc(m.id)}`); openInbox(tab); } catch (er) { toast('삭제 실패: ' + er.message, true); } }
  };
  if (tab === 'in') {                                     // 열어 본 받은 쪽지는 읽음 처리
    const unread = list.filter(m => !m.read);
    for (const m of unread) { try { await api('POST', `msg/${enc(m.id)}/read`, {}); } catch (_) {} }
    if (unread.length) { PRES.unread = Math.max(0, PRES.unread - unread.length); renderTaskBar(); }
  }
}

/* ---------- ⚙ 메뉴 권한 설정 (운영자 = 서버 PC 에서만, 서버도 localhost 만 허용) ---------- */
async function openPerms() {

  const rows = [{ id:'', name:'비회원', sub:'로그인하지 않은 접속', perms:d.guest }, ...d.users.map(u => ({ id:u.id, name:u.name, sub:u.id, perms:u.perms }))];
  const cell = (r, i, m) => `<td class="pc"><input type="checkbox" data-r="${i}" data-m="${m.k}" ${r.perms[m.k] ? 'checked' : ''} aria-label="${esc(r.name)} · ${esc(m.l)}"></td>`;

      <b>Management</b> 는 기본적으로 권한이 없습니다.${d.updatedAt ? ` · 마지막 변경: ${esc(d.updatedBy || '')} ${fmtTime(d.updatedAt)}` : ''}</p>
    <div class="permwrap"><table class="t perm"><thead><tr><th>사용자</th>${d.menus.map(m => `<th class="pc">${esc(m.l)}<label class="pall"><input type="checkbox" data-all="${m.k}"> 전체</label></th>`).join('')}</tr></thead>
    <tbody>${rows.map((r, i) => `<tr class="${i ? '' : 'guest'}"><td><b>${esc(r.name)}</b> <span class="muted">${esc(r.sub)}</span></td>${d.menus.map(m => cell(r, i, m)).join('')}</tr>`).join('')}</tbody></table></div>
    ${d.users.length ? '' : '<p class="muted">아직 개설된 계정이 없습니다.</p>'}</div>
    <div class="df"><button class="btn" data-close>취소</button><button class="btn pri" data-psave>저장</button></div>`, true);

    const body = { guest:get(0), users:Object.fromEntries(rows.slice(1).map((r, j) => [r.id, get(j + 1)])) };

/* ---------- 편집 폼 ---------- */
function suggestValues(key, f) { return [...new Set(DB.recs[key].map(r => r.fields[f]).filter(Boolean))].slice(0, 80); }
/* 첨부파일: 칸 값 = 줄마다 '파일명 [파일ID]' */
const parseFiles = v => String(v || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => { const m = l.match(/^(.*) \[(f[0-9a-z]+)\]$/); return m ? { name:m[1], id:m[2] } : { name:l, id:'' }; });
const fileUrl = (id, dl) => `${API_BASE}/api/files/${enc(id)}${dl ? '?download=1' : ''}`;
const fileIcon = n => /\.pdf$/i.test(n) ? '📕' : /\.pptx?$/i.test(n) ? '📙' : '📎';
function filesEditHtml(v) {
  return parseFiles(v).map((x, i) => `<div class="fitem"><span>${fileIcon(x.name)} ${x.id ? `<a href="${esc(fileUrl(x.id))}" target="_blank" rel="noopener">${esc(x.name)}</a>` : esc(x.name)}</span><button type="button" class="btn sm bad" data-frm="${i}" title="목록에서 빼기">✕</button></div>`).join('')
    || '<div class="muted">첨부된 파일이 없습니다</div>';
}
/* AI 요약: 이슈사항·종결현황·Remark 에서 핵심 문장을 뽑아 요약 (이 PC 안에서만 처리, 외부 전송 없음) */
function issueSummary(f) {
  const clean = t => String(t || '').replace(/~~[\s\S]*?~~/g, '').split(/\n+/).map(l => l.replace(/^\s*(?:[-•·*▶■□ㅇ※>]+|\(?\d+[.)]|[가-힣][.)])\s*/, '').trim()).filter(Boolean);
  const first = (t, n) => { const ls = clean(t); if (!ls.length) return ''; let s = ls.slice(0, n).join(' / '); return s.length > 90 ? s.slice(0, 89) + '…' : s; };
  const out = [];
  const iss = first(f['이슈사항'], 2); if (iss) out.push(`• 이슈: ${iss}`);
  const files = parseFiles(f['첨부파일']).length; if (files) out.push(`• 첨부: ${files}건`);
  out.push(`• 현황: ${f['종결현황'] || '미입력'}`);
  const rm = first(f['Remark'], 1); if (rm) out.push(`• 비고: ${rm}`);
  return out.join('\n');
}
function inputFor(s, c, val) {
  const v = val ?? '';
  if (c.file) return `<input type="hidden" data-f="${esc(c.f)}" value="${esc(v)}"><div class="flist" data-flist>${filesEditHtml(v)}</div>
    <div class="fup"><input type="file" data-fup accept=".pdf,.ppt,.pptx,application/pdf,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation" multiple><span class="muted">PDF·PPT(X), 파일당 30MB 이하</span></div>`;
  if (c.ai) return `<button type="button" class="btn sm aibtn" data-ai title="이슈사항·종결현황·Remark 내용을 요약해 아래 칸에 채웁니다 (수정 가능)">✨ AI 요약</button><textarea data-f="${esc(c.f)}" rows="${c.rows || 4}">${esc(v)}</textarea>`;
  if (c.long) return `<textarea data-f="${esc(c.f)}" rows="${c.rows || 4}"${guideOn(s, c) ? ' data-guide' : ''}>${esc(v)}</textarea>`;
  if (c.ttype) { const nv = normType(v); return `<select data-f="${esc(c.f)}"><option value="">— 유형을 고르세요 —</option>${TASK_TYPES.map(t => `<option ${nv === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}${nv && !TT[nv] ? `<option selected>${esc(nv)}</option>` : ''}</select>`; }
  if (c.closed) return `<select data-f="${esc(c.f)}"><option value="">진행 (기본)</option><option ${v === '진행' ? 'selected' : ''}>진행</option><option ${v === '종결' ? 'selected' : ''}>종결</option></select>`;
  if (c.endk) return `<select data-f="${esc(c.f)}"><option value="">자동 (종료일 있으면 기한)</option><option value="기한" ${v === '기한' ? 'selected' : ''}>📅 기한 — 종료일 있음, 종료 현황 추적</option><option value="상시" ${v === '상시' ? 'selected' : ''}>♾ 상시 — 종료일 없음, 추적 안 함</option></select>`;
  if (c.date) { const ok = !v || /^\d{4}-\d{2}-\d{2}$/.test(v); return `<input data-f="${esc(c.f)}" type="${ok ? 'date' : 'text'}" value="${esc(v)}">`; }
  if (c.pct) return `<input data-f="${esc(c.f)}" type="number" min="0" max="100" step="1" value="${esc(v)}" placeholder="0~100">`;
  const list = c.opts ? c.opts : (c.sug ? suggestValues(s.key, c.f) : null);
  const lid = list ? `dl_${s.key}_${c.f.replace(/\W/g, '')}` : '';
  return `<input data-f="${esc(c.f)}" value="${esc(v)}" ${list ? `list="${lid}"` : ''}>` + (list ? `<datalist id="${lid}">${list.map(o => `<option value="${esc(o)}">`).join('')}</datalist>` : '');
}
function mineBox(s, mine) {
  if (!mine) return '';
  const rows = Object.entries(flatten(mine)).filter(([, v]) => v).map(([k, v]) => `<div class="chg" style="grid-template-columns:120px 1fr"><b>${esc(k)}</b><pre class="a">${esc(v)}</pre></div>`).join('');
  return `<details style="margin-bottom:12px" open><summary><b>내가 입력했던 내용 (참고용 · 필요한 부분을 복사해 반영하세요)</b></summary>${rows}</details>`;
}

async function openEdit(key, id, { mine, preset } = {}) {
  if (GUEST) return toast('비회원은 보기만 할 수 있습니다 — 로그인하면 편집할 수 있습니다', true);
  const s = SHEET[key];
  if (s.special === 'matrix') return openStaffEdit(id, { mine, preset });
  const rec = id ? DB.recs[key].find(r => r.id === id) : null;
  const f = rec ? Object.fromEntries(Object.entries(rec.fields).map(([k, v]) => [k, typeof v === 'string' ? purgeStrike(v) : v])) : { ...(preset || {}) };   // 예전 ~~취소선~~ 은 입력란에 안 보임
  if (!rec) s.cols.forEach(c => { if (guideOn(s, c) && !f[c.f]) f[c.f] = guideTpl(c, f); });   // 행 추가: 작성 가이드 틀
  const hasGuide = s.cols.some(c => guideOn(s, c));
  const body = s.cols.map(c => {
    const full = c.long || c.file || c.f === s.title ? 'full' : '';
    if (guideOn(s, c)) return `<div class="full flab"><span class="glab">${esc(c.label || c.f)}${guideBar(c.f)}</span>${inputFor(s, c, f[c.f])}</div>`;
    if (c.endk) return `<label>${esc(c.label || c.f)}${inputFor(s, c, f[c.f])}<span class="muted" style="font-size:11px">종료일을 정할 수 없는 업무는 '상시' → 추적하지 않음</span></label>`;
    if (c.file || c.ai) return `<div class="${full} flab">${esc(c.label || c.f)}${inputFor(s, c, f[c.f])}</div>`;   // 안에 버튼이 있어 label 대신 div
    return `<label class="${full}">${esc(c.label || c.f)}${inputFor(s, c, f[c.f])}</label>`;
  }).join('');
  openDlg(dlg, `<form id="ef"><div class="dh"><span>${esc(s.label)} · ${rec ? '편집' : '행 추가'}</span><button type="button" class="btn sm" data-close>닫기</button></div>
    <div class="db">${rec ? `<p class="muted">최종 수정: ${esc(rec.meta.updatedBy)} · ${fmtTime(rec.meta.updatedAt)} (rev ${rec.meta.rev})</p>` : ''}
      ${mineBox(s, mine)}${hasGuide ? GUIDE_BOX : ''}<div class="fg">${body}</div></div>
    <div class="df"><button type="button" class="btn" data-close>취소</button><button class="btn pri" type="submit">저장</button></div></form>`, true);
  dlg.onclick = e => {
    if (e.target.closest('[data-close]')) return dlg.close();
    const rm = e.target.closest('[data-frm]');                // 첨부파일 목록에서 빼기 (서버 파일은 남음 → 이력에서 복원 가능)
    if (rm) { const h = $('input[type=hidden][data-f]', dlg), fs = parseFiles(h.value); fs.splice(+rm.dataset.frm, 1); h.value = fs.map(x => x.id ? `${x.name} [${x.id}]` : x.name).join('\n'); $('[data-flist]', dlg).innerHTML = filesEditHtml(h.value); return; }
    if (e.target.closest('[data-ai]')) {                      // AI 요약: 지금 입력된 내용 기준
      const cur = {}; dlg.querySelectorAll('[data-f]').forEach(el => cur[el.dataset.f] = el.value);
      const ta = $('textarea[data-f="AI 요약"]', dlg); ta.value = issueSummary(cur); ta.focus();
      toast('요약을 채웠습니다. 필요하면 고친 뒤 [저장]하세요');
    }
  };
  const tsel = key === 'task' && $('select[data-f="유형"]', dlg);   // 유형을 바꾸면, 아직 손대지 않은 진행 사항 틀도 그 유형 틀로
  if (tsel) tsel.onchange = () => { const ta = $('textarea[data-f="진행 사항"]', dlg); if (ta && (!ta.value.trim() || [GUIDE_TPL, ...Object.values(TASK_TPL)].includes(ta.value))) ta.value = TASK_TPL[tsel.value] || GUIDE_TPL; };
  const fup = $('[data-fup]', dlg);
  if (fup) fup.onchange = async () => {                      // 첨부파일 올리기: 서버 files/ 에 저장 후 목록에 추가
    if (!SERVER || OFFLINE) { fup.value = ''; return toast('첨부파일은 서버에 연결되어 있을 때만 올릴 수 있습니다', true); }
    const h = $('input[type=hidden][data-f]', dlg);
    for (const file of [...fup.files]) {
      if (!/\.(pdf|pptx?)$/i.test(file.name)) { toast(`${file.name}: PDF·PPT(X) 파일만 올릴 수 있습니다`, true); continue; }
      if (file.size > 30 * 1024 * 1024) { toast(`${file.name}: 30MB 이하만 올릴 수 있습니다`, true); continue; }
      try {
        toast(`${file.name} 올리는 중…`);
        const m = await api('PUT', 'files?name=' + enc(file.name), undefined, file);
        h.value = [...parseFiles(h.value).map(x => x.id ? `${x.name} [${x.id}]` : x.name), `${m.name} [${m.id}]`].join('\n');
        $('[data-flist]', dlg).innerHTML = filesEditHtml(h.value);
        toast(`${m.name} 첨부 완료 · [저장]해야 행에 반영됩니다`);
      } catch (er) { toast(`${file.name} 올리기 실패: ${er.message}`, true); }
    }
    fup.value = '';
  };
  $('#ef').onsubmit = async e => {
    e.preventDefault();
    const nf = {}; dlg.querySelectorAll('[data-f]').forEach(el => nf[el.dataset.f] = el.value.replace(/\r/g, '').trim());
    s.cols.forEach(c => { if (guideOn(s, c)) nf[c.f] = cleanGuide(nf[c.f]); });   // 내용 없는 글머리 줄 지우기
    s.cols.forEach(c => { if (nf[c.f]) nf[c.f] = purgeStrike(nf[c.f]); });   // 지운 내용은 그냥 지움 (예전 ~~취소선~~ 도 저장 때 정리) · 추가만 파란 글씨
    if (key === 'task' && !nf['유형']) return toast('유형을 고르세요 (일반업무 / 표준화 담당 / To Do List / 기술공유 / 그룹장 요청 사항)', true);
    if (!nf[s.title] && key !== 'unit') return toast(`'${s.cols.find(c => c.f === s.title)?.label || s.title}' 을(를) 입력하세요`, true);
    await submitRecord(key, id, rec, nf, mine);
  };
}

async function submitRecord(key, id, rec, nf, mine) {
  try {
    if (!rec) {
      // 그룹 헤더 시트: 같은 그룹의 마지막 행 바로 뒤에 삽입
      const s = SHEET[key]; let order;
      if (key === 'perform' || key === 'bid') order = Math.min(0, ...DB.recs[key].map(r => r.order)) - 10;   // 수행·입찰: 새 행은 맨 위
      else if (s.group && nf[s.group]) {
        const all = DB.recs[key], same = all.filter(r => r.fields[s.group] === nf[s.group]);
        if (same.length) { const mx = Math.max(...same.map(r => r.order)); const nx = all.map(r => r.order).filter(o => o > mx).sort((a, b) => a - b)[0]; order = nx == null ? mx + 10 : (mx + nx) / 2; }
      }
      await createRecord(key, nf, { order }); dlg.close(); toast('추가되었습니다'); await loadAll(); return render();
    }
    const r = await saveEdit(key, id, nf, rec.meta.rev);
    await afterSave(r, key, id, nf);
  } catch (e) { toast('저장 실패: ' + e.message, true); }
}

async function afterSave(r, key, id, nf) {
  if (r.status === 'ok') { dlg.close(); toast('저장되었습니다'); await loadAll(); return render(); }
  if (r.status === 'nochange') { dlg.close(); return toast('변경된 내용이 없습니다'); }
  if (r.status === 'deleted') {
    const c = await ask('이미 삭제된 행', '다른 사용자가 이 행을 삭제(휴지통 이동)했습니다.', [{ id:'new', label:'내 내용으로 새 행 저장', cls:'pri' }, { id:'no', label:'닫기' }]);
    if (c === 'new') { await createRecord(key, nf, { id }); dlg.close(); toast('새 행으로 저장했습니다'); await loadAll(); render(); }
    return;
  }
  // 충돌
  const cur = r.cur, a = flatten(cur.fields), b = flatten(nf);
  const diffs = Object.keys({ ...a, ...b }).filter(k => (a[k] ?? '') !== (b[k] ?? ''));
  const tbl = diffs.map(k => `<div class="chg"><b>${esc(k)}</b><pre class="b">${esc(a[k] ?? '')}</pre><pre class="a">${esc(b[k] ?? '')}</pre></div>`).join('');
  const c = await ask('⚠ 다른 사람이 먼저 수정했습니다',
    `<p><b>${esc(cur.meta.updatedBy)}</b>님이 <b>${fmtTime(cur.meta.updatedAt)}</b>에 이 행을 먼저 수정했습니다.</p>
     <div class="chg" style="font-weight:700"><span></span><span>최신 저장 내용</span><span>내 입력</span></div>${tbl}`,
    [{ id:'over', label:'내 것으로 덮어쓰기', cls:'pri' }, { id:'latest', label:'최신 내용 불러오기' }, { id:'no', label:'취소' }]);
  if (c === 'over') {
    const rr = await saveEdit(key, id, nf, cur.meta.rev, { force:true });
    if (rr.status === 'ok' || rr.status === 'nochange') { dlg.close(); toast('덮어쓰기 저장되었습니다 (이전 내용은 이력에서 복구 가능)'); await loadAll(); render(); }
    else toast('저장 실패', true);
  } else if (c === 'latest') {
    await loadAll(); dlg.close(); await openEdit(key, id, { mine:nf }); render();
  }
}

/* ---------- 투입인력 편집 ---------- */
function colOptions(sel) {
  const g = k => DB.cols.filter(c => c.kind === k).map(c => `<option value="${esc(c.id)}" ${c.id === sel ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  return `<option value="">PJT 선택</option><optgroup label="수행">${g('수행')}</optgroup><optgroup label="입찰">${g('입찰')}</optgroup><optgroup label="기타">${g('기타')}</optgroup>`;
}
const assignRowHtml = (cid, a) => `<div class="arow"><select data-c>${colOptions(cid)}</select><input data-p type="number" min="0" max="100" value="${esc(a?.pct ?? '')}" placeholder="%"><select data-r><option ${a?.role !== 'LE' ? 'selected' : ''}>RE</option><option ${a?.role === 'LE' ? 'selected' : ''}>LE</option></select><button type="button" class="btn sm bad" data-rm>✕</button></div>`;

/* ---------- 이력 ---------- */
const ACT = { create:['추가','new'], update:['수정',''], overwrite:['덮어쓰기','del'], delete:['삭제','del'], restore:['복구','new'], purge:['영구삭제','del'] };
async function openHistory(key, id) {
  if (offlineGuard('이력 조회')) return;
  openDlg(dlg, `<div class="dh"><span>변경 이력</span><button class="btn sm" data-close>닫기</button></div><div class="db"><div class="empty">불러오는 중…</div></div>`, true);
  dlg.onclick = e => { if (e.target.closest('[data-close]')) dlg.close(); const b = e.target.closest('[data-restore]'); if (b) doRestore(key, id, entries[+b.dataset.restore]); };
  let entries = [];
  try {
    if (SERVER) entries = await api('GET', `history/${key}/${enc(id)}`);
    else { const hd = await sub(['history', key, id]);
    entries = (await Promise.all((await listFiles(hd)).map(async ([n, h]) => { try { return { n, ...JSON.parse(await (await h.getFile()).text()) }; } catch { return null; } }))).filter(Boolean).sort((a, b) => a.at < b.at ? 1 : -1); }
  } catch (_) {}
  const keepFrom = new Date(Date.now() - HISTORY_DAYS * 864e5).toISOString();
  entries = entries.filter(e => (e.at || '') >= keepFrom);       // 정리 전이라도 7일 지난 이력은 표시하지 않음
  const note = `<p class="muted" style="margin-top:0">🕒 수정 이력은 최근 <b>${HISTORY_DAYS}일</b>치만 보관되며, ${HISTORY_DAYS}일이 지난 이력은 자동 삭제됩니다.</p>`;
  const body = note + (!entries.length ? '<div class="empty">최근 7일간 저장된 이력이 없습니다</div>' : entries.map((e, i) => {
    const [lbl, cls] = ACT[e.action] || [e.action, ''];
    const chg = (e.changed || []).map(p => { const a = flatten(e.before || {})[p], b = flatten(e.after || {})[p]; return `<div class="chg"><b>${esc(p)}</b><pre class="b">${esc(a ?? '')}</pre><pre class="a">${esc(b ?? '')}</pre></div>`; }).join('');
    return `<div class="hist"><div class="hh"><span class="tag ${cls}">${lbl}</span><b>${esc(e.by)}</b><span class="muted">${fmtTime(e.at)}</span>${e.after && !noEdit() ? `<button class="btn sm" data-restore="${i}" style="margin-left:auto">이 시점 내용으로 되돌리기</button>` : ''}</div>${chg || (e.action === 'delete' ? '<span class="muted">휴지통으로 이동</span>' : '')}</div>`;
  }).join(''));
  $('.db', dlg).innerHTML = body;
}
async function doRestore(key, id, e) {
  if (!e?.after) return;
  if (await ask('되돌리기', `<b>${esc(e.by)}</b> · ${fmtTime(e.at)} 시점의 내용으로 되돌립니다.`, [{ id:'ok', label:'되돌리기', cls:'pri' }, { id:'no', label:'취소' }]) !== 'ok') return;
  try {
    const cur = SERVER ? await api('GET', `rec/${key}/${enc(id)}`).catch(() => null) : await readJSON(await sub(['data', key]), id + '.json');
    if (!cur) return toast('삭제된 행입니다. 휴지통에서 복구하세요', true);
    const r = await saveEdit(key, id, e.after, cur.meta.rev, { action:'restore' });
    toast(r.status === 'ok' ? '되돌렸습니다' : '변경된 내용이 없습니다'); dlg.close(); await loadAll(); render();
  } catch (er) { toast('실패: ' + er.message, true); }
}

/* ---------- 삭제 / 휴지통 ---------- */
async function doDelete(key, id) {
  const rec = DB.recs[key].find(r => r.id === id); if (!rec) return;
  if (await ask('행 삭제', `<b>${esc(recLabel(key, rec.fields))}</b> 행을 삭제합니다.<br><span class="muted">휴지통으로 이동되며 언제든 복구할 수 있습니다.</span>`, [{ id:'ok', label:'휴지통으로 이동', cls:'pri' }, { id:'no', label:'취소' }]) !== 'ok') return;
  try { await deleteRecord(key, id); toast('휴지통으로 이동했습니다'); await loadAll(); render(); } catch (e) { toast('삭제 실패: ' + e.message, true); }
}
async function openTrash() {
  if (offlineGuard('휴지통 조회')) return;
  openDlg(dlg, `<div class="dh"><span>휴지통</span><button class="btn sm" data-close>닫기</button></div><div class="db"><div class="empty">불러오는 중…</div></div>`, true);
  let items = [];
  if (SERVER) { try { items = await api('GET', 'trash'); } catch (e) { $('.db', dlg).innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; } }
  else for (const s of SHEETS) {
    const td = await sub(['trash', s.key]);
    for (const [, h] of await listFiles(td)) { try { items.push({ key:s.key, ...JSON.parse(await (await h.getFile()).text()) }); } catch (_) {} }
  }
  items.sort((a, b) => (a.meta.deletedAt < b.meta.deletedAt ? 1 : -1));
  const canPurge = SERVER && ADMIN;                      // 영구삭제: 서버 PC(관리자)에서만
  $('.db', dlg).innerHTML = !items.length ? '<div class="empty">휴지통이 비어 있습니다</div>' : `<table class="t"><thead><tr><th>시트</th><th>항목</th><th>삭제자</th><th>삭제 시각</th><th></th></tr></thead><tbody>${items.map((r, i) => `<tr><td>${esc(SHEET[r.key].label)}</td><td>${esc(recLabel(r.key, r.fields))}</td><td>${esc(r.meta.deletedBy)}</td><td>${fmtTime(r.meta.deletedAt)}</td><td style="white-space:nowrap">${GUEST ? '' : `<button class="btn sm pri" data-rs="${i}">복구</button>`}${canPurge ? ` <button class="btn sm bad" data-purge="${i}">영구삭제</button>` : ''}</td></tr>`).join('')}</tbody></table>`;
  dlg.onclick = async e => {
    if (e.target.closest('[data-close]')) return dlg.close();
    const pg = e.target.closest('[data-purge]');
    if (pg) {
      const it = items[+pg.dataset.purge];
      if (await ask('영구삭제', `<b>${esc(recLabel(it.key, it.fields))}</b> 을(를) 영구삭제합니다.<br><span class="muted">복구할 수 없습니다 (매일 자동 백업 backup/날짜.zip 에는 남아 있습니다).</span>`, [{ id:'ok', label:'영구삭제', cls:'pri' }, { id:'no', label:'취소' }]) !== 'ok') return;
      try { await api('DELETE', `trash/${it.key}/${enc(it.id)}?by=${enc(user)}`); toast('영구삭제했습니다'); openTrash(); } catch (er) { toast('영구삭제 실패: ' + er.message, true); }
      return;
    }
    const b = e.target.closest('[data-rs]'); if (!b) return;
    const it = items[+b.dataset.rs];
    try {
      const r = await restoreFromTrash(it.key, it.id);
      if (r === 'exists') return toast('같은 ID의 행이 이미 있어 복구할 수 없습니다', true);
      toast('복구되었습니다'); await loadAll(); render(); openTrash();
    } catch (er) { toast('복구 실패: ' + er.message, true); }
  };
}

/* =====================================================================
 *  렌더링 : 공통
 * ===================================================================== */
/* =====================================================================
 *  익명게시판 — 실명(user)은 절대 보내지 않음. 본인 확인은 글/댓글마다 만든 임의 토큰(이 브라우저에만 저장)
 * ===================================================================== */
const LS_BOARD = 'dept-board-tokens', LS_BNICK = 'dept-board-nick';
let BT = {}; try { BT = JSON.parse(localStorage.getItem(LS_BOARD) || '{}'); } catch (_) {}
const saveBT = () => { try { localStorage.setItem(LS_BOARD, JSON.stringify(BT)); } catch (_) {} };
const rndToken = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
async function tokenHash(t) {
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('dept-board:' + t));
  return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join('');
}
const boardNick = (anon, nick) => { nick = flat(nick).slice(0, 20); return anon || !nick ? '익명' : nick; };
const BKINDS = { '블라블라':{ icon:'💬', color:'#5b6b9a' }, '회식제안':{ icon:'🍻', color:'#e8730c' }, 'VOC':{ icon:'📣', color:'#d6336c' } };
const bKind = p => BKINDS[p.kind] ? p.kind : '블라블라';                 // 유형 없는 예전 글 = 블라블라
// 작성자 방식: anon(익명) / nick(닉네임) / real(실명 — 서버가 로그인 계정 본명으로 기록)
const bSend = ({ mode, nick }) => ({ anon:mode === 'anon', nick:mode === 'nick' ? nick : '', real:mode === 'real' });
const bPublic = p => ({ ...p, tokenHash:undefined, comments:(p.comments || []).map(c => ({ ...c, tokenHash:undefined })) });
async function bFile(pid) { const d = await sub(['board']), p = await readJSON(d, pid + '.json'); if (!p) throw new Error('삭제된 글입니다'); return [d, p]; }
const bOnline = () => { if (OFFLINE) throw new Error('오프라인에서는 게시판에 글·댓글을 쓸 수 없습니다 (보기만 가능)'); needLogin(); };
async function bOwner(rec, token) { if (!token || await tokenHash(token) !== rec.tokenHash) throw new Error('이 브라우저에서 작성한 글/댓글만 수정·삭제할 수 있습니다'); }

const Board = {
  async list() {
    if (OFFLINE) return DB.board || [];
    if (SERVER) return api('GET', 'board');
    const d = await sub(['board']), out = [];
    for (const [, h] of await listFiles(d)) { try { out.push(bPublic(JSON.parse(await (await h.getFile()).text()))); } catch (_) {} }
    return out.sort((a, b) => a.createdAt < b.createdAt ? 1 : -1);
  },
  async create({ title, body, kind, mode, nick }) {
    bOnline(); const token = rndToken(); let p; const a = bSend({ mode, nick });
    if (SERVER) p = await api('POST', 'board', { title, body, kind, ...a, token });
    else {
      const now = stamp(), id = 'b' + Date.now().toString(16) + rndToken().slice(0, 6);
      p = { id, title, body, kind, real:a.real, nick:a.real ? user : boardNick(a.anon, a.nick), createdAt:now, updatedAt:now, tokenHash:await tokenHash(token), comments:[] };
      await writeJSON(await sub(['board']), id + '.json', p);
    }
    BT[p.id] = token; saveBT(); return p;
  },
  async update(pid, { title, body, kind, mode, nick }) {
    bOnline(); const token = BT[pid], a = bSend({ mode, nick });
    if (SERVER) return api('PUT', 'board/' + enc(pid), { title, body, kind, ...a, token });
    const [d, p] = await bFile(pid); await bOwner(p, token);
    Object.assign(p, { title, body, kind, real:a.real, nick:a.real ? user : boardNick(a.anon, a.nick), updatedAt:stamp() }); await writeJSON(d, pid + '.json', p);
  },
  async remove(pid) {
    bOnline(); const token = BT[pid];
    if (SERVER) await api('DELETE', 'board/' + enc(pid), { token });
    else { const [d, p] = await bFile(pid); await bOwner(p, token); await d.removeEntry(pid + '.json'); }
    delete BT[pid]; saveBT();
  },
  async addComment(pid, { body, mode, nick }) {
    bOnline(); const token = rndToken(); let cid; const a = bSend({ mode, nick });
    if (SERVER) { const p = await api('POST', `board/${enc(pid)}/comments`, { body, ...a, token }); cid = p.comments[p.comments.length - 1].id; }
    else {
      const [d, p] = await bFile(pid); cid = 'c' + Date.now().toString(16) + rndToken().slice(0, 4);
      (p.comments = p.comments || []).push({ id:cid, body, real:a.real, nick:a.real ? user : boardNick(a.anon, a.nick), createdAt:stamp(), tokenHash:await tokenHash(token) });
      await writeJSON(d, pid + '.json', p);
    }
    BT['c:' + cid] = token; saveBT();
  },
  async removeComment(pid, cid) {
    bOnline(); const token = BT['c:' + cid];
    if (SERVER) await api('DELETE', `board/${enc(pid)}/comments/${enc(cid)}`, { token });
    else {
      const [d, p] = await bFile(pid), c = (p.comments || []).find(x => x.id === cid);
      if (!c) throw new Error('삭제된 댓글입니다');

  const nx = bt[ty] || { f:{}, owner:'', mine:false, q:'', done:'', closed:'', wst:'', cf:{}, sort:null };

function leaveCard(list, idx, plabel) {
  const ppl = new Map();
  for (const u of list) for (const r of u.rows) {
    if (tsClass(r, idx).kind !== 'leave') continue;
    const [y, m] = u.month.split('-').map(Number);
    for (const [d, h] of Object.entries(r.days || {})) {
      if (!(h > 0)) continue;
      const o = ppl.get(u.person) || ppl.set(u.person, { name:u.person, tot:0, days:new Map() }).get(u.person), k = `${y}-${pad(m)}-${pad(+d)}`;

    }
  }
  const rows = [...ppl.values()].sort((a, b) => b.tot - a.tot || a.name.localeCompare(b.name, 'ko'));
  const tot = rows.reduce((a, o) => a + o.tot, 0);
  const chip = ([k, x]) => { const dt = new Date(k); return `<span class="lvd ${x.h >= 8 ? 'full' : ''}" title="${esc(k)} (${WD[dt.getDay()]}) ${fmtH(x.h)}h${x.what.size ? ' · ' + esc([...x.what].join(', ')) : ''}"><b>${dt.getMonth() + 1}/${dt.getDate()}</b><small>${WD[dt.getDay()]}</small> ${fmtH(x.h)}${x.what.size ? `<em>${esc([...x.what].join(', '))}</em>` : ''}</span>`; };

const XL = {                       // 기존 엑셀 컬럼 순서 / 구분 행

const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

  for (const f of files) {
    const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dt, true); lh.setUint16(12, dd, true); lh.setUint32(14, crc, true); lh.setUint32(18, sz, true); lh.setUint32(22, sz, true);
    lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nm, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dt, true); ch.setUint16(14, dd, true); ch.setUint32(16, crc, true); ch.setUint32(20, sz, true); ch.setUint32(24, sz, true);
    ch.setUint16(28, nm.length, true); ch.setUint32(42, off, true);

const xesc = s => String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

  if (typeof v === 'number') return `<c r="${ref}" s="${s}"><v>${v}</v></c>`;
  if (v === '' || v == null) return `<c r="${ref}" s="${s}"/>`;

function xlSheets() {

          { v:f['과제+기타업무(%)'] === '' || f['과제+기타업무(%)'] == null ? '' : num(f['과제+기타업무(%)']), s:h.has('과제+기타업무(%)') ? ST.CHGBC : ST.CTR }, txt('Remarks')]);

      <p>서버 <b>${esc(serverUrl())}</b> 에 연결하지 못했고, 이 PC에 보관된 데이터도 아직 없습니다.</p>${BLOCKED ? `<p class="banner bad" style="display:block">⛔ ${esc(BLOCKED)}</p>` : ''}
      <p class="muted">서버에 한 번이라도 연결되면 그 데이터를 이 PC에 보관해 두었다가, 다음부터는 서버가 꺼져 있어도 오프라인으로 열 수 있습니다.</p>
      <button class="btn pri" id="btnRetry">다시 시도</button> <button class="btn" id="btnSrv2">서버 주소 변경</button> <button class="btn" id="btnLocalMode">폴더 모드로 열기</button></div>`;
    $('#btnRetry').onclick = () => location.reload();
    $('#btnSrv2').onclick = () => setServerUrl();
    $('#btnLocalMode').onclick = () => initFolderMode();
    return;
  }
  await initFolderMode();
})();
async function startOnline() {
  user = ''; await authStart();                             // 서버 모드: 로그인 / 계정 개설 / 비회원
  await refreshPerms();
  try { await loadAll(); } catch (e) { toast('불러오기 실패: ' + e.message, true); }
  render();
  showMyTodo();
  presenceStart();
  if (QUEUE.length) await trySync(false);                   // 지난번에 못 올린 오프라인 수정이 있으면 '덮어쓸까요?' 후 업로드
  askUpdate();                                             // 새 버전이 있으면 '교체하세요'
}
async function initFolderMode() {
  render();
  if (!('showDirectoryPicker' in window)) { $('#content').innerHTML = '<div class="card welcome"><h2>지원하지 않는 브라우저입니다</h2><p>File System Access API 를 지원하는 <b>Chrome 또는 Edge (데스크톱)</b> 에서 열어주세요.</p></div>'; $('#btnFolder').disabled = true; return; }
  if (!user) { await askName(true); render(); }
  try {
    const h = await kv('readonly', s => s.get('root'));
    if (h) { if (await h.queryPermission({ mode:'readwrite' }) === 'granted') await useRoot(h); else { pending = h; render(); } }
  } catch (_) {}
}
})();
</script>
