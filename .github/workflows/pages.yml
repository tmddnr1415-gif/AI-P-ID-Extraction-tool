# web/ 를 GitHub Pages로 올린다.
#
# 켜는 법 (한 번만): 저장소 Settings → Pages → Source 를 "GitHub Actions" 로.
# 그 뒤로는 이 브랜치에 push 할 때마다 자동으로 다시 올라간다.
#
# 워크플로가 대신 켜려면 Pages 사이트를 만들어야 하는데, Actions 토큰에는 그 권한이
# 없다(Create Pages site → Resource not accessible by integration). 저장소 관리자
# 권한이 필요해서 사람이 한 번 눌러야 한다.
#
# 주소: https://tmddnr1415-gif.github.io/AI-P-ID-Extraction-tool/
#
# 올라가는 것은 브라우저에서 도는 앱뿐이다. API 키는 쓰는 사람이 자기 브라우저에
# 넣고, 도면 PDF와 Excel 템플릿도 브라우저 밖으로 나가지 않는다.
name: Pages

on:
  push:
    branches: [claude/pid-review-claude-api-app-k9o4lh]
    paths:
      - 'pid-instrument-tool/web/**'
      - 'pid-instrument-tool/rules/**'
      - 'pid-instrument-tool/scripts/build_web.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 것을 끊지 않고 기다린다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # rules/*.md → web/rules.gen.js, 그리고 단일 파일 standalone.html
      - name: 규칙 번들 다시 만들기
        run: python3 scripts/build_web.py
        working-directory: pid-instrument-tool

      - name: 올릴 파일 모으기
        run: |
          mkdir -p _site
          cp -r pid-instrument-tool/web/. _site/
          touch _site/.nojekyll        # 밑줄로 시작하는 경로도 그대로 서빙
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
