# P&ID Instrument List — 공유 링크 서버
#
# 배포:
#   npm install -g wrangler
#   wrangler login
#   python3 ../scripts/build_server.py        # public/ 과 src/template.b64.js 생성
#   wrangler secret put ANTHROPIC_API_KEY     # Anthropic API 키
#   wrangler secret put APP_PASSWORD          # 링크를 공유받은 사람이 넣을 비밀번호
#   wrangler secret put SESSION_SECRET        # 아무 긴 임의 문자열
#   wrangler deploy
#
# 배포가 끝나면 https://<name>.<계정>.workers.dev 주소가 나옵니다.

name = "pid-instrument-list"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# 서버가 정하는 판독 설정. 브라우저에서 바꿀 수 없습니다.
MODEL = "claude-opus-5"
EFFORT = "high"
MAX_TOKENS = "32000"
TILES = "3x2"
DPI = "200"
DAILY_LIMIT = "200"      # 하루 판독 가능한 도면 수 (KV를 연결했을 때만 적용)

# 사용량 제한을 켜려면 KV 네임스페이스를 만들어 아래 주석을 풀고 id를 채우세요.
#   wrangler kv namespace create RATE
# [[kv_namespaces]]
# binding = "RATE"
# id = "여기에_붙여넣기"
