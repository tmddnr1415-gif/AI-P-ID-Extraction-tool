<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P&amp;ID 계기·밸브 리스트 추출</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<div id="drop" class="drop">
  <div class="drop-inner">
    <h1>P&amp;ID PDF 를 여기에 놓으세요</h1>

    <!-- 프로젝트 -> 리비전 -> PDF.  개정 대조는 프로젝트에 묶인 분석에서만
         일어난다; 프로젝트를 고르지 않으면 예전과 똑같이 한 번짜리 분석이다. -->
    <div id="proj" class="proj">
      <div class="proj-row">
        <label for="proj-pick">프로젝트</label>
        <select id="proj-pick"></select>
        <button id="proj-new-btn" type="button">새 프로젝트</button>
      </div>
      <div id="proj-new" class="proj-row hidden">
        <label for="proj-name">이름</label>
        <input id="proj-name" type="text" placeholder="예: AL NOUF1" size="24">
        <button id="proj-save" type="button">만들기</button>
        <button id="proj-cancel" type="button">취소</button>
      </div>
      <div id="proj-rev" class="proj-row hidden">
        <label for="rev-base">비교 대상</label>
        <select id="rev-base"></select>
        <span id="rev-note" class="muted"></span>
      </div>
      <p id="proj-msg" class="muted"></p>
    </div>

    <p>또는 <label class="link" for="file">파일 선택</label></p>
    <input id="file" type="file" accept="application/pdf" hidden>
    <p class="muted" id="drop-note">분석에는 도면 58장 기준 약 7분이 걸립니다.</p>
    <p id="audit-line" class="muted"></p>
    <div id="joblist" class="joblist"></div>
  </div>
</div>

<div id="progress" class="progress hidden">
  <div class="progress-inner">
    <h2 id="prog-title">분석 중</h2>
    <div class="bar"><div id="bar-fill"></div></div>
    <p id="prog-msg" class="muted"></p>
    <!-- Shown only when an analysis fails.  Without these the failure screen has
         no way out at all: #drop and #main are both hidden, so the only route
         back was editing the URL by hand. -->
    <p id="prog-hint" class="muted hidden"></p>
    <div id="prog-actions" class="prog-actions hidden">
      <button id="prog-home">첫 화면으로</button>
    </div>
    <div id="prog-jobs" class="joblist hidden"></div>
  </div>
</div>

<main id="main" class="hidden">
  <header>
    <span class="job" id="job-name"></span>
    <!-- 무엇과 비교했는지.  결과만 보고 알 수 없으면 안 된다. -->
    <span id="rev-label" class="rev-label hidden"></span>
    <nav id="tabs"></nav>
    <span class="spacer"></span>
    <span id="review-badge" class="badge"></span>
    <span id="fb-badge" class="badge" title="수정 이력 — 규칙 개선용으로 저장됩니다"></span>
    <details id="scope" class="scope">
      <summary>출력 범위</summary>
      <!-- Filled from what the analysis actually produced: the drawings, the
           origins present, and the review hold.  See app.js buildScope(). -->
      <div class="scope-body"></div>
    </details>
    <label class="gate">
      <input type="checkbox" id="gate-check">
      전체 검토 완료
    </label>
    <button id="excel" disabled>Excel 출력</button>
    <details id="rules" class="scope">
      <summary>적용 규칙</summary>
      <div class="scope-body" id="rules-body"></div>
    </details>
    <details id="tmpl" class="scope">
      <summary>템플릿</summary>
      <div class="scope-body" id="tmpl-body"></div>
    </details>
    <button id="report-list" class="ghost" title="접수한 오류 신고">신고 <span id="report-n" class="badge-n">0</span></button>
    <button id="diag" class="ghost" title="이 PC 안에서만 만들어지는 진단 파일">진단 내보내기</button>
    <button id="reanalyse" class="ghost">재분석</button>
  </header>

  <div id="split">
    <section id="left">
      <div class="toolbar">
        <select id="page-select"></select>
        <button data-z="-1">&minus;</button>
        <button data-z="0">맞춤</button>
        <button data-z="1">+</button>
        <span id="page-note" class="muted"></span>
      </div>
      <!-- `tabindex` so the viewer can hold focus: Ctrl +/-/0 are handled on this
           element, which is how they stay out of the way while the reviewer is
           typing in a cell or in the filter box.  See app.js zoomBy(). -->
      <div id="stage" tabindex="0"><div id="wrap"><img id="sheet" alt=""><svg id="ov"></svg></div></div>
      <!-- Shown while the reviewer is pointing at where a missed item belongs. -->
      <div id="pick-note" class="picknote hidden">놓친 항목의 위치를 도면에서 클릭하세요
        <button id="pick-cancel" class="ghost mini">위치 없이 추가</button></div>
      <!-- Always on the drawing, so a colour never has to be remembered.  It
           sits outside #stage because #stage is the scroll container, and an
           absolutely positioned child of it scrolls away with the sheet.
           Each row toggles its own layer; see app.js buildOverlayLegend(). -->
      <div id="ovlegend">
        <div class="ovl-head">
          <b>표시</b>
          <label class="ovl-mode"><input type="checkbox" id="ovl-bytab">탭 색으로</label>
        </div>
        <div id="ovl-items"></div>
        <!-- The selected row's pipe, in four separable layers.  Most traces on
             this document fail, so the layer that matters most is the last one:
             where the run stops.  See app.js drawTrace(). -->
        <div class="ovl-head"><b>선택한 계기의 배관</b></div>
        <label class="ovl-row" title="선택한 행이 물려 있는 배관 전체">
          <input type="checkbox" class="ovl-tr" value="pipe" checked>
          <span class="swatch" style="background:#5ac8fa"></span>
          <span class="ovl-label">배관 라인</span>
        </label>
        <label class="ovl-row" title="FROM 으로 적힌 쪽 — 도면의 낱말이 정한 방향">
          <input type="checkbox" class="ovl-tr" value="up" checked>
          <span class="swatch" style="background:#30d158"></span>
          <span class="ovl-label">upstream</span>
        </label>
        <label class="ovl-row" title="TO 로 적힌 쪽 — 도면의 낱말이 정한 방향">
          <input type="checkbox" class="ovl-tr" value="down" checked>
          <span class="swatch" style="background:#ffd60a"></span>
          <span class="ovl-label">downstream</span>
        </label>
        <label class="ovl-row" title="추적이 끊긴 지점 — 도면에서 직접 확인할 곳">
          <input type="checkbox" class="ovl-tr" value="break" checked>
          <span class="swatch" style="background:#ff375f"></span>
          <span class="ovl-label">끊긴 지점</span>
        </label>
        <div class="ovl-foot muted">실선 계장 · 파선 밸브</div>
      </div>
    </section>

    <section id="right">
      <!-- Always visible: what is left to decide, by the axis it is decided on.
           Filled by app.js renderReviewPanel(). -->
      <div id="review-panel" class="review-panel"></div>
      <div id="review-codes" class="review-codes hidden"></div>
      <div class="toolbar">
        <input id="filter" type="search"
               placeholder="검색 — 모든 열 (도면번호 · Type · System · Description …)">
        <select id="origin-filter"><option value="">귀속 전체</option></select>
        <label class="only-review"><input id="only-review" type="checkbox"> 검토 필요만</label>
        <!-- 개정이 붙은 분석에서만 보인다.  824행에서 바뀐 몇 행을 찾는 일이
             개정 검토의 전부이므로, 그 몇 행으로 좁히는 스위치가 필요하다. -->
        <label class="only-review hidden" id="only-changed-wrap">
          <input id="only-changed" type="checkbox"> 개정된 행만</label>
        <button id="row-add" class="ghost" title="빈 행 추가">＋행</button>
        <button id="row-copy" class="ghost" title="선택 행 복사">복사</button>
        <button id="row-delete" class="ghost" title="선택 행 삭제">삭제</button>
        <span id="count" class="muted"></span>
      </div>
      <!-- The filters actually in force, each removable on its own. -->
      <div id="chips" class="chips hidden"></div>
      <!-- Set by app.js: why the grid is empty, and what is still unanswered. -->
      <p id="empty-note" class="muted empty-note hidden"></p>
      <p id="open-review" class="muted open-review hidden"></p>
      <!-- Filled by app.js renderDescriptionGroups(); only shown on 검토필요. -->
      <div id="desc-groups" class="desc-groups hidden"></div>
      <div id="gridwrap">
        <table id="grid">
          <thead><tr id="head"></tr></thead>
          <tbody id="body"></tbody>
        </table>
      </div>
      <!-- 삭제 후보.  자동 확정하지 않으므로 확인 버튼과 근거가 같이 있다. -->
      <div id="del-cands" class="del-cands hidden"></div>
      <div id="evidence" class="evidence">
        <p class="muted">행을 클릭하면 판정 근거가 여기에 표시됩니다.</p>
      </div>
    </section>
  </div>
</main>

<!-- The column-filter dropdown: one panel, moved and refilled per column.  It
     lives here rather than inside a <th> so it can overflow the grid's own
     scroll container.  See app.js openColumnMenu(). -->
<div id="colmenu" class="colmenu hidden"></div>

<!-- One dialog for both report flows - a row's 신고 button and a right-click on
     the drawing - because they file the same record and asking two different
     questions for one record is how the two drift apart. -->
<div id="modal" class="modal hidden">
  <div class="modal-box" role="dialog" aria-modal="true">
    <h3 id="modal-title">오류 신고</h3>
    <div id="modal-body"></div>
  </div>
</div>

<!-- Which build this is.  A report is only usable if the exe it came from can be
     named, and this is where a person reads it off. -->
<footer id="build" class="build"><span id="build-text" class="muted"></span></footer>

<script src="/static/app.js"></script>
</body>
</html>
