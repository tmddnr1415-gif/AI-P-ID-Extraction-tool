<style>
:root{--navy:#141b3d;--navy2:#1f2a5c;--blue:#3563e9;--accent:#ffcc33;--cream:#f6f3ea}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0d1230;font-family:'Noto Sans KR',sans-serif}
#stage{position:absolute;inset:0;z-index:0;overflow:hidden;background:#0d1230}
.layer{position:absolute;inset:0;opacity:0}
.shot{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.shot img{display:block}
.hl{position:absolute;border:solid var(--accent);border-radius:6px;box-shadow:0 0 0 9999px rgba(8,12,32,.0);opacity:0}
iframe.live{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;background:#fff}
/* cards */
.card{display:flex;flex-direction:column;justify-content:center;padding:0 160px;color:#fff;
  background:radial-gradient(1200px 700px at 80% 20%,#2c3d8f 0%,#141b3d 55%,#0b1029 100%)}
.card .kicker{font-size:30px;letter-spacing:.3em;color:#9fb3ff;font-weight:700}
.card h1{font-size:96px;font-weight:900;line-height:1.15;margin-top:18px}
.card h1 em{font-style:normal;color:var(--accent)}
.card p{font-size:38px;color:#d7defb;margin-top:28px;line-height:1.5;font-weight:400}
.card .num{font-size:220px;font-weight:900;color:rgba(255,255,255,.08);position:absolute;right:140px;bottom:60px;line-height:1}
.mods{display:flex;gap:26px;margin-top:64px}
.mod{border:2px solid rgba(255,255,255,.25);border-radius:18px;padding:22px 30px;min-width:300px;background:rgba(255,255,255,.04)}
.mod b{display:block;font-size:40px;font-weight:900}
.mod span{display:block;font-size:24px;color:#b9c5f5;margin-top:6px}
.mod i{font-style:normal;font-size:22px;color:var(--accent);font-weight:700;letter-spacing:.15em}
/* overlay */
#cap{position:absolute;z-index:10;left:50%;bottom:64px;transform:translateX(-50%);max-width:1640px;
  background:rgba(13,18,48,.9);color:#fff;border-radius:18px;padding:20px 36px 22px 36px;
  font-size:36px;font-weight:700;line-height:1.4;box-shadow:0 12px 40px rgba(0,0,0,.35);
  display:flex;gap:22px;align-items:center;opacity:0;border:1px solid rgba(255,255,255,.12)}
#cap .tag{flex:none;background:var(--blue);color:#fff;font-size:24px;padding:6px 16px;border-radius:10px;letter-spacing:.06em;font-weight:900}
#cap .txt small{display:block;font-size:26px;font-weight:400;color:#c7d0f6;margin-top:2px}
#prog{position:absolute;z-index:10;left:0;right:0;bottom:0;height:40px;display:flex;background:rgba(10,14,36,.92);opacity:0}
#prog div{flex:1;position:relative;color:#7f8bc0;font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:.12em;border-right:1px solid rgba(255,255,255,.08)}
#prog div.on{color:#fff}
#prog div .bar{position:absolute;left:0;top:0;height:4px;background:var(--accent);width:0}
</style></head>

 {id:'outro',type:'card',t0:172,t1:180.5,html:`
   <div class="kicker">P&amp;ID EXTRACTOR</div>
   <h1>PDF 한 벌 → <em>리스트 · 로직 · 화면</em></h1>
   <p>근거는 도면에 · 판단은 사람에게 — 모든 출력은 사람이 검토합니다.</p>
   <div class="mods">
     <div class="mod"><i>01</i><b>Dashboard</b><span>현황 · 이력 · 개정 변경</span></div>
     <div class="mod"><i>02</i><b>PID</b><span>리스트 · 근거 · Excel</span></div>
     <div class="mod"><i>03</i><b>Logic</b><span>검토 · 작도 · 시뮬레이션</span></div>

   </div>`},
];
const END=180.5;
// ---------- build ----------
const stage=document.getElementById('stage');
for(const s of S){
  const L=document.createElement('div');L.className='layer';s.el=L;
  if(s.type==='card'){L.classList.add('card');L.innerHTML=s.html}
  else if(s.type==='shot'){
    const sh=document.createElement('div');sh.className='shot';sh.style.width=s.iw+'px';sh.style.height=s.ih+'px';
    sh.innerHTML=`<img src="${s.img}" width="${s.iw}" height="${s.ih}">`;
    s.hlEls=(s.hl||[]).map(h=>{const d=document.createElement('div');d.className='hl';
      const [x,y,w,hh]=h[2];Object.assign(d.style,{left:x+'px',top:y+'px',width:w+'px',height:hh+'px'});sh.appendChild(d);return d});
    L.appendChild(sh);s.shotEl=sh;
  } else if(s.type==='live'){
    const f=document.createElement('iframe');f.className='live';f.id='live-'+s.id;f.src=s.src;
    const vw=s.vw||1920,k=1920/vw;f.style.width=vw+'px';f.style.height=(1080/k)+'px';f.style.transform=`scale(${k})`;f.style.transformOrigin='0 0';L.appendChild(f);
  }
  stage.appendChild(L);
}
const prog=document.getElementById('prog');
for(const c of CH){const d=document.createElement('div');d.innerHTML=`<span class="bar"></span>${c.name}`;c.el=d;prog.appendChild(d)}
const ease=x=>x<0?0:x>1?1:x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function rectAt(keys,lt){
  if(lt<=keys[0][0])return keys[0][1];
  for(let i=0;i<keys.length-1;i++){const [a,ra]=keys[i],[b,rb]=keys[i+1];
    if(lt<=b){const k=ease((lt-a)/(b-a));return ra.map((v,j)=>v+(rb[j]-v)*k)}}
  return keys[keys.length-1][1];
}
const FADE=0.5;let lastCap='';
window.render=function(t){
  let cap=null,chap=null;
  for(const s of S){
    const inS=t>=s.t0-FADE&&t<s.t1+FADE;
    let op=0;
    if(inS){op=Math.min(clamp((t-s.t0+FADE)/FADE,0,1),clamp((s.t1+FADE-t)/FADE,0,1));if(s.t0===0)op=Math.min(1,clamp((s.t1+FADE-t)/FADE,0,1))}
    s.el.style.opacity=op;s.el.style.zIndex=op>0?(t>=s.t0?2:1):0;s.el.style.visibility=op>0?'visible':'hidden';
    const lt=t-s.t0;
    if(s.type==='card'&&op>0){
      const k=clamp(lt/1.2,0,1);s.el.style.transform=`scale(${1.04-0.04*ease(k)})`;
      [...s.el.querySelectorAll('.mod')].forEach((m,i)=>{const kk=ease(clamp((lt-1.5-i*.35)/.6,0,1));m.style.opacity=kk;m.style.transform=`translateY(${(1-kk)*24}px)`});
    }
    if(s.type==='shot'&&op>0){
      const [cx,cy,w]=rectAt(s.keys,lt);const sc=W/w;
      s.shotEl.style.transform=`translate(${W/2-cx*sc}px,${H/2-cy*sc}px) scale(${sc})`;
      s.hl.forEach((h,i)=>{const e=s.hlEls[i];const a=clamp((lt-h[0])/.35,0,1)*clamp((h[1]-lt)/.35,0,1);
        e.style.opacity=a;e.style.borderWidth=(5/sc)+'px';
        const pulse=1+0.25*Math.sin(lt*5);e.style.boxShadow=`0 0 ${18*pulse/sc}px ${6/sc}px rgba(255,204,51,.55)`});
    }
    if(t>=s.t0&&t<s.t1&&s.cap){for(const c of s.cap)if(lt>=c[0])cap={c,lt:lt-c[0],end:s.t1-t}}
  }
  for(const c of CH){if(t>=c.t0&&t<c.t1)chap=c;
    c.el.classList.toggle('on',t>=c.t0&&t<c.t1);c.el.querySelector('.bar').style.width=(clamp((t-c.t0)/(c.t1-c.t0),0,1)*100)+'%'}
  prog.style.opacity=chap?1:0;
  const capEl=document.getElementById('cap');
  if(cap){const key=cap.c[1]+cap.c[2];
    if(key!==lastCap){document.getElementById('cap-tag').textContent=cap.c[1];
      document.getElementById('cap-txt').innerHTML=cap.c[2]+(cap.c[3]?`<small>${cap.c[3]}</small>`:'');lastCap=key}
    const a=Math.min(clamp(cap.lt/.4,0,1),clamp(cap.end/.4,0,1));
    capEl.style.opacity=a;capEl.style.transform=`translateX(-50%) translateY(${(1-a)*16}px)`;
  } else capEl.style.opacity=0;
};
window.SCENES=S.map(s=>({id:s.id,type:s.type,t0:s.t0,t1:s.t1}));window.END=END;
render(0);
</script></body></html>
