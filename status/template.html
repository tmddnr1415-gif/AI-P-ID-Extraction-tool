<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세션 지도</title>
<style>
:root{
  --bg:#eef1f7; --bg2:#dde4f1; --panel:rgba(255,255,255,.80); --panel-solid:#ffffff; --chip:rgba(20,40,80,.06);
  --ink:#141b26; --muted:#5b6778; --line:rgba(20,30,50,.10); --line2:rgba(20,30,50,.16);
  --accent:#2a55d6; --ok:#13804a; --warn:#a15f00; --bad:#c23434;
  --edge:40,60,95; --star:30,40,70; --mode:source-over; --shadow:0 10px 40px rgba(20,30,60,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#04060b; --bg2:#0c1323; --panel:rgba(13,18,29,.72); --panel-solid:#0e131e; --chip:rgba(140,170,230,.10);
    --ink:#e9eef6; --muted:#8c98ab; --line:rgba(160,180,220,.10); --line2:rgba(160,180,220,.18);
    --accent:#86a8ff; --ok:#56d08f; --warn:#f3bb5a; --bad:#ff8080;
    --edge:150,175,225; --star:200,215,255; --mode:lighter; --shadow:0 10px 50px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#04060b; --bg2:#0c1323; --panel:rgba(13,18,29,.72); --panel-solid:#0e131e; --chip:rgba(140,170,230,.10);
  --ink:#e9eef6; --muted:#8c98ab; --line:rgba(160,180,220,.10); --line2:rgba(160,180,220,.18);
  --accent:#86a8ff; --ok:#56d08f; --warn:#f3bb5a; --bad:#ff8080;
  --edge:150,175,225; --star:200,215,255; --mode:lighter; --shadow:0 10px 50px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13.5px/1.5 "Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas#cv.dragging{cursor:grabbing}
.glass{background:var(--panel);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--line2);box-shadow:var(--shadow)}
.top{position:fixed;top:12px;left:12px;right:12px;height:54px;border-radius:16px;display:flex;align-items:center;gap:12px;padding:0 12px 0 14px;z-index:5}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.mark{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:conic-gradient(from 200deg,#f59e0b,#ec4899,#a855f7,#3b82f6,#14b8a6,#22c55e,#f59e0b);box-shadow:0 0 18px rgba(130,150,255,.35)}
.mark i{width:12px;height:12px;border-radius:50%;background:var(--panel-solid)}
.brand b{font-size:15px;letter-spacing:-.01em}
.brand small{display:block;font-size:11px;color:var(--muted);line-height:1.1}
.kpis{display:flex;gap:6px;flex:1;min-width:0;overflow:hidden}
.kpi{display:flex;align-items:baseline;gap:6px;padding:4px 10px;border-radius:10px;background:var(--chip);white-space:nowrap}
.kpi b{font-size:16px;font-variant-numeric:tabular-nums}.kpi span{font-size:11.5px;color:var(--muted)}.kpi.warn b{color:var(--warn)}
.search{display:flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:5px 10px;min-width:0}
.search input{background:none;border:0;outline:0;width:170px;min-width:0}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:4px 11px;border-radius:8px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel-solid);color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.ib{border:1px solid var(--line);background:var(--chip);border-radius:10px;width:34px;height:34px;cursor:pointer;display:grid;place-items:center;padding:0}
.ib:hover{border-color:var(--line2)}
.ib[aria-pressed="false"]{opacity:.5}
.left{position:fixed;top:78px;left:12px;bottom:12px;width:262px;border-radius:16px;z-index:4;overflow:auto;padding:12px 10px}
.left h4{margin:12px 8px 6px;font-size:10.5px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.left h4:first-child{margin-top:2px}
.item{display:flex;align-items:center;gap:10px;width:100%;border:1px solid transparent;background:none;text-align:left;padding:7px 8px;border-radius:10px;cursor:pointer}
.item:hover{background:var(--chip)}
.item[aria-current="true"]{background:var(--chip);border-color:var(--line2)}
.orb{width:14px;height:14px;border-radius:50%;flex:none;display:inline-block;box-shadow:0 0 10px var(--c);background:radial-gradient(circle at 35% 32%,#fff 0,var(--c) 38%,color-mix(in srgb,var(--c) 55%,#000) 100%)}
.cube{width:12px;height:12px;flex:none;border:1.5px solid var(--muted);transform:rotate(45deg) skew(8deg,8deg);border-radius:2px}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .n{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);min-width:22px;text-align:right}
.st{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.legend label{display:flex;align-items:center;gap:9px;padding:4px 8px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.legend label:hover{color:var(--ink)}
.legend input{accent-color:var(--accent)}
.legend .n{margin-left:auto;font-variant-numeric:tabular-nums}
.activity{position:fixed;left:286px;bottom:12px;width:340px;border-radius:14px;z-index:3;padding:10px 12px}
.activity h4,.forces h4{margin:0 0 6px;font-size:10.5px;letter-spacing:.12em;color:var(--muted)}
.act{display:flex;gap:8px;align-items:flex-start;padding:4px 0;cursor:pointer;font-size:12px}
.act i{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none}
.act .t{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.act:hover .t{color:var(--ink)}
.act .d{color:var(--muted);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ctrl{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:3;border-radius:14px;padding:6px}
.ctrl.shift{right:448px}
.forces{position:fixed;right:62px;bottom:12px;width:250px;border-radius:14px;z-index:3;padding:12px;display:none}
.forces.on{display:block}.forces.shift{right:498px}
.forces label{display:block;font-size:12px;color:var(--muted);margin-top:8px}
.forces label span{float:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.forces input[type=range]{width:100%;accent-color:var(--accent)}
.forces .chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--ink)}
.tip{position:fixed;pointer-events:none;border-radius:12px;padding:8px 11px;font-size:12px;max-width:340px;display:none;z-index:9}
.tip b{display:block;font-size:12.5px;margin-bottom:2px;word-break:break-all}.tip span{color:var(--muted)}
.right{position:fixed;top:78px;right:12px;bottom:12px;width:424px;border-radius:16px;z-index:6;overflow:auto;display:none}
.right.on{display:block;animation:slide .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.hero{position:relative;padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.hero::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;border-radius:16px 16px 0 0;background:linear-gradient(90deg,var(--c),transparent)}
.hero .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kind{font-size:11px;letter-spacing:.06em;color:var(--muted)}
.hero h2{margin:6px 0 6px;font-size:20px;letter-spacing:-.015em;padding-right:36px;word-break:break-word}
.close{position:absolute;top:12px;right:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;background:var(--chip)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.info{color:var(--accent)}.pill.gray{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--chip);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums}.stat span{font-size:11px;color:var(--muted)}
.sec{padding:12px 18px;border-bottom:1px solid var(--line)}.sec:last-child{border-bottom:0}
.sec h3{font-size:11px;letter-spacing:.1em;color:var(--muted);margin:0 0 8px;font-weight:700}
.path{font-family:"D2Coding",Consolas,ui-monospace,monospace;font-size:12px;color:var(--muted);word-break:break-all}
dl{display:grid;grid-template-columns:84px 1fr;gap:5px 10px;margin:0;font-size:12.5px}dt{color:var(--muted)}dd{margin:0}
.callout{border-radius:10px;padding:9px 11px;font-size:12.5px;background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.callout b{color:var(--warn)}
.viewer{border-radius:12px;overflow:hidden;border:1px solid var(--line2);background:#000}
.viewer img{display:block;width:100%;height:auto;max-height:260px;object-fit:cover;object-position:top;cursor:zoom-in}
.viewer .cap{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:7px 10px;background:var(--panel-solid);color:var(--muted)}
.thumbs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.thumbs button{flex:none;width:86px;height:54px;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:var(--chip)}
.thumbs button[aria-pressed="true"]{border-color:var(--c)}
.thumbs img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.tl{list-style:none;margin:0;padding:0 0 0 14px;position:relative;max-height:300px;overflow:auto}
.tl::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--line2)}
.tl li{position:relative;padding:4px 0 8px 10px;cursor:pointer;font-size:12.5px}
.tl li::before{content:"";position:absolute;left:-13px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.tl li.dim::before{background:var(--muted);box-shadow:none}
.tl li:hover{color:var(--accent)}
.tl .h{font-family:"D2Coding",Consolas,monospace;font-size:11px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags button{border:1px solid var(--line2);background:var(--chip);border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags button:hover{border-color:var(--c)}
table{width:100%;border-collapse:collapse;font-size:12.5px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-weight:600;font-size:11px}
tr[data-go]{cursor:pointer}tr[data-go]:hover td{color:var(--accent)}
.listview{position:fixed;top:78px;left:286px;right:12px;bottom:12px;overflow:auto;display:none;z-index:2}
.listview.on{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{border-radius:16px;padding:14px;cursor:pointer;text-align:left;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--c),transparent)}
.card:hover{transform:translateY(-2px);transition:.15s}
.card img{width:100%;height:130px;object-fit:cover;object-position:top;border-radius:10px;margin-top:10px;border:1px solid var(--line)}
.orgview{position:fixed;top:78px;left:286px;right:12px;bottom:12px;overflow:auto;display:none;z-index:2;padding:4px 4px 24px}
.orgview.on{display:block}
body.flat .ctrl,body.flat .forces{display:none!important}
body.flat::after{content:"";position:fixed;inset:0;background:var(--bg);z-index:1}
.org-top{display:flex;flex-direction:column;align-items:center;gap:0}
.onode{border-radius:14px;padding:10px 14px;text-align:center;cursor:pointer;min-width:220px}
.onode b{display:block;font-size:14px}.onode span{font-size:12px;color:var(--muted)}
.vline{width:1px;height:22px;background:var(--line2)}
.ocols{display:grid;grid-template-columns:repeat(7,minmax(205px,1fr));gap:12px;position:relative;padding-top:22px}
.ocols::before{content:"";position:absolute;top:0;left:calc(100%/14);right:calc(100%/14);height:1px;background:var(--line2)}
.ocol{position:relative;display:flex;flex-direction:column;gap:8px}
.ocol::before{content:"";position:absolute;top:-22px;left:50%;width:1px;height:22px;background:var(--line2)}
.ohead{border-radius:14px;padding:10px;cursor:pointer;position:relative;overflow:hidden}
.ohead::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--c),transparent)}
.ohead .t{display:flex;gap:8px;align-items:center;font-weight:700;font-size:13.5px}
.ohead .m{font-size:11.5px;color:var(--muted);margin-top:3px}
.ohead img,.acard img{display:block;width:100%;height:118px;object-fit:cover;object-position:top;border-radius:9px;margin-top:8px;border:1px solid var(--line);background:var(--chip)}
.acard{border-radius:12px;padding:9px 10px;cursor:pointer;border-left:3px solid var(--c)}
.acard:hover,.ohead:hover{border-color:var(--c)}
.acard .t{display:flex;gap:6px;align-items:center;font-weight:600;font-size:12.5px}
.acard .t small{margin-left:auto;font-weight:500;color:var(--muted);font-size:10.5px}
.acard .d{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.common{font-size:11.5px;color:var(--muted);padding:2px 4px}
.defs{display:flex;flex-wrap:wrap;gap:4px}
.defs button{border:1px solid var(--line2);background:var(--chip);border-radius:7px;padding:2px 6px;font-size:11px;cursor:pointer}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.agrid .acard img{height:96px}
.lb{position:fixed;inset:0;background:rgba(2,4,8,.9);display:none;align-items:center;justify-content:center;z-index:20;padding:20px;cursor:zoom-out;flex-direction:column;gap:10px}
.lb.on{display:flex}.lb img{max-width:100%;max-height:calc(100% - 40px);border-radius:8px}.lb span{color:#cfd8e6;font-size:13px}
#menuBtn{display:none}
@media (max-width:1180px){.kpi.opt{display:none}.activity{display:none}}
@media (max-width:860px){
  .orgview{top:70px;left:8px;right:8px;bottom:8px}.ocols{grid-template-columns:repeat(7,240px)}
  .top{left:8px;right:8px;top:8px;gap:8px;padding:0 8px}
  .brand small,.kpis,.brand div{display:none}
  .seg button{white-space:nowrap;padding:4px 7px;font-size:12px}
  .search{flex:1}.search input{width:100%}
  #menuBtn{display:grid}
  .left{top:70px;left:8px;bottom:8px;transform:translateX(-110%);transition:.22s}
  .left.open{transform:none}
  .right{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:68vh}
  .ctrl,.ctrl.shift{right:8px;bottom:8px}
  .forces,.forces.shift{right:58px;bottom:8px}
  .right.on~.ctrl{display:none}
  .listview{top:70px;left:8px;right:8px;bottom:8px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<header class="top glass">
  <button class="ib" id="menuBtn" aria-label="메뉴">☰</button>
  <div class="brand"><span class="mark"><i></i></span><div><b>세션 지도</b><small id="built"></small></div></div>
  <div class="kpis" id="kpis"></div>
  <label class="search">🔍<input id="q" placeholder="세션 · 커밋 · 파일 · Agent 찾기" aria-label="찾기"></label>
  <div class="seg" role="group"><button data-v="map" aria-pressed="true">3D 지도</button><button data-v="org" aria-pressed="false">조직도</button><button data-v="list" aria-pressed="false">목록</button></div>
  <button class="ib" id="theme" aria-label="밝게/어둡게">◐</button>
</header>
<aside class="left glass" id="left"></aside>
<div class="activity glass" id="activity"></div>
<div class="forces glass" id="forces">
  <h4>힘 (그래프 물리)</h4>
  <label>중심 힘 <span id="v-center"></span><input type="range" id="f-center" min="0" max="2" step=".05" value=".6"></label>
  <label>반발 힘 <span id="v-repel"></span><input type="range" id="f-repel" min="0" max="3" step=".05" value="1"></label>
  <label>연결 힘 <span id="v-link"></span><input type="range" id="f-link" min="0" max="2" step=".05" value="1"></label>
  <label>연결 거리 <span id="v-dist"></span><input type="range" id="f-dist" min=".4" max="2" step=".05" value="1"></label>
  <div class="chk"><input type="checkbox" id="f-flow" checked><label for="f-flow" style="margin:0;color:inherit">흐름 입자 (커밋 → 세션 → 업데이트 파일)</label></div>
</div>
<div class="ctrl glass" id="ctrl">
  <button class="ib" data-c="in" aria-label="확대">＋</button>
  <button class="ib" data-c="out" aria-label="축소">－</button>
  <button class="ib" data-c="spin" aria-label="자동 회전" aria-pressed="true">⟳</button>
  <button class="ib" data-c="force" aria-label="힘 설정" aria-pressed="false">⚙</button>
  <button class="ib" data-c="home" aria-label="처음 보기">⌂</button>
</div>
<div class="orgview" id="orgview"></div>
<div class="listview" id="listview"><div class="cards" id="cards"></div></div>
<aside class="right glass" id="right"><div id="detail"></div></aside>
<div class="tip glass" id="tip"></div>
<div class="lb" id="lb"><img alt=""><span></span></div>
<script>
/*DATA*/
(function(){
"use strict";
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pvs=p=>(window.PV||{})[p.key]||"";
const pvk=k=>(window.PV||{})[k]||"";
const COLOR={S1:"#f59e0b",S2:"#3b82f6",S3:"#22c55e",S4:"#a855f7",S5:"#ec4899",S6:"#ef4444",S7:"#14b8a6"};
const KIND={hub:"오케스트레이터",session:"세션 Agent",file:"업데이트 파일",pending:"다음 업데이트 커밋",recent:"최근 작업 커밋",agent:"Agent",skill:"Skill",change:"변경 파일",role:"역할 Agent"};
const B=k=>META.bucket[k]||["gray",k||"?"];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const isDark=()=>css("--mode")==="lighter";
const totalPend=DATA.reduce((s,x)=>s+x.pending.length,0);
const blocked=DATA.filter(x=>x.state.bucket==="BLOCKED").length;
const fileN=f=>DATA.filter(x=>x.file.startsWith(f)).reduce((s,x)=>s+x.pending.length,0);

/* ================= graph ================= */
const V=(x,y,z)=>({x,y,z});
const nodes=[],edges=[],byId={};
const CHG={hub:6,session:4,file:4,pending:1.4,recent:1.1,agent:1.2,skill:1.2,change:.55,role:1.3};
const LEN={core:150,arc:360,flow:330,kid:78,ag:120,chg:30};
function add(n){n.p=n.p||V(0,0,0);if(n.type==="session"||n.type==="file")n.anchor=V(n.p.x,n.p.y,n.p.z);n.v=V(0,0,0);n.q=null;nodes.push(n);byId[n.id]=n;return n;}
function link(a,b,kind){edges.push({a:byId[a],b:byId[b],kind});}
const fib=(i,n)=>{const y=1-(i+.5)*2/n,r=Math.sqrt(1-y*y),t=i*2.399963;return V(Math.cos(t)*r,y,Math.sin(t)*r);};
add({id:"orch",type:"hub",label:"오케스트레이터",r:24,color:"#ffd58a",fixed:true});
add({id:"F1",type:"file",label:"① DASHBOARD 개별",r:15,color:"#9fb6ff",p:V(0,170,0)});
add({id:"F2",type:"file",label:"② 통합 업데이트",r:15,color:"#9fb6ff",p:V(0,-170,0)});
link("orch","F1","core");link("orch","F2","core");
const touched={};   // 변경 파일 id → 커밋들
DATA.forEach((x,i)=>{
