<!doctype html>
<!-- 생성 파일: ic-3d-builder/src/ 를 고치고 dev/build.py 로 다시 만드세요 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I&amp;C 3D Builder</title>
<style>
:root {
  --bg: #f3f4f6; --panel: #ffffff; --ink: #1d232b; --muted: #66707c; --line: #dfe3e8;
  --accent: #2f6db5; --accent-ink: #ffffff; --stage: #e9edf1; --warn: #b5462f;
  --s-drawing: #1f8a4c; --s-user: #2f6db5; --s-standard: #8a6d1f; --s-estimate: #a0466e; --s-default: #7a838d;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b; --panel: #1c2026; --ink: #e5e8ec; --muted: #98a2ad; --line: #2c323a;
    --accent: #5a95dc; --accent-ink: #0d1117; --stage: #101317; --warn: #e07a62;
    --s-drawing: #4cc184; --s-user: #6fa4e6; --s-standard: #d2b05a; --s-estimate: #db7ba6; --s-default: #8b95a0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171b; --panel: #1c2026; --ink: #e5e8ec; --muted: #98a2ad; --line: #2c323a;
  --accent: #5a95dc; --accent-ink: #0d1117; --stage: #101317; --warn: #e07a62;
  --s-drawing: #4cc184; --s-user: #6fa4e6; --s-standard: #d2b05a; --s-estimate: #db7ba6; --s-default: #8b95a0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
h2 { font-size: 13px; margin: 0 0 8px; letter-spacing: .02em; display: flex; align-items: center; gap: 6px; }
button, select, input, textarea { font: inherit; color: inherit; }
.muted { color: var(--muted); } .small { font-size: 12px; }

.top { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { font-weight: 650; } .brand small { font-weight: 400; color: var(--muted); margin-left: 8px; }
.logo { color: var(--accent); }

.layout { display: grid; grid-template-columns: 360px 1fr; height: calc(100% - 45px); }
.panel.left { overflow: auto; padding: 12px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.tag { font-size: 10px; background: var(--accent); color: var(--accent-ink); border-radius: 4px; padding: 1px 6px; }
select, input[type=number], input[type=text], input[type=password], textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
}
textarea { resize: vertical; }
.row { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 8px 12px; font-weight: 600; cursor: pointer; }
.primary:disabled { opacity: .5; cursor: default; }
.ghost-btn { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.file-btn { display: inline-block; }
.drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 14px; text-align: center; cursor: pointer; }
.drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.files { list-style: none; padding: 0; margin: 8px 0; display: flex; flex-direction: column; gap: 4px; }
.files li { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; background: var(--bg); border-radius: 6px; padding: 4px 8px; }
.files li button { border: 0; background: none; cursor: pointer; color: var(--muted); }
.files img { max-width: 100%; border-radius: 4px; margin-top: 4px; }
.status { margin-top: 8px; white-space: pre-wrap; }
.status.err { color: var(--warn); }

.legend { display: flex; gap: 6px; margin-bottom: 8px; }
.src { display: inline-block; font-size: 10px; border-radius: 4px; padding: 0 5px; color: #fff; white-space: nowrap; }
.src-drawing { background: var(--s-drawing); } .src-user { background: var(--s-user); }
.src-standard { background: var(--s-standard); } .src-estimate { background: var(--s-estimate); }
.src-default, .src-none { background: var(--s-default); }
.grp { margin: 10px 0 4px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.prm { display: grid; grid-template-columns: 1fr 108px 40px; gap: 6px; align-items: center; padding: 3px 0; }
.prm label { font-size: 12px; }
.prm .unit { color: var(--muted); font-size: 11px; }
.prm input, .prm select { padding: 3px 6px; }
.prm input[type=checkbox] { justify-self: start; }
.prm .ev { grid-column: 1 / -1; font-size: 11px; color: var(--muted); margin-top: -2px; }
.prm.inactive { display: none; }

.stage { display: grid; grid-template-rows: auto 1fr 220px; min-width: 0; min-height: 0; }
.toolbar { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.toolbar .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 9px; cursor: pointer; border-right: 1px solid var(--line); font-size: 12px; }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--bg); }
.viewport { position: relative; background: var(--stage); min-height: 0; overflow: hidden; }
.viewport canvas { display: block; cursor: grab; }
.tip { position: absolute; pointer-events: none; background: rgba(20, 24, 30, .9); color: #fff; padding: 6px 8px; border-radius: 6px; font-size: 12px; max-width: 260px; z-index: 3; }
.v-label { position: absolute; left: 0; top: 0; pointer-events: none; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; font-size: 11px; white-space: nowrap; z-index: 2; }
.noscene { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); }

.bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; overflow: hidden; border-top: 1px solid var(--line); }
.bottom .card { overflow: auto; }
#parts { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 12px; }
#parts li { display: flex; gap: 6px; align-items: center; font-size: 12px; padding: 2px 4px; border-radius: 4px; cursor: pointer; break-inside: avoid; }
#parts li:hover, #parts li.sel { background: var(--bg); }
#parts .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.find { font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.sev-high { color: var(--warn); font-weight: 600; }
table.kv { border-collapse: collapse; width: 100%; } table.kv td { padding: 2px 6px; border-bottom: 1px solid var(--line); }

dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); width: min(420px, 92vw); }
dialog label { display: block; margin: 8px 0; font-size: 12px; }
dialog::backdrop { background: rgba(0, 0, 0, .35); }

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; height: auto; }
  .panel.left { border-right: 0; }
  .stage { grid-template-rows: auto 60vh auto; }
  .bottom { grid-template-columns: 1fr; }
  #parts { columns: 1; }
}

</style>

<script>/* refdata.js */
/* 표준 치수 참고표 — 도면에서 치수를 못 읽었을 때 쓰는 기본값.
 *
 * ⚠ 이 표는 공개 자료와 엔지니어링 지식으로 채운 "참고값"이다. 원문 표준
 *   (ASME B16.5 / B16.10 / ANSI/ISA-75.08.01 / API 526 / API 609)이나
 *   벤더 Dimensional Drawing 과 대조하지 않았다. 3D 에서 이 값을 쓴 치수는
 *   출처가 'standard' 로 표시되며, 배치 검토(간섭·공간) 용도로만 쓴다.
 *   제작·구매용 치수로 쓰지 않는다.
 *
 * 단위: mm. 키: NPS(inch) 문자열.
 */
'use strict';

const RefData = (() => {
  const NPS = ['0.5', '0.75', '1', '1.5', '2', '3', '4', '6', '8', '10', '12'];
  const row = (arr) => Object.fromEntries(NPS.map((k, i) => [k, arr[i]]));

  // ASME B36.10 파이프 외경
  const pipeOD = row([21.3, 26.7, 33.4, 48.3, 60.3, 88.9, 114.3, 168.3, 219.1, 273.1, 323.9]);

  // ASME B16.5 RF 플랜지: 외경, 두께, 볼트원 지름, 볼트 수, 볼트 지름
  const flange = {
    150: {
      od: row([89, 98, 108, 127, 152, 191, 229, 279, 343, 406, 483]),
      t: row([9.6, 11.2, 12.7, 15.9, 17.5, 22.3, 22.3, 23.9, 27.0, 28.6, 30.2]),
      bcd: row([60.3, 69.8, 79.4, 98.4, 120.7, 152.4, 190.5, 241.3, 298.5, 362.0, 431.8]),
      n: row([4, 4, 4, 4, 4, 4, 8, 8, 8, 12, 12]),
      bolt: row([12.7, 12.7, 12.7, 12.7, 15.9, 15.9, 15.9, 19.1, 19.1, 22.2, 22.2]),
    },
    300: {
      od: row([95, 117, 124, 156, 165, 210, 254, 318, 381, 444, 521]),
      t: row([12.7, 14.3, 15.9, 19.1, 20.7, 27.0, 30.2, 35.0, 39.7, 46.1, 49.3]),
      bcd: row([66.7, 82.6, 88.9, 114.3, 127.0, 168.3, 200.0, 269.9, 330.2, 387.4, 450.8]),
      n: row([4, 4, 4, 4, 8, 8, 8, 12, 12, 16, 16]),
      bolt: row([12.7, 15.9, 15.9, 19.1, 15.9, 19.1, 19.1, 19.1, 22.2, 25.4, 28.6]),
    },
  };

  // 면간거리 (Face-to-Face, RF)
  const ftf = {
    gate: { 150: row([108, 117, 127, 165, 178, 203, 229, 267, 292, 330, 356]),
            300: row([140, 152, 165, 190, 216, 283, 305, 403, 419, 457, 502]) },
    globe: { 150: row([108, 117, 127, 165, 203, 241, 292, 406, 495, 622, 698]),
             300: row([152, 178, 203, 229, 267, 318, 356, 444, 559, 622, 711]) },
    // 볼밸브 short pattern (B16.10) — 150/300 모두 gate 와 동일 계열
    ball: { 150: row([108, 117, 127, 165, 178, 203, 229, 267, 292, 330, 356]),
            300: row([140, 152, 165, 190, 216, 283, 305, 403, 419, 457, 502]) },
    // 조절밸브 글로브 (ANSI/ISA-75.08.01 integral flanged)
    control_globe: { 150: row([184, 184, 184, 222, 254, 298, 352, 451, 543, 673, 737]),
                     300: row([190, 194, 197, 235, 267, 317, 368, 473, 568, 708, 775]) },
    // 버터플라이 wafer/lug (API 609 Cat A 계열 근사) — 2" 미만은 없음
    butterfly: { 150: row([43, 43, 43, 43, 43, 46, 52, 56, 60, 68, 78]),
                 300: row([43, 43, 43, 43, 43, 48, 54, 59, 73, 83, 92]) },
  };

  const SOURCES = {
    pipeOD: 'ASME B36.10M (참고값)',
    flange: 'ASME B16.5 Class 150/300 RF (참고값)',
    gate: 'ASME B16.10 Gate (참고값)',
    globe: 'ASME B16.10 Globe (참고값)',
    ball: 'ASME B16.10 Ball short pattern (참고값)',
    control_globe: 'ANSI/ISA-75.08.01 (참고값)',
    butterfly: 'API 609 Cat A 근사 (참고값)',
  };

  function nearestNps(nps) {
    const v = Number(nps);
    let best = NPS[0];
    for (const k of NPS) if (Math.abs(Number(k) - v) < Math.abs(Number(best) - v)) best = k;
    return best;
  }

  function cls(c) { return Number(c) >= 300 ? 300 : 150; }

  /** 플랜지·파이프 치수 묶음 */
  function flangeOf(nps, c) {
    const k = nearestNps(nps); const f = flange[cls(c)];
    return { od: f.od[k], t: f.t[k], bcd: f.bcd[k], n: f.n[k], bolt: f.bolt[k], pipeOD: pipeOD[k] };
  }

  function ftfOf(kind, nps, c) {
    const t = ftf[kind]; if (!t) return null;
    return t[cls(c)][nearestNps(nps)];
  }

  return { NPS, pipeOD, flange, ftf, SOURCES, nearestNps, flangeOf, ftfOf };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = RefData;

</script>
<script>/* anatomy.js */
/* Anatomy — 계측제어 품목을 "부품 단위"로 분해한 파라메트릭 3D 정의.
 *
 * 품목 하나 = 파라미터 목록 + build(파라미터) → 부품(part) 목록.
 * 부품 = 이름 붙은 기본 도형(prim) 묶음. three.js 에 의존하지 않는 순수 데이터라
 * 브라우저 뷰어, Node 검증 스크립트, Claude 스킬이 같은 정의를 공유한다.
 *
 * 좌표계: mm, Y 위쪽.
 *   밸브     — 원점 = 배관 중심선과 밸브 중심, 배관 축 = X
 *   캐비닛   — 원점 = 바닥 위, 첫 베이의 전면 중앙 하단. 전면 = +Z
 *   훅업     — 원점 = 바닥(Y=0) 위, 공정배관 탭 바로 아래. 공정배관 축 = X
 *
 * 치수 출처(source) 는 네 가지로 추적한다.
 *   drawing  — 도면에서 읽은 값 (Claude 판독 또는 사람이 입력하며 도면 근거 표시)
 *   user     — 사람이 직접 고친 값
 *   standard — RefData 표준 참고표에서 가져온 값
 *   estimate — 비례식 추정값. 도면으로 확인되기 전까지는 형상 참고용
 */
'use strict';

const Anatomy = (() => {
  const R = (typeof RefData !== 'undefined') ? RefData
    : (typeof require !== 'undefined' ? require('./refdata.js') : null);

  // ───────────────────────── 기본 도형 헬퍼 ─────────────────────────
  const cyl = (axis, r, h, at, extra = {}) => ({ k: 'cyl', axis, r, h, at, ...extra });
  const cone = (axis, r, r2, h, at) => ({ k: 'cyl', axis, r, r2, h, at });
  const box = (s, at, extra = {}) => ({ k: 'box', s, at, ...extra });
  const sph = (r, at, scale) => ({ k: 'sph', r, at, ...(scale ? { scale } : {}) });
  const tor = (R0, r, axis, at) => ({ k: 'tor', R: R0, r, axis, at });
  const tube = (a, b, r) => ({ k: 'tube', a, b, r });
  const part = (id, label, mat, prims, ex = [0, 0, 0], desc = '') => ({ id, label, mat, prims, ex, desc });
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  /** 축 방향 단위벡터 성분 */
  const AX = { x: [1, 0, 0], y: [0, 1, 0], z: [0, 0, 1] };
  const along = (axis, d, base = [0, 0, 0]) => base.map((b, i) => b + AX[axis][i] * d);
  /** 축에 수직인 평면의 두 기저 */
  const perp = { x: [[0, 1, 0], [0, 0, 1]], y: [[1, 0, 0], [0, 0, 1]], z: [[1, 0, 0], [0, 1, 0]] };

  /**
   * 플랜지 끝단 하나. face = 밸브 중심에서 플랜지 면까지 거리, sign = ±1.
   * 플랜지 디스크 + 허브 + 볼트.
   */
  function flangeEnd(id, label, axis, sign, face, f, opts = {}) {
    const prims = [];
    const c = (d) => along(axis, sign * d);
    prims.push(cyl(axis, f.od / 2, f.t, c(face - f.t / 2)));
    const hubL = opts.hubL ?? f.t * 1.1;
    prims.push(cone(axis, f.pipeOD / 2 * 1.35, f.pipeOD / 2 * 1.35, hubL, c(face - f.t - hubL / 2)));
    const bolts = [];
    const [u, v] = perp[axis];
    for (let i = 0; i < f.n; i++) {
      const a = (i + 0.5) / f.n * Math.PI * 2;
      const off = [0, 1, 2].map((j) => (u[j] * Math.cos(a) + v[j] * Math.sin(a)) * f.bcd / 2);
      const base = c(face - f.t / 2 + sign * f.bolt * 0.4);
      bolts.push(cyl(axis, f.bolt / 2, f.t + f.bolt * 1.6, base.map((b, j) => b + off[j])));
    }
    const out = [part(`${id}`, label, 'flange', prims, along(axis, sign * 1),
      `RF 플랜지 Ø${f.od} × t${f.t}`)];
    out.push(part(`${id}_bolts`, `${label} 볼트`, 'bolt', bolts, along(axis, sign * 1.2),
      `${f.n} × Ø${f.bolt} @ BCD ${f.bcd}`));
    if (opts.stub) {
      out.push(part(`${id}_pipe`, `${label} 배관(참조)`, 'ghost',
        [cyl(axis, f.pipeOD / 2, opts.stub, c(face + opts.stub / 2 + 2))], along(axis, sign * 1.4),
        '배치 참조용 배관. 범위 밖'));
    }
    return out;
  }
